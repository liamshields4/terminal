name: Update market data

on:
  schedule:
    - cron: "*/30 12-22 * * 1-5"   # every 30 min, ~market hours ET (UTC)
    - cron: "0 23,0-11 * * 1-5"    # hourly overnight, weekdays
    - cron: "0 */4 * * 6,0"        # every 4h on weekends
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet yfinance feedparser requests

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit snapshot
        run: |
          git config user.name "terminal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json history/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push
