<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IB Drills</title>
<meta name="description" content="Repeatable, randomized drills for investment banking technicals: three statements, EV, multiples, valuation, DCF, M&A, LBO.">
<meta name="theme-color" content="#07161C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IB Drills">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: one column, phone-first, sticky top bar, fixed bottom tabs. Same engraved-banknote identity as the terminal. */
:root{
  --bg:#07161C; --bg-top:#0B2D37; --panel:rgba(6,15,14,.90); --panel2:#0F1E1D;
  --line:rgba(206,184,136,.16); --line2:rgba(206,184,136,.08);
  --ink:#F1EBE0; --dim:#9FB3AE; --faint:#6E8783;
  --gold:#CEB888; --gold-hi:#E6D6AF; --gold-dim:rgba(206,184,136,.22);
  --garnet:#782F40; --garnet-hi:#9A4054;
  --up:#46D6A2; --down:#FF6F6B; --link:#8FE3DC;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#06141A}
body{min-height:100vh;background:var(--bg);background:linear-gradient(180deg,var(--bg-top) 0,#08202A 28vh,var(--bg) 60vh,#06141A 100%);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.42;
  background:url("../guilloche.svg") no-repeat 50% -34vh / min(1300px,180vw) auto;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,1) 0,rgba(0,0,0,.7) 16vh,rgba(0,0,0,0) 34vh);mask-image:linear-gradient(180deg,rgba(0,0,0,1) 0,rgba(0,0,0,.7) 16vh,rgba(0,0,0,0) 34vh)}
a{color:var(--link)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.good{color:var(--up)}.weak{color:var(--down)}.hot{color:var(--gold-hi)}
h2{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.25;letter-spacing:.01em;text-wrap:balance;margin:14px 0 6px}
h3.eyebrow,.eyebrow{display:block;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.9;margin:22px 0 8px}
.lead{color:var(--dim);margin-bottom:12px}
.note{color:var(--dim);font-size:13.5px;margin:4px 0 10px}
.foot{color:var(--faint);font-size:12.5px;margin-top:26px;text-align:center}
code{font-family:var(--mono);font-size:13px;color:var(--gold-hi);background:rgba(206,184,136,.08);padding:1px 5px;border-radius:3px}

/* top bar */
#top{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;gap:12px;margin:0 -16px 6px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;
  background:linear-gradient(180deg,rgba(7,22,28,.97),rgba(7,22,28,.88));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.02em;color:var(--gold-hi);line-height:1}
.brand b{color:#fff;background:var(--garnet);padding:2px 7px 3px;border-radius:3px;margin-right:6px;font-size:16px;vertical-align:2px}
#topmeta{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--dim)}

/* bottom tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(6,15,14,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tabs button{flex:1;max-width:210px;min-height:44px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--dim);font:600 14px var(--sans);letter-spacing:.02em}
#tabs button[aria-selected="true"]{background:var(--garnet);border-color:var(--garnet-hi);color:#fff}

/* buttons */
.btn{min-height:46px;padding:0 18px;border-radius:7px;border:1px solid var(--line);background:rgba(11,24,23,.9);color:var(--gold-hi);font-weight:600;font-size:15px;line-height:1.2}
.btn.primary{background:var(--garnet);border-color:var(--garnet-hi);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--down);border-color:rgba(255,111,107,.35)}
.btn:disabled{opacity:.4;cursor:default}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1 1 auto}
.acts .btn.primary{flex:2 1 auto}
.acts.col{flex-direction:column}
.acts.col .btn{width:100%}
.link{background:none;border:none;color:var(--link);font-size:14px;padding:6px 0}
.link.back{margin-top:4px}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.big{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;padding:16px 18px;border-radius:9px;border:1px solid var(--line);background:var(--panel);box-shadow:0 10px 30px rgba(0,26,31,.46),inset 0 1px 0 rgba(255,255,255,.05)}
.big b{font-family:var(--serif);font-size:21px;color:var(--gold-hi);letter-spacing:.01em}
.big small{color:var(--dim);font-size:13px;line-height:1.4}
.big.primary{background:linear-gradient(180deg,var(--garnet-hi),var(--garnet));border-color:var(--garnet-hi)}
.big.primary b{color:#fff}.big.primary small{color:rgba(255,255,255,.8)}
.rows{display:flex;flex-direction:column;gap:6px}
.mrow,.drow,.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.mrow:active,.drow:active{border-color:var(--gold)}
.mt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mt b{font-weight:600;font-size:15px}
.mt small{color:var(--faint);font-size:12.5px;line-height:1.35}
.mm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 72px;font-size:12px;color:var(--dim)}
.bar{display:block;width:72px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.good i{background:var(--up)}
.mastery{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dim);margin:6px 0 4px}
.mastery .bar{width:120px}

/* session */
.shead{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.shead .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:15px;flex:none}
.sbar{flex:1;height:3px;border-radius:2px;background:var(--line2);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--gold)}
.qhead .eyebrow{margin:10px 0 0}
.qt{margin-top:6px}
.ws{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ws td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.ws tr:last-child td{border-bottom:none}
.ws td.v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.ws td.vt{white-space:normal;font-size:13px}
.ws tr.long td{padding:8px 10px}
.ws tr.long small{display:block;font-size:12.5px;color:var(--dim);margin-bottom:2px}
.ws tr.long div{font-size:14px;color:var(--ink);line-height:1.4}
.ws tr.g td{color:var(--dim)}
.ws tr.g td.v{color:var(--ink)}
.ws tr.done td{color:var(--ink);font-weight:500}
.ws tr.done.ok td.v{color:var(--up)}
.ws tr.done.miss td.v{color:var(--down)}
.ws tr.cur td{background:rgba(206,184,136,.09);color:var(--gold-hi);font-weight:600;border-left:3px solid var(--gold)}
.ws tr.todo td{color:var(--faint);opacity:.55}
.ask{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;margin-top:14px;background:rgba(6,15,14,.97);border:1px solid var(--gold-dim);border-radius:9px;padding:14px;box-shadow:0 -6px 30px rgba(0,10,14,.55),0 10px 30px rgba(0,26,31,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ql{display:block;font-family:var(--serif);font-size:18px;margin-bottom:10px;text-wrap:balance}
.retry{display:block;font-family:var(--sans);font-size:13px;color:var(--down);margin-top:4px}
.inp{display:flex;align-items:center;gap:8px}
.inp input{flex:1;min-width:0;width:100%;font:500 22px var(--mono);font-variant-numeric:tabular-nums;padding:10px 12px;border-radius:7px;border:1px solid var(--gold);background:#0B1817;color:var(--ink);text-align:right;-webkit-appearance:none;appearance:none}
.inp input::placeholder{color:var(--faint)}
.inp .sign{width:46px;height:48px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--dim);font:600 22px var(--mono)}
.inp .sign.on{background:var(--garnet);border-color:var(--garnet-hi);color:#fff}
.inp .unit{font:11px var(--mono);color:var(--faint);min-width:44px;text-align:left;line-height:1.2}
.msg{color:var(--down);font-size:13px;margin-top:8px}
.hint{margin-top:10px;font-size:13px;color:var(--gold-hi);border-left:3px solid var(--gold);padding:6px 10px;background:rgba(206,184,136,.06);border-radius:0 5px 5px 0}
.fb{margin-top:14px;border-left:3px solid var(--up);background:rgba(70,214,162,.08);padding:12px 14px;border-radius:0 8px 8px 0}
.fb.miss{border-color:var(--down);background:rgba(255,111,107,.08)}
.fb.mixed{border-color:var(--gold);background:rgba(206,184,136,.08)}
.fb .h{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.fb .f{font-size:12.5px;color:var(--gold-hi);margin-bottom:6px}
.fb .x{font-size:14px;color:#D9DED8}
.fb .x b{color:#fff}

/* choice */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:15px;line-height:1.4}
.opt .k{font:600 12px var(--mono);color:var(--gold);border:1px solid var(--gold-dim);border-radius:5px;width:26px;height:26px;display:grid;place-items:center;flex:none;margin-top:1px}
.opt.ok{border-color:var(--up);background:rgba(70,214,162,.1)}.opt.ok .k{color:var(--up);border-color:var(--up)}
.opt.miss{border-color:var(--down);background:rgba(255,111,107,.08)}.opt.miss .k{color:var(--down);border-color:var(--down)}
.opt.dimmed{opacity:.45}
.opt:disabled{cursor:default}

/* order */
.seq{display:flex;flex-direction:column;gap:6px;margin-top:10px;min-height:52px}
.seq .empty{color:var(--faint);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.si{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--gold-dim);background:var(--panel);color:var(--ink);border-radius:8px;font-size:14.5px}
.si .k{font:600 12px var(--mono);color:var(--gold);width:22px;flex:none}
.si.ok{border-color:var(--up)}.si.ok .k{color:var(--up)}
.si.miss{border-color:var(--down)}.si.miss .k{color:var(--down)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:10px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(11,24,23,.9);color:var(--gold-hi);font-size:14px;text-align:left;line-height:1.3}
.co{margin:6px 0 8px 18px;font-size:14px;color:#D9DED8}
.co li{margin:2px 0}

/* flash */
.card{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 16px;box-shadow:0 10px 30px rgba(0,26,31,.46)}
.card .eyebrow{margin:0 0 6px}
.card .qt{margin:0 0 10px}
.back{margin-top:14px;border-top:1px solid var(--line2);padding-top:12px}
.back p{font-size:15px;color:#E4E7E2}

/* summary */
.sum{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.sum .eyebrow{margin:0}
.score{display:flex;flex-direction:column;gap:2px;margin:8px 0 10px}
.score .big{font-size:48px;line-height:1;color:var(--gold-hi);font-weight:500;display:block;padding:0;border:none;background:none;box-shadow:none}
.score .sub{color:var(--dim);font-size:13.5px}

/* learn */
.sec{border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:8px}
.sec summary{list-style:none;display:flex;flex-direction:column;gap:2px;padding:13px 14px;cursor:pointer}
.sec summary::-webkit-details-marker{display:none}
.sec summary span{font-family:var(--serif);font-size:18px;color:var(--gold-hi)}
.sec summary small{color:var(--faint);font-size:12.5px}
.sec[open] summary{border-bottom:1px solid var(--line2)}
.secb{padding:12px 14px 14px;font-size:14.5px;color:#DCE1DB}
.secb p{margin:0 0 10px}
.secb ul,.secb ol{margin:0 0 10px 18px}
.secb li{margin:4px 0}
.secb .acts{margin-top:6px}
table.ref{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 12px}
table.ref td,table.ref th{padding:6px 8px 6px 0;border-bottom:1px solid var(--line2);vertical-align:top;text-align:left}
table.ref th{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
table.ref td:first-child{color:var(--gold-hi);white-space:nowrap;padding-right:12px}
table.ref td.t{font-weight:600}
ol.links li{margin:5px 0}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column}
.tile .lbl{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);opacity:.85}
.tile .big{display:block;padding:0;border:none;background:none;box-shadow:none;font-size:28px;line-height:1.15;margin-top:3px;color:var(--ink)}
.tile .meta{font-size:11px;color:var(--faint);font-family:var(--mono)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{min-width:44px;height:38px;border:none;background:transparent;color:var(--dim);font:600 14px var(--mono);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--garnet);color:#fff}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media (min-width:700px){body{font-size:15.5px}.ws{font-size:14.5px}}
</style>
</head>
<body>
<div class="wrap"><header id="top"><div class="brand"><b>IB</b>Drills</div><div id="topmeta"></div></header>
<main id="view"></main></div>
<nav id="tabs" aria-label="Sections"><button data-tab="drill">Drill</button><button data-tab="learn">Notes</button><button data-tab="stats">Progress</button></nav>
<script>
/*__ENGINE_START__*/
// IB Drills — generator engine. Pure functions, no DOM. Everything in $mm unless noted.
const IBD = (() => {
  // ---------- seeded rng ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function makeRng(seed){
    const f=mulberry32(seed>>>0);
    return {
      seed, f,
      int:(a,b)=>a+Math.floor(f()*(b-a+1)),
      pick:(arr)=>arr[Math.floor(f()*arr.length)],
      chance:(p)=>f()<p,
      shuffle:(arr)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
      step:(a,b,s)=>{const n=Math.max(0,Math.floor((b-a)/s));return a+s*Math.floor(f()*(n+1))}
    };
  }
  // ---------- numbers ----------
  const R=(v,dp=0)=>{const m=Math.pow(10,dp);return Math.round((v+Number.EPSILON)*m)/m};
  const fnum=(v,dp)=>{
    if(v==null||!isFinite(v))return '–';
    const neg=v<0, a=Math.abs(v);
    let s;
    if(dp==null){const r=R(a,2);s=r.toLocaleString('en-US',{maximumFractionDigits:2})}
    else s=a.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
    return (neg?'−':'')+s;
  };
  const UNITS={
    '$':  {dp:1, show:v=>(v<0?'−$':'$')+fnum(Math.abs(v)), hint:'$mm'},
    '$ps':{dp:2, show:v=>(v<0?'−$':'$')+fnum(Math.abs(v),2), hint:'$ per share'},
    '%':  {dp:1, show:v=>fnum(v,1)+'%', hint:'%'},
    'x':  {dp:1, show:v=>fnum(v,1)+'x', hint:'x (multiple)'},
    'x2': {dp:2, show:v=>fnum(v,2)+'x', hint:'x (multiple)'},
    'mm': {dp:1, show:v=>fnum(v)+' mm', hint:'mm shares'},
    'n':  {dp:2, show:v=>fnum(v), hint:''},
    'yr': {dp:1, show:v=>fnum(v,1)+' yrs', hint:'years'}
  };
  const show=(v,unit)=>(UNITS[unit]||UNITS.n).show(v);
  const $=(v)=>show(v,'$'), ps=(v)=>show(v,'$ps'), pct=(v,dp=1)=>fnum(v,dp)+'%', x=(v,dp=1)=>fnum(v,dp)+'x', mm=(v)=>show(v,'mm');
  function parseNum(s){
    if(s==null)return NaN;
    s=String(s).trim(); if(!s)return NaN;
    let neg=false;
    if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
    s=s.replace(/−/g,'-').replace(/[^0-9.\-+]/g,'');
    if(!s||s==='-'||s==='+'||s==='.')return NaN;
    const v=parseFloat(s); return neg?-v:v;
  }
  function tolFor(step){
    if(step.tol!=null)return step.tol;
    const dp=(UNITS[step.unit]||UNITS.n).dp;
    return Math.max(Math.abs(step.a)*0.006, 0.51*Math.pow(10,-dp));
  }
  function checkNum(step,input){
    const v=parseNum(input); if(!isFinite(v))return {ok:false,bad:true};
    return {ok:Math.abs(v-step.a)<=tolFor(step), v};
  }
  // ---------- registry ----------
  const MODULES=[
    {id:'is',   group:'Three statements', name:'Income statement',   short:'IS',      blurb:'Revenue to EPS, line by line.'},
    {id:'bs',   group:'Three statements', name:'Balance sheet',      short:'BS',      blurb:'Assets = liabilities + equity, and what sits where.'},
    {id:'cfs',  group:'Three statements', name:'Cash flow statement',short:'CFS',     blurb:'Net income to net change in cash. Signs matter.'},
    {id:'links',group:'Three statements', name:'How they link',      short:'Links',   blurb:'"Walk me through $X of…" — the transaction drills.'},
    {id:'ev',   group:'Valuation',        name:'Equity value & EV',  short:'EqV / EV',blurb:'The bridge, diluted shares, what moves what.'},
    {id:'mult', group:'Valuation',        name:'Multiples',          short:'Multiples',blurb:'Compute them, pick the right one, apply them.'},
    {id:'val',  group:'Valuation',        name:'Methodologies',      short:'Methods', blurb:'Comps, precedents, DCF, LBO: steps and when to use each.'},
    {id:'dcf',  group:'Valuation',        name:'DCF',                short:'DCF',     blurb:'UFCF, WACC, CAPM, beta, terminal value, discounting.'},
    {id:'ma',   group:'Deals',            name:'M&A',                short:'M&A',     blurb:'Accretion / dilution, cost of financing, goodwill.'},
    {id:'lbo',  group:'Deals',            name:'LBO',                short:'LBO',     blurb:'Sources & uses, debt paydown, MOIC, IRR, the paper LBO.'},
    {id:'case', group:'Capstone',         name:'Full case',          short:'Case',    blurb:'One company, every concept, start to finish.'}
  ];
  const DRILLS=[];
  const drill=(d)=>{DRILLS.push(d);return d};
  const S=(label,a,unit,extra)=>Object.assign({label,a,unit:unit||'$'},extra||{});
  const opts=(rng,bank,avoid)=>{ // choice: pick an item from a bank, shuffle options, return normalized
    let pool=bank; if(avoid&&avoid.length&&bank.length>avoid.length) pool=bank.filter(b=>!avoid.includes(b.q));
    const item=rng.pick(pool);
    const correct=item.options[0];

    {f:'Why is EBITDA the key number in an LBO?',b:'Lenders size debt as a multiple of EBITDA and test covenants on it. Entry and exit prices are EBITDA multiples. And EBITDA less capex, taxes and interest is the cash that pays down debt. Everything in the model keys off it.'}
  ];
  drill({id:'lbo_flash',module:'lbo',name:'Explain it out loud',kind:'flash',gen(rng,avoid){let pool=LBO_FLASH;if(avoid&&avoid.length&&pool.length>avoid.length)pool=pool.filter(f=>!avoid.includes(f.f));const f=rng.pick(pool);return {front:f.f,back:f.b,key:f.f};}});

  // =====================================================================
  // FULL CASE — one company through everything
  // =====================================================================
  drill({id:'case_full',module:'case',name:'One company, start to finish',kind:'steps',
    gen(rng){
      const c=mkCo(rng), n=coName(rng), sp=rng.pick(SPONSORS);
      const rf=rng.pick([4,4.5]), beta=rng.int(90,150)/100, erp=rng.pick([5,5.5,6]), kd=rng.pick([5,6,7]);
      const ke=R(rf+beta*erp,2); let g=rng.pick([2,2.5,3]);
      const ufcf=c.ufcf>0?c.ufcf:R(c.ebitda*0.3,1); if(c.ufcf<=0)c.ufcf=ufcf;
      // Set the market price so the market EV sits near the perpetuity DCF (keeps the case coherent).
      const clampG=(w,gg)=>Math.max(1,Math.min(gg,Math.floor((w-4)*2)/2));
      let eqv0=R(c.price*c.dil,1);
      let wacc=R(eqv0/(eqv0+c.debt)*ke+c.debt/(eqv0+c.debt)*kd*(1-c.t/100),2); g=clampG(wacc,g);
      const dcfEV0=R(ufcf*(1+g/100)/((wacc-g)/100),1);
      const evMarket=Math.max(R(dcfEV0*(1+rng.int(-30,30)/100),1),R(4*c.ebitda,1));
      const eqvMarket=Math.max(R(evMarket+c.cash-c.debt,1),R(2*c.ebitda,1));
      let price=R(eqvMarket/c.shares,2);
      c.strike=R(price*rng.pick([0.4,0.5,0.6,0.75]),2);
      c.newSh=R(c.options-c.options*c.strike/price,2); c.dil=R(c.shares+c.newSh,2);
      price=R(eqvMarket/c.dil,2); c.newSh=R(c.options-c.options*c.strike/price,2); c.dil=R(c.shares+c.newSh,2); c.price=price;
      const eqv=R(c.price*c.dil,1), ev=R(eqv-c.cash+c.debt,1), evM=R(ev/c.ebitda,1), pe=R(eqv/c.ni,1);
      wacc=R(eqv/(eqv+c.debt)*ke+c.debt/(eqv+c.debt)*kd*(1-c.t/100),2); g=clampG(wacc,g);
      const dcfEV=R(ufcf*(1+g/100)/((wacc-g)/100),1), gap=R((dcfEV/ev-1)*100,1);
      const prem=rng.pick([25,30,35]); const entryEqv=R(eqv*(1+prem/100),1), entryEV=R(entryEqv+c.debt-c.cash,1), entryM=R(entryEV/c.ebitda,1);
      const lev=Math.max(2,Math.min(5,Math.floor((entryM-2)*2)/2)); const newDebt=R(lev*c.ebitda), spEq=R(entryEV-newDebt,1);
      const g2=rng.pick([4,5,6,8]); const eb5=R(c.ebitda*Math.pow(1+g2/100,5),1), exitEV=R(eb5*entryM,1);
      const pay=Math.max(0,Math.min(R(newDebt*0.5,-1),R(5*Math.max(0,c.fcf)*0.8,-1))); const debt5=newDebt-pay, exitEq=R(exitEV-debt5,1);
      const moic=R(exitEq/spEq,2), irr=R(irrOf(exitEq/spEq,5),1);
      const given=[['Revenue',$(c.rev)],['COGS',$(c.cogs)],['Operating expenses (ex D&A)',$(c.opex)],['D&A',$(c.da)],['Interest expense',$(c.intExp)],...(c.intInc?[['Interest income',$(c.intInc)]]:[]),['Tax rate',pct(c.t,0)],
        ['Change in AR / inventory / AP',`${$(c.dAR)} / ${$(c.dInv)} / ${$(c.dAP)}`],['CapEx',$(c.capex)],
        ['Share price',ps(c.price)],['Basic shares',mm(c.shares)],['Options / strike',`${mm(c.options)} @ ${ps(c.strike)}`],['Cash',$(c.cash)],['Debt',$(c.debt)],
        ['Risk-free / beta / ERP',`${pct(rf)} / ${fnum(beta,2)} / ${pct(erp)}`],['Pre-tax cost of debt',pct(kd,0)],['Terminal growth',pct(g)],
        [`${sp} offer premium`,pct(prem,0)],['LBO leverage',`${x(lev)} EBITDA`],['EBITDA growth under PE',pct(g2,0)+' per year, 5-year hold'],['Debt repaid over the hold',$(pay)]];
      const steps=[
        S('Gross profit',c.gp,'$',{formula:'Revenue − COGS',explain:`${$(c.rev)} − ${$(c.cogs)} = <b>${$(c.gp)}</b>.`}),
        S('EBITDA',c.ebitda,'$',{formula:'Gross profit − opex',explain:`${$(c.gp)} − ${$(c.opex)} = <b>${$(c.ebitda)}</b>.`}),
        S('EBIT',c.ebit,'$',{formula:'EBITDA − D&A',explain:`${$(c.ebitda)} − ${$(c.da)} = <b>${$(c.ebit)}</b>.`}),
        S('Net income',c.ni,'$',{formula:'(EBIT − interest expense + interest income) × (1 − t)',explain:`${$(c.ebt)} × (1 − ${pct(c.t,0)}) = <b>${$(c.ni)}</b>.`}),
        S('Cash from operations',c.cfo,'$',{formula:'NI + D&A − ΔAR − ΔInventory + ΔAP',explain:`${$(c.ni)} + ${$(c.da)} − (${$(c.dAR)}) − (${$(c.dInv)}) + (${$(c.dAP)}) = <b>${$(c.cfo)}</b>.`}),
        S('Free cash flow (CFO − CapEx)',c.fcf,'$',{formula:'CFO − CapEx',explain:`${$(c.cfo)} − ${$(c.capex)} = <b>${$(c.fcf)}</b>.`}),
        S('Unlevered free cash flow',c.ufcf,'$',{formula:'EBIT(1 − t) + D&A − CapEx − ΔNWC',explain:`${$(c.ebit)} × ${fnum(1-c.t/100,2)} + ${$(c.da)} − ${$(c.capex)} − (${$(c.dNWC)}) = <b>${$(c.ufcf)}</b>.`}),
        S('Diluted shares (TSM)',c.dil,'mm',{formula:'Basic + options − options × strike ÷ price',explain:`${mm(c.shares)} + ${mm(c.options)} − ${mm(c.options)} × ${ps(c.strike)} ÷ ${ps(c.price)} = <b>${mm(c.dil)}</b>.`}),
        S('Equity value',eqv,'$',{formula:'Price × diluted shares',explain:`${ps(c.price)} × ${mm(c.dil)} = <b>${$(eqv)}</b>.`}),
        S('Enterprise value',ev,'$',{formula:'Equity value − cash + debt',explain:`${$(eqv)} − ${$(c.cash)} + ${$(c.debt)} = <b>${$(ev)}</b>.`}),
        S('EV / EBITDA',evM,'x',{tol:0.2,formula:'EV ÷ EBITDA',explain:`${$(ev)} ÷ ${$(c.ebitda)} = <b>${x(evM)}</b>.`}),
        S('P / E',pe,'x',{tol:0.3,formula:'Equity value ÷ net income',explain:`${$(eqv)} ÷ ${$(c.ni)} = <b>${x(pe)}</b>.`}),
        S('Cost of equity (CAPM)',ke,'%',{tol:0.12,formula:'Rf + β × ERP',explain:`${pct(rf)} + ${fnum(beta,2)} × ${pct(erp)} = <b>${pct(ke,2)}</b>.`}),
        S('WACC',wacc,'%',{tol:0.15,formula:'E/V × Ke + D/V × Kd × (1 − t), market values',explain:`${pct(eqv/(eqv+c.debt)*100)} × ${pct(ke,2)} + ${pct(c.debt/(eqv+c.debt)*100)} × ${pct(kd,0)} × ${fnum(1-c.t/100,2)} = <b>${pct(wacc,2)}</b>.`}),
        S('DCF enterprise value (perpetuity on UFCF)',dcfEV,'$',{tol:Math.max(2,dcfEV*0.01),formula:'UFCF × (1 + g) ÷ (WACC − g)',explain:`${$(ufcf)} × ${fnum(1+g/100,3)} ÷ ${pct(wacc-g,2)} = <b>${$(dcfEV)}</b>. (A one-line DCF: every year grows at g forever.)`}),
        S('DCF vs market EV',gap,'%',{tol:1,formula:'DCF EV ÷ market EV − 1',explain:`${$(dcfEV)} ÷ ${$(ev)} − 1 = <b>${pct(gap)}</b>: the DCF says the business is worth ${gap>0?'more':'less'} than the market pays. ${Math.abs(gap)>30?'A gap this big means your assumptions or the market\'s are off; dig in.':'Within a normal range.'}`}),
        S('Sponsor entry EV',entryEV,'$',{formula:'Equity value × (1 + premium) + debt − cash',explain:`${$(eqv)} × ${fnum(1+prem/100,2)} + ${$(c.debt)} − ${$(c.cash)} = <b>${$(entryEV)}</b> (${x(entryM)} EBITDA).`}),
        S('Sponsor equity check',spEq,'$',{formula:'Entry EV − new debt',explain:`${$(entryEV)} − ${x(lev)} × ${$(c.ebitda)} = <b>${$(spEq)}</b>.`}),
        S('Exit EV in year 5',exitEV,'$',{formula:'EBITDA × (1 + g)^5 × entry multiple',explain:`${$(eb5)} × ${x(entryM)} = <b>${$(exitEV)}</b> (same multiple in and out: no multiple expansion).`}),
        S('Exit equity',exitEq,'$',{formula:'Exit EV − remaining debt',explain:`${$(exitEV)} − (${$(newDebt)} − ${$(pay)}) = <b>${$(exitEq)}</b>.`}),
        S('MOIC',moic,'x2',{tol:0.03,formula:'Exit equity ÷ sponsor equity',explain:`${$(exitEq)} ÷ ${$(spEq)} = <b>${x(moic,2)}</b>.`}),
        S('IRR',irr,'%',{tol:0.6,formula:'MOIC^(1/5) − 1',explain:`<b>${pct(irr)}</b>. ${irr>=20?`A ${pct(prem,0)} premium still clears a 20% hurdle: a sponsor could bid.`:`A ${pct(prem,0)} premium does not clear 20%: a sponsor would need a lower price, more growth or more leverage.`}`})
      ];
      return {title:`${n}: the whole stack`,note:'$mm. Income statement → cash flow → EV → multiples → DCF → LBO. Everything on one company.',given,steps,
        wrap:`Trace the thread: the same EBITDA set the market multiple (${x(evM)}), fed the DCF through UFCF, and sized the LBO debt. Change one number at the top and everything below moves.`};
    }});

  // ---------- public API ----------
  const byId=Object.fromEntries(DRILLS.map(d=>[d.id,d]));
  function generate(id,seed,avoid){const d=byId[id];const rng=makeRng(seed);const g=d.gen(rng,avoid||[]);g.drillId=id;g.kind=d.kind;g.module=d.module;g.name=d.name;g.seed=seed;return g;}
  return {MODULES,DRILLS,byId,generate,makeRng,parseNum,checkNum,tolFor,fmt:{show,fnum,$:$,ps,pct,x,mm},R,UNITS,_LINKS:LINKS,_genLink:genLink};
})();

// Reference notes, one section per module. Condensed from the technical cheat sheet, reorganized around what the drills test.
const LEARN=[
{m:'is',html:`
<p>Covers a <b>period</b>. Revenue in, expenses out, profit at the bottom. Operating lines first, financing (interest) next, taxes last.</p>
<table class="ref"><tr><td>Revenue</td><td>Recognized when earned, not when paid</td></tr><tr><td>− COGS</td><td>Direct cost of what was sold</td></tr><tr><td class="t">= Gross profit</td><td>Gross margin = GP ÷ revenue</td></tr><tr><td>− Operating expenses</td><td>SG&A, R&D. D&A is usually buried here or in COGS</td></tr><tr><td class="t">= Operating income (EBIT)</td><td>Profit from operations, before financing</td></tr><tr><td>− Interest expense, + interest income</td><td>Non-operating: depends on capital structure</td></tr><tr><td class="t">= Pretax income</td><td></td></tr><tr><td>− Taxes</td><td>Pretax income × tax rate</td></tr><tr><td class="t">= Net income</td><td>Flows to the CFS and to retained earnings</td></tr><tr><td>÷ Diluted shares</td><td>= EPS</td></tr></table>
<p><code>EBITDA = EBIT + D&A</code>. Take D&A from the cash flow statement. Not a GAAP line, but the number lenders and multiples use.</p>
<ul><li>Strip non-recurring items (restructuring, gains on sale, impairments) to get "adjusted" figures.</li><li>Depreciation is an expense, not a cash outflow. The cash left when the asset was bought.</li><li>Interest sits below EBIT, so EV-based metrics (revenue, EBITDA, EBIT) ignore how the company is financed.</li><li>Taxes are computed after interest: that is the tax shield on debt.</li></ul>`},
{m:'bs',html:`
<p>A <b>snapshot</b> at a date. <code>Assets = Liabilities + Shareholders' equity</code>. Assets listed by liquidity, liabilities by maturity.</p>
<table class="ref"><tr><td class="t">Current assets</td><td>Cash & equivalents · short-term investments · accounts receivable · inventory · prepaid expenses</td></tr><tr><td class="t">Long-term assets</td><td>PP&E (net of accumulated depreciation) · goodwill & intangibles · long-term investments</td></tr><tr><td class="t">Current liabilities</td><td>Accounts payable · accrued expenses · deferred revenue · short-term debt / current portion of LT debt</td></tr><tr><td class="t">Long-term liabilities</td><td>Long-term debt · deferred tax liabilities · lease liabilities</td></tr><tr><td class="t">Equity</td><td>Common stock & APIC · retained earnings · treasury stock (negative) · noncontrolling interest</td></tr></table>
<ul><li><code>Retained earnings = cumulative net income − cumulative dividends</code>. Equity is the residual and can be negative.</li><li><code>Operating working capital = (current assets ex cash) − (current liabilities ex debt)</code>. Growth in it consumes cash.</li><li><code>Net debt = debt − cash</code>.</li><li>Goodwill appears only through acquisitions: price paid above fair value of net identifiable assets.</li></ul>`},
{m:'cfs',html:`
<p>Reconciles net income to the actual change in cash over a period. Three sections, then the total lands on the balance sheet.</p>
<table class="ref"><tr><td class="t">Operating</td><td>Net income<br>+ non-cash expenses (D&A, SBC, impairments, write-downs)<br>± changes in working capital</td></tr><tr><td class="t">Investing</td><td>− CapEx · − acquisitions · + asset sales · ± investments</td></tr><tr><td class="t">Financing</td><td>+ debt raised · − debt repaid · + equity issued · − buybacks · − dividends</td></tr><tr><td class="t">= Net change in cash</td><td>Beginning cash + change = ending cash on the BS</td></tr></table>
<p><b>Sign rule:</b> an operating asset going up uses cash (subtract); an operating liability going up frees cash (add). Interest paid is operating under US GAAP; principal repaid is financing.</p>
<p><code>FCF = CFO − CapEx</code><br><code>UFCF = EBIT × (1 − t) + D&A − CapEx − ΔNWC</code> (to all investors; discount at WACC → EV)<br><code>LFCF = NI + D&A − CapEx − ΔNWC − mandatory debt repayment</code> (to equity; discount at cost of equity → equity value)</p>`},
{m:'links',html:`
<ol class="links"><li>Net income → top of the CFS and into retained earnings on the BS.</li><li>Non-cash expenses (D&A, SBC, write-downs) → added back in CFO.</li><li>Changes in operating working capital → adjusted in CFO.</li><li>CapEx (CFS) → PP&E on the BS; depreciation (IS) then reduces PP&E.</li><li>Equity raised or bought back (CFF) → shareholders' equity.</li><li>Debt raised or repaid (CFF) → debt on the BS.</li><li>Net change in cash (CFS) → cash on the BS.</li></ol>
<p><b>Method for any "walk me through" question.</b> IS first: pretax change, then after-tax via (1 − t). CFS second: start from the net income change, add back anything non-cash, adjust working capital, then investing and financing. BS last: cash from the CFS, the other line that moved, then retained earnings by the net income change. Confirm <code>Δassets = Δliabilities + Δequity</code>.</p>
<p><b>The classic.</b> Depreciation up $10, 40% tax. IS: pretax −10, net income −6. CFS: NI −6, add back +10, cash +4. BS: PP&E −10, cash +4 → assets −6; retained earnings −6. Balanced.</p>
<table class="ref"><tr><td>Raise debt</td><td>Cash +X, debt +X. No IS effect yet</td></tr><tr><td>Buy back stock</td><td>Cash −X, equity −X (treasury stock)</td></tr><tr><td>Pay dividend</td><td>Cash −X, retained earnings −X</td></tr><tr><td>CapEx</td><td>Cash −X, PP&E +X</td></tr><tr><td>AR or inventory up</td><td>Cash −X (CFO adjustment)</td></tr><tr><td>AP or deferred revenue up</td><td>Cash +X</td></tr><tr><td>Impairment, non-deductible</td><td>NI −X, cash 0, asset −X, RE −X</td></tr><tr><td>SBC</td><td>NI −X(1−t), cash +Xt, APIC +X, RE −X(1−t)</td></tr><tr><td>Sell asset for P, book value B</td><td>Gain G = P − B; CFO −G; CFI +P; cash +P − G·t</td></tr></table>`},
{m:'ev',html:`
<p><code>Equity value = share price × diluted shares</code>. What the shareholders own.</p>
<p><code>EV = equity value − cash + debt + preferred + noncontrolling interest</code> (+ debt-like items: finance leases, unfunded pensions). What the whole operating business is worth to everyone who funds it.</p>
<p><b>Diluted shares</b> = basic + in-the-money options via the treasury stock method (<code>options − options × strike ÷ price</code>) + RSUs + convertibles if in the money (<code>face ÷ conversion price</code>, then exclude that debt from the bridge).</p>
<table class="ref"><tr><td class="t">Use EV with</td><td>Revenue, EBITDA, EBIT, EBITDAR, unlevered FCF, NOPAT: anything before interest</td></tr><tr><td class="t">Use equity value with</td><td>Net income, EPS, levered FCF, book value, dividends, FFO: anything after interest</td></tr></table>
<p><b>What moves what.</b> Issuing stock, raising debt, paying dividends and buybacks shuffle cash, debt and equity: EV is unchanged. Turning cash into operating assets (capex, an acquisition) raises EV. Generating cash lowers EV, holding the price constant. Equity value moves only when shares or price move.</p>`},
{m:'mult',html:`
<table class="ref"><tr><th>Multiple</th><th>Use when</th><th>Watch out</th></tr>
<tr><td>EV / Revenue</td><td>Unprofitable or early-stage; very different margins</td><td>Ignores profitability</td></tr>
<tr><td>EV / EBITDA</td><td>Default for most industries; capital-structure and tax neutral; cash-flow proxy</td><td>Flatters capex-heavy businesses</td></tr>
<tr><td>EV / EBIT</td><td>When D&A approximates reinvestment needs; capital-intensive comparisons</td><td>Depends on depreciation policy</td></tr>
<tr><td>P / E</td><td>Mature companies with similar leverage and taxes; banks</td><td>Distorted by leverage, taxes, one-offs</td></tr>
<tr><td>P / Book</td><td>Banks, insurers (balance sheet is the business)</td><td>Meaningless for asset-light companies</td></tr>
<tr><td>EV / EBITDAR</td><td>Retailers, airlines, hotels: lease vs own</td><td>Rent must be added back consistently</td></tr>
<tr><td>P / FFO</td><td>REITs (adds back real-estate depreciation)</td><td>Equity multiple: after interest</td></tr>
<tr><td>EV / EBITDAX</td><td>Oil & gas E&P (exploration accounting differs)</td><td>Industry-specific</td></tr></table>
<ul><li>A higher multiple is justified by higher growth, higher margins or returns, lower risk, stronger position.</li><li>Use the <b>median</b> of the comp set. Show LTM (trailing) and NTM (forward).</li><li>Strip non-recurring items and match the numerator to the metric: EV for pre-interest, equity for post-interest.</li><li>P/E of 20x = earnings yield of 5%. EV/EBITDA 8x with net debt of 2x EBITDA = equity worth 6x EBITDA.</li></ul>`},
{m:'val',html:`
<table class="ref"><tr><td class="t">Comparable companies</td><td>Pick peers (industry, size, growth, margins, geography) → compute their equity value, EV and multiples → range (25th, median, 75th) → place the target → apply to the target's metric → bridge to equity and per share. Output: a <b>trading</b> (minority) value.</td></tr>
<tr><td class="t">Precedent transactions</td><td>Recent deals for similar targets → transaction EV and multiples paid, premium to unaffected price → range → apply. Output: a <b>control</b> value (premiums typically 20–40%). Reflects past conditions and deal-specific synergies.</td></tr>
<tr><td class="t">DCF</td><td>Project UFCF, discount at WACC, add terminal value, bridge to equity. <b>Intrinsic</b>; sensitive to assumptions.</td></tr>
<tr><td class="t">LBO analysis</td><td>Solve for the price a sponsor can pay and still earn ~20%+ IRR. A <b>floor</b> for financial buyers.</td></tr></table>
<p><b>Typical ordering</b> (low → high): LBO ≈ public comps &lt; DCF ≈ precedents. Not a law: a DCF with aggressive assumptions can top everything. Present all of them on a <b>football field</b> alongside the 52-week range and triangulate.</p>
<p><b>When each is weak.</b> Comps: no true twins, no control premium, irrational markets. Precedents: stale, scarce, synergy-specific. DCF: garbage in, garbage out; terminal value dominates. Use sum-of-the-parts for conglomerates; add an illiquidity discount for private companies.</p>`},
{m:'dcf',html:`
<ol class="links"><li>Project unlevered free cash flow for 5–10 years: <code>UFCF = EBIT(1 − t) + D&A − CapEx − ΔNWC</code></li><li>Discount rate: <code>WACC = E/V × Ke + D/V × Kd × (1 − t) (+ P/V × Kp)</code>, market-value weights</li><li><code>Ke = Rf + β × ERP</code> (CAPM). Rf = 10-year Treasury. ERP ≈ 5–6%.</li><li>Beta from peers: <code>βU = βL ÷ [1 + (1 − t) × D/E]</code>, take the median, <code>βL = βU × [1 + (1 − t) × D/E]</code> at the target's structure.</li><li>Terminal value: <code>exit multiple × final-year EBITDA</code> or Gordon growth <code>FCF × (1 + g) ÷ (WACC − g)</code>, g ≈ 2–3%.</li><li>Discount: <code>PV = CF ÷ (1 + WACC)^t</code> (mid-year convention: t − 0.5). <code>EV = Σ PV(FCF) + PV(TV)</code>.</li><li>Bridge: <code>equity = EV − net debt − preferred − NCI</code>; <code>price = equity ÷ diluted shares</code>.</li></ol>
<p><b>Sanity checks.</b> Terminal value share of EV (usually 60–80%). Implied growth from the exit-multiple TV; implied multiple from the Gordon TV. A sensitivity table on WACC × exit multiple (or g).</p>
<p><b>Intuition.</b> Higher WACC or lower g → lower value. WACC moves value more than any single year's growth. Debt lowers WACC up to a point, then distress risk raises everything. Levered FCF at cost of equity gives equity value directly.</p>`},
{m:'ma',html:`
<p><b>Accretion / dilution</b> compares pro forma EPS with the buyer's standalone EPS.</p>
<ol class="links"><li>Purchase price = offer per share (premium to market) × target diluted shares.</li><li>Financing mix: cash, new debt, new buyer shares (<code>stock $ ÷ buyer price</code>).</li><li><code>Pro forma NI = buyer NI + target NI + synergies × (1 − t) − cash used × rate × (1 − t) − new debt × rate × (1 − t)</code></li><li><code>Pro forma shares = buyer shares + new shares</code>. Pro forma EPS = NI ÷ shares. Higher than standalone: accretive.</li></ol>
<table class="ref"><tr><th>Currency</th><th>After-tax cost</th></tr><tr><td>Cash</td><td>Foregone interest rate × (1 − t)</td></tr><tr><td>Debt</td><td>Interest rate × (1 − t)</td></tr><tr><td>Stock</td><td>Buyer earnings yield = 1 ÷ buyer P/E</td></tr></table>
<p>Compare the blended cost with the target's earnings yield at the offer price (<code>target NI ÷ purchase price</code>). Yield bought &gt; cost paid ⇒ accretive. All-stock shortcut: buyer P/E &gt; target P/E (at the offer) ⇒ accretive. Breakeven all-stock price = target NI × buyer P/E.</p>
<ul><li>Cost synergies (headcount, facilities, procurement) are credible; revenue synergies less so.</li><li>Purchase accounting: write assets up to fair value, <code>DTL = write-up × t</code>, <code>goodwill = price − fair value of net identifiable assets</code>. Target equity is eliminated. Goodwill is tested for impairment, not amortized.</li><li>Accretion is not value creation: cheap debt makes almost anything accretive. Price vs intrinsic value plus synergies is what matters.</li><li>Why deals happen: growth, synergies, new markets or capabilities, undervalued targets, consolidation, defense.</li></ul>`},
{m:'lbo',html:`
<p>A sponsor buys a company with a large share of debt (often 4–6x EBITDA; equity 40–60% of the price today), improves it, repays debt from cash flow, and sells in 3–7 years.</p>
<p><b>Returns come from</b> debt paydown (value shifts from lenders to equity), EBITDA growth, and multiple expansion. <b>Three ways to raise IRR:</b> pay less or exit higher; use more debt (if cash flow supports it); make the company perform (growth, margins, faster paydown). A dividend recap or earlier exit also lifts IRR.</p>
<p><b>Good candidates:</b> stable, predictable cash flow; undervalued; strong management; cost-cutting room; low capex and working-capital needs; hard assets for collateral; a clear exit.</p>
<ol class="links"><li>Purchase price: entry multiple × EBITDA.</li><li>Sources & uses: uses = equity purchase + debt refinanced + fees (+ cash to BS); sources = debt tranches + sponsor equity (the plug).</li><li>Project the statements and free cash flow: <code>NI + D&A − CapEx − ΔNWC</code> after interest.</li><li>Sweep free cash flow to repay debt.</li><li>Exit: exit multiple × final-year EBITDA − remaining debt = exit equity.</li><li><code>MOIC = exit equity ÷ entry equity</code>; <code>IRR = MOIC^(1/years) − 1</code>.</li></ol>
<table class="ref"><tr><th>MOIC</th><th>3 years</th><th>5 years</th><th>7 years</th></tr><tr><td>2.0x</td><td>26%</td><td>15%</td><td>10%</td></tr><tr><td>2.5x</td><td>36%</td><td>20%</td><td>14%</td></tr><tr><td>3.0x</td><td>44%</td><td>25%</td><td>17%</td></tr></table>
<p>Debt tranches, safest to riskiest: revolver, term loans (senior secured, floating), senior notes, subordinated / mezzanine (sometimes PIK), then equity. Lenders size debt off EBITDA and coverage; covenants police it. Exits: strategic sale, secondary buyout, IPO, dividend recap. Target IRR ~20–25%; an LBO analysis therefore sets a valuation floor.</p>`},
{m:'case',html:`
<p>The capstone runs one randomly generated company through everything: income statement → cash flows → diluted shares and the EV bridge → trading multiples → cost of equity, WACC and a one-line DCF → a sponsor's entry price, leverage, exit and IRR.</p>
<p>The point is the thread: the same EBITDA sets the market multiple, feeds the DCF through UFCF, and sizes the LBO debt. Change one number at the top and everything below moves. Do it until you can narrate the whole chain without looking.</p>`}
];

(()=>{

function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function record(id,ok,n){const d=ST.drills[id]||(ST.drills[id]={n:0,ok:0,last:0});d.n+=n;d.ok+=ok;d.last=Date.now();ST.days[dkey()]=(ST.days[dkey()]||0)+n;save()}

function modStats(mid){const ds=E.DRILLS.filter(d=>d.module===mid);let n=0,ok=0;ds.forEach(d=>{const s=dstat(d.id);n+=s.n;ok+=s.ok});const a=n?ok/n:0;const conf=Math.min(1,n/(6*ds.length));return {n,ok,acc:a,mastery:Math.round(a*conf*100),count:ds.length}}
function weight(d){const s=dstat(d.id);const a=s.n?s.ok/s.n:0.5;const days=s.last?(Date.now()-s.last)/864e5:99;return 1+3*(1-a)+(s.n<3?1.5:0)+(days>=3?0.7:0)}
function pickDrill(pool,lastId){const cand=pool.length>1?pool.filter(d=>d.id!==lastId):pool;let tot=0;const w=cand.map(d=>{const v=weight(d);tot+=v;return v});let r=Math.random()*tot;for(let i=0;i<cand.length;i++){r-=w[i];if(r<=0)return cand[i]}return cand[cand.length-1]}
function streakDays(){let n=0;const d=new Date();if(!ST.days[dkey(d)]){d.setDate(d.getDate()-1);if(!ST.days[dkey(d)])return 0}for(;;){if(ST.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}else break}return n}

const recent={};

// ---------- app state ----------

// ---------- session ----------
function startSession(o){S={label:o.label,pool:o.pool,len:o.len,i:0,done:[],lastId:null,ok:0,n:0,streak:0,best:0,back:o.back||{t:'drill'}};ST.sessions++;save();nextQ()}
function nextQ(){
  if(S.len&&S.i>=S.len)return summary();
  const d=pickDrill(S.pool,S.lastId);

function finishQ(ok,n){const c=S.cur;record(c.d.id,ok,n);S.ok+=ok;S.n+=n;S.done.push({name:c.g.title||c.d.name,drill:c.d.name,module:c.d.module,ok,n,id:c.d.id})}

function checkStep(){

  if(r.ok){c.results[c.step]=c.tries===0;c.ok+=c.tries===0?1:0;bump(c.tries===0);c.phase='fb';}
  else if(c.tries===0){c.tries=1;c.phase='retry';}
  else {c.results[c.step]=false;bump(false);c.phase='fb';}
  render();
}
function nextStep(){const c=S.cur;c.step++;c.tries=0;c.val='';c.neg=false;c.hint=false;c.msg='';if(c.step>=c.g.steps.length){c.phase='done';finishQ(c.results.filter(Boolean).length,c.g.steps.length)}else c.phase='ask';render()}
view.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const act=b.dataset.act;
  if(b.dataset.mod&&!act){return go('drill',b.dataset.mod)}
  if(b.dataset.drill){return startDrill(b.dataset.drill)}
  if(b.dataset.len!=null){ST.settings.len=+b.dataset.len;save();render();return}
  if(act==='random')return startRandom();
  if(act==='case')return startModule('case');
  if(act==='drillmod')return startModule(b.dataset.mod);
  if(act==='notes'){go('learn');const d=q('#n-'+b.dataset.mod);if(d){d.open=true;d.scrollIntoView()}return}
  if(act==='home')return go('drill');
  if(act==='reset'){if(!resetArmed){resetArmed=true;render();return}ST={v:1,drills:{},days:{},sessions:0,settings:ST.settings};save();resetArmed=false;render();return}
  if(!S)return;
  if(act==='quit'){const back=S.back;S=null;return go(back.t,back.m)}
  if(act==='again'){const o={label:S.label,pool:S.pool,len:S.len,back:S.back};return startSession(o)}
  const c=S.cur;if(!c)return;
  if(act==='next')return nextQ();
  if(c.g.kind==='steps'){
    if(act==='check')return checkStep();
    if(act==='hint'){c.hint=!c.hint;c.val=(q('#ans')||{}).value||'';render();return}
    if(act==='sign'){c.neg=!c.neg;c.val=(q('#ans')||{}).value||'';render();return}
    if(act==='reveal'){c.results[c.step]=false;bump(false);c.phase='fb';render();return}
    if(act==='nextstep')return nextStep();
  }
  if(c.g.kind==='choice'&&b.dataset.opt!=null&&c.picked<0){c.picked=+b.dataset.opt;const ok=c.picked===c.g.answer;c.results=[ok];bump(ok);finishQ(ok?1:0,1);render();return}
  if(c.g.kind==='order'){
    if(b.dataset.add!=null){c.chosen.push(+b.dataset.add);render();return}
    if(b.dataset.un!=null){c.chosen.splice(+b.dataset.un,1);render();return}
    if(act==='clear'){c.chosen=[];render();return}
    if(act==='checkorder'){const ok=c.chosen.every((i,pos)=>i===pos);c.results=[ok];bump(ok);c.phase='fb';finishQ(ok?1:0,1);render();return}
  }
  if(c.g.kind==='flash'){
    if(act==='reveal'){c.revealed=true;render();return}
    if(act==='got'||act==='missed'){const ok=act==='got';c.results=[ok];bump(ok);finishQ(ok?1:0,1);nextQ();return}
  }
});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();checkStep()}});
tabsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab)});
window.addEventListener('hashchange',()=>{if(!S)fromHash()});
fromHash();
window.__ibd={get S(){return S},ST:()=>ST};
})();
