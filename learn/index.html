const LESSONS=[
{m:'is',title:'Build an income statement',mins:7,steps:[
 {t:'say',text:'An income statement answers one question: how much did the company earn this period, and from what? You are going to build one line by line.'},
 {t:'board',title:'Harbor Foods — income statement',given:[['Revenue','$1,000'],['COGS','$600'],['Operating expenses (ex D&A)','$200'],['D&A','$50'],['Interest expense','$30'],['Tax rate','25%'],['Diluted shares','45 mm']]},
 {t:'pick',q:'First thing to subtract from revenue?',options:['COGS','Interest','Taxes','D&A'],why:'The direct cost of what was sold comes off first. Financing and tax wait their turn.'},
 {t:'compute',label:'Gross profit',q:'Revenue 1,000 − COGS 600',a:400,unit:'$',formula:'Revenue − COGS',why:'Gross margin 400 ÷ 1,000 = 40%: every dollar of sales leaves 40 cents to cover everything else.'},
 {t:'compute',label:'EBITDA',q:'Gross profit 400 − operating expenses 200',a:200,unit:'$',formula:'Gross profit − operating expenses (before D&A)',why:'Not a GAAP line, but every multiple and every lender uses it.'},
 {t:'blank',q:'EBITDA = EBIT + ___',options:['D&A','Interest','Taxes','CapEx'],why:'The DA in EBITDA is depreciation and amortization: the non-cash charge you add back to operating income.'},
 {t:'compute',label:'EBIT (operating income)',q:'EBITDA 200 − D&A 50',a:150,unit:'$',formula:'EBITDA − D&A',why:'Operating income. Everything above this line is about running the business, nothing about how it is financed.'},
 {t:'pick',q:'Interest comes next. Why does it sit below EBIT instead of inside operating expenses?',options:['It depends on how the company is financed, not on operations','It is paid once a year','It is tax-deductible','It is usually smaller than opex'],why:'Two identical businesses with different debt have the same EBIT and different net income. Keeping interest below EBIT keeps them comparable.'},
 {t:'compute',label:'Pretax income',q:'EBIT 150 − interest 30',a:120,unit:'$',formula:'EBIT − interest',why:''},
 {t:'compute',label:'Taxes',q:'Pretax income 120 × 25%',a:30,unit:'$',formula:'Pretax income × tax rate',why:'Taxes are computed after interest. The 30 of interest saved 30 × 25% = 7.5 of tax: the tax shield.'},
 {t:'compute',label:'Net income',q:'Pretax income 120 − taxes 30',a:90,unit:'$',formula:'Pretax income − taxes',why:'This number goes to the top of the cash flow statement and into retained earnings on the balance sheet.'},
 {t:'compute',label:'EPS',q:'Net income 90 ÷ 45 shares',a:2,unit:'$ps',formula:'Net income ÷ diluted shares',why:''},
 {t:'pick',q:'EBITDA margin for this company?',options:['20%','40%','15%','9%'],why:'EBITDA 200 ÷ revenue 1,000 = 20%. Gross margin is 40%, net margin is 9%.'},
 {t:'tap',q:'Tap the line that does NOT change when the company takes on more debt.',lines:['EBIT','Pretax income','Net income','EPS'],answer:0,why:'Interest sits below EBIT, so everything from pretax income down moves with debt. EBIT does not.'},
 {t:'say',text:'That is the shape: revenue → gross profit → EBITDA → EBIT → pretax → net income → EPS. Operating first, financing next, tax last.'},
 {t:'try',drill:'is_build',text:'Now do it with random numbers. The formula stays visible, and "Walk me through" shows the full solution without penalty.'}
]},
{m:'bs',title:'Build a balance sheet',mins:7,steps:[
 {t:'say',text:'The balance sheet is a snapshot: what the company owns and how it paid for it. It balances by construction, because every asset was funded by a creditor or an owner.'},
 {t:'board',title:'Harbor Foods — balance sheet',given:[['Cash','$100'],['Accounts receivable','$150'],['Inventory','$200'],['PP&E','$800'],['Accounts payable','$120'],['Short-term debt','$80'],['Long-term debt','$500'],['Common stock & APIC','$300']]},
 {t:'pick',q:'Which of these is a current asset?',options:['Inventory','PP&E','Long-term debt','Retained earnings'],why:'Current assets turn into cash within a year: cash, receivables, inventory, prepaids. PP&E takes years.'},
 {t:'compute',label:'Total current assets',q:'Cash 100 + AR 150 + inventory 200',a:450,unit:'$',formula:'Cash + AR + inventory',why:''},
 {t:'compute',label:'Total assets',q:'Current assets 450 + PP&E 800',a:1250,unit:'$',formula:'Current assets + long-term assets',why:''},
 {t:'tap',q:'Tap the item that is NOT a liability.',lines:['Accounts payable','Short-term debt','Long-term debt','Retained earnings'],answer:3,why:'Retained earnings belong to the owners. The other three are owed to someone.'},
 {t:'compute',label:'Total current liabilities',q:'AP 120 + short-term debt 80',a:200,unit:'$',formula:'AP + short-term debt',why:''},
 {t:'compute',label:'Total liabilities',q:'Current liabilities 200 + long-term debt 500',a:700,unit:'$',formula:'Current + long-term liabilities',why:''},
 {t:'pick',q:'Shareholders\' equity is…',options:['Assets minus liabilities: whatever is left for the owners','The market value of the shares','Cash minus debt','Revenue minus expenses'],why:'Equity is the residual claim. You never add it up from scratch; you back into it.'},
 {t:'compute',label:'Shareholders\' equity',q:'Total assets 1,250 − total liabilities 700',a:550,unit:'$',formula:'Assets − liabilities',why:''},
 {t:'compute',label:'Retained earnings',q:'Equity 550 − common stock & APIC 300',a:250,unit:'$',formula:'Equity − paid-in capital',why:'Cumulative net income minus cumulative dividends: where the income statement lands.'},
 {t:'pick',q:'Next year net income is 90 and no dividends are paid. Retained earnings become…',options:['340','250','160','90'],why:'250 + 90 = 340. Dividends would reduce it; buybacks would not (they hit treasury stock).'},
 {t:'compute',label:'Operating working capital',q:'AR 150 + inventory 200 − AP 120',a:230,unit:'$',formula:'Non-cash current assets − non-debt current liabilities',why:'Growth usually needs more of this, and every dollar of growth in it is cash the company had to put up.'},
 {t:'compute',label:'Net debt',q:'Short-term debt 80 + long-term debt 500 − cash 100',a:480,unit:'$',formula:'Debt − cash',why:'Cash could repay debt tomorrow, so valuation uses the net figure.'},
 {t:'pick',q:'The company buys back $50 of stock with cash. Equity…',options:['Falls by 50, through treasury stock','Rises by 50','Is unchanged','Falls by 50 × (1 − tax rate)'],why:'Cash −50, treasury stock (a negative equity line) +50. No income statement effect.'},
 {t:'try',drill:'bs_build',text:'Build one from random lines with the formulas visible.'}
]},
{m:'cfs',title:'Build a cash flow statement',mins:7,steps:[
 {t:'say',text:'Profit is accrual. Cash is cash. The cash flow statement starts from net income and reconciles the two. Build it.'},
 {t:'board',title:'Harbor Foods — cash flow statement',given:[['Net income','$90'],['D&A','$50'],['Accounts receivable','up $20'],['Inventory','down $10'],['Accounts payable','up $15'],['CapEx','$60'],['Debt repaid','$40'],['Dividends paid','$20'],['Beginning cash','$100']]},
 {t:'pick',q:'D&A reduced net income by 50. Did 50 of cash leave this year?',options:['No: add it back','Yes: subtract it again','Half of it: add back 25','Only if the asset was sold'],why:'The cash left when the asset was bought, in investing. Depreciation is an allocation, so CFO adds it back.'},
 {t:'pick',q:'Receivables rose 20. Cash effect in CFO?',options:['−20: sales were booked but not collected','+20: customers owe more','0: it is on the income statement already','−20 × (1 − tax rate)'],why:'Net income counted the sale; the cash is still with the customer. An operating asset going up uses cash.'},
 {t:'pick',q:'Inventory fell 10. Cash effect?',options:['+10: goods sold without new purchases','−10','0','+10 × tax rate'],why:'An operating asset going down releases cash.'},
 {t:'pick',q:'Payables rose 15. Cash effect?',options:['+15: suppliers funded the company a bit longer','−15: more owed','0','+15 × (1 − tax rate)'],why:'An operating liability going up frees cash.'},
 {t:'compute',label:'Working-capital adjustment',q:'−20 + 10 + 15',a:5,unit:'$',formula:'Sum of the three effects',why:''},
 {t:'compute',label:'Cash from operations',q:'Net income 90 + D&A 50 + working capital 5',a:145,unit:'$',formula:'NI + non-cash charges ± working capital',why:'The cash the business itself generated.'},
 {t:'tap',q:'Which section does CapEx belong in?',lines:['Operating','Investing','Financing'],answer:1,why:'Buying long-lived assets is investing in the business.'},
 {t:'compute',label:'Cash from investing',q:'CapEx 60 as an outflow (enter a negative number)',a:-60,unit:'$',formula:'− CapEx',why:''},
 {t:'pick',q:'Debt repayment and dividends go in…',options:['Financing','Operating','Investing','Nowhere: they are balance-sheet only'],why:'Both are flows to and from capital providers.'},
 {t:'compute',label:'Cash from financing',q:'−40 − 20',a:-60,unit:'$',formula:'− debt repaid − dividends',why:''},
 {t:'compute',label:'Net change in cash',q:'145 − 60 − 60',a:25,unit:'$',formula:'CFO + CFI + CFF',why:''},
 {t:'compute',label:'Ending cash',q:'Beginning cash 100 + 25',a:125,unit:'$',formula:'Beginning cash + net change',why:'This is the cash line on the balance sheet. Link #7.'},
 {t:'compute',label:'Free cash flow',q:'CFO 145 − CapEx 60',a:85,unit:'$',formula:'CFO − CapEx',why:'What the business generated after reinvesting in itself, before creditors and shareholders are paid.'},
 {t:'try',drill:'cfs_build',text:'Build one from random inputs with the sign rule visible.'}
]},
{m:'links',title:'Walk a transaction through all three',mins:8,steps:[
 {t:'say',text:'Every "walk me through" uses the same path: income statement, then cash flow statement, then balance sheet, then check that it balances. First one: depreciation rises by $10, tax rate 40%.'},
 {t:'board',title:'Depreciation +$10, tax 40%',given:[['Event','Depreciation expense rises by $10'],['Tax rate','40%']]},
 {t:'pick',q:'Income statement first. Pretax income changes by…',options:['−10','+10','−6','0'],why:'Depreciation is an operating expense: pretax income falls by the full amount.'},
 {t:'compute',label:'IS: net income',q:'−10 × (1 − 40%)',a:-6,unit:'$',formula:'Pretax change × (1 − t)',why:'Taxes fell by 4, so net income falls by only 6.'},
 {t:'pick',q:'Cash flow statement. Start from net income −6. Depreciation is…',options:['Non-cash: add back +10','A cash cost: subtract 10','Already in net income: no adjustment','Half cash: add back 5'],why:'No money left the company this year. The add-back reverses the accounting charge.'},
 {t:'compute',label:'CFS: net change in cash',q:'−6 + 10',a:4,unit:'$',formula:'Net income change + add-back',why:'Cash goes UP by 4, the tax saving (10 × 40%). Profit down, cash up.'},
 {t:'pick',q:'Balance sheet. Net PP&E changes by…',options:['−10','−6','+4','0'],why:'Accumulated depreciation grew by 10, so net PP&E fell by the full 10.'},
 {t:'compute',label:'BS: change in total assets',q:'PP&E −10 + cash 4',a:-6,unit:'$',formula:'Sum of asset changes',why:''},
 {t:'pick',q:'Which line on the other side absorbs the −6?',options:['Retained earnings','Common stock','Treasury stock','Long-term debt'],why:'Net income flows into retained earnings. Liabilities did not move.'},
 {t:'pick',q:'Check: Δassets −6 = Δliabilities 0 + Δequity −6?',options:['Yes, it balances','No: assets fell 10','No: equity fell 10','Cannot tell without cash'],why:'If it does not balance, you missed a line. This one is clean.'},
 {t:'say',text:'Second: the company buys $100 of inventory with cash.'},
 {t:'board',title:'Buy $100 of inventory with cash',given:[['Event','Inventory purchased for $100 cash'],['Sale','None yet']]},
 {t:'pick',q:'Income statement effect?',options:['None until the inventory is sold','−100 expense','−100 × (1 − t)','+100 revenue'],why:'Inventory becomes COGS only when sold.'},
 {t:'pick',q:'Cash flow statement: inventory up 100 means…',options:['Cash −100 in operating (asset up)','Cash +100 in operating','Cash −100 in investing','No cash effect'],why:'Working capital lives in CFO. An operating asset going up uses cash.'},
 {t:'pick',q:'Balance sheet: which two lines move?',options:['Inventory +100, cash −100','Inventory +100, payables +100','Inventory +100, equity −100','Cash −100, retained earnings −100'],why:'One asset swapped for another. Liabilities and equity untouched. Balanced.'},
 {t:'say',text:'Third: the company raises $100 of debt at 10% interest, then a year passes. Tax 40%.'},
 {t:'board',title:'Raise $100 of debt at 10%',given:[['Event','$100 of debt issued, held as cash'],['Interest rate','10%'],['Tax rate','40%']]},
 {t:'pick',q:'At issuance, the income statement…',options:['Does not move','Shows +100 of income','Shows −10 of interest','Shows −100 of expense'],why:'Borrowing is not income. Cash +100 and debt +100 on the balance sheet; +100 in financing on the CFS.'},
 {t:'compute',label:'Year 1: net income change',q:'Interest 100 × 10% = 10; net income change = −10 × (1 − 40%)',a:-6,unit:'$',formula:'− interest × (1 − t)',why:'Interest is a real cash cost: no add-back. Cash −6, retained earnings −6.'},
 {t:'pick',q:'After year one the balance sheet shows…',options:['Cash −6, retained earnings −6, debt unchanged','Cash −10, debt −10','Cash −6, debt −6','Cash −10, retained earnings −10'],why:'Principal is untouched until repaid. Only the after-tax interest left as cash.'},
 {t:'try',drill:'link_walk',text:'Walk a random transaction with the method in front of you.'}
]},
{m:'ev',title:'Equity value to enterprise value',mins:7,steps:[
 {t:'say',text:'Equity value is what the shares are worth. Enterprise value is what the whole operating business is worth to everyone who funds it. Build both.'},
 {t:'board',title:'Harbor Foods — the bridge',given:[['Share price','$20'],['Diluted shares','100 mm'],['Cash','$300'],['Debt','$800'],['Preferred stock','$100']]},
 {t:'compute',label:'Equity value',q:'Price 20 × 100 shares',a:2000,unit:'$',formula:'Price × diluted shares',why:''},
 {t:'pick',q:'A buyer of the whole business gets the $300 of cash. So in enterprise value, cash is…',options:['Subtracted','Added','Ignored','Added only if it exceeds debt'],why:'Pay 2,000 for a company holding 300 of cash and you really paid 1,700 for the business.'},
 {t:'compute',label:'Net debt',q:'Debt 800 − cash 300',a:500,unit:'$',formula:'Debt − cash',why:''},
 {t:'compute',label:'Enterprise value',q:'2,000 − 300 + 800 + 100',a:2600,unit:'$',formula:'Equity value − cash + debt + preferred',why:'Lenders and preferred holders have claims on the business too.'},
 {t:'pick',q:'Why add preferred stock?',options:['It is a claim on the business ahead of common shareholders','It is a form of cash','It reduces the debt','It is already inside equity value'],why:'A buyer must honor it, and consolidated EBITDA is before preferred dividends, so the numerator must include it.'},
 {t:'say',text:'Now dilution. Options with a strike below the share price will become shares, so they belong in the count.'},
 {t:'board',title:'Treasury stock method',given:[['Basic shares','100 mm'],['Options outstanding','10 mm'],['Strike price','$12'],['Share price','$20']]},
 {t:'pick',q:'Strike $12, price $20. Are the options in the money?',options:['Yes: holders would exercise','No','Only half of them','Depends on vesting'],why:'Strike below price means exercising makes money.'},
 {t:'compute',label:'Proceeds from exercise',q:'10 options × $12 strike',a:120,unit:'$',formula:'Options × strike',why:''},
 {t:'compute',label:'Shares repurchased',q:'Proceeds 120 ÷ price 20',a:6,unit:'mm',formula:'Proceeds ÷ share price',why:'TSM assumes the company uses the cash to buy back as many shares as it can.'},
 {t:'compute',label:'Net new shares',q:'10 − 6',a:4,unit:'mm',formula:'Options − shares repurchased',why:'Shortcut: 10 × (1 − 12 ÷ 20) = 4.'},
 {t:'compute',label:'Diluted shares',q:'100 + 4',a:104,unit:'mm',formula:'Basic + net new shares',why:'Equity value for valuation uses this count.'},
 {t:'pick',q:'The company issues $100 of stock and keeps the cash. Enterprise value…',options:['Unchanged','Up 100','Down 100','Up 100 × (1 − t)'],why:'Equity +100, cash +100: they cancel in EV. The business did not change.'},
 {t:'pick',q:'Which metric pairs with enterprise value?',options:['EBITDA','Net income','EPS','Dividends'],why:'EBITDA is before interest, so it belongs to all capital providers, like EV. Net income is after interest: pair it with equity value.'},
 {t:'try',drill:'ev_bridge',text:'Bridge random numbers in both directions.'}
]},
{m:'mult',title:'Multiples, computed and applied',mins:6,steps:[
 {t:'say',text:'A multiple is a price per dollar of some metric. The only hard rule: the numerator must match the metric. Compute three, then apply one.'},
 {t:'board',title:'Harbor Foods — multiples',given:[['Enterprise value','$2,600'],['Equity value','$2,000'],['Revenue','$1,300'],['EBITDA','$260'],['Net income','$125']]},
 {t:'compute',label:'EV / EBITDA',q:'2,600 ÷ 260',a:10,unit:'x',formula:'EV ÷ EBITDA',why:'The workhorse: capital-structure and tax neutral, close to cash flow.'},
 {t:'compute',label:'EV / Revenue',q:'2,600 ÷ 1,300',a:2,unit:'x',formula:'EV ÷ revenue',why:''},
 {t:'pick',q:'P/E uses which value on top?',options:['Equity value','Enterprise value','Net debt','EBITDA'],why:'Net income is after interest, so it belongs to shareholders only.'},
 {t:'compute',label:'P / E',q:'2,000 ÷ 125',a:16,unit:'x',formula:'Equity value ÷ net income',why:''},
 {t:'compute',label:'Earnings yield',q:'1 ÷ 16, as a percent',a:6.25,unit:'%',formula:'1 ÷ P/E',why:'The inverse of P/E. In M&A it is the cost of paying with stock.'},
 {t:'say',text:'Now use a peer multiple to value a different company.'},
 {t:'board',title:'Apply the comps',given:[['Peer median EV / EBITDA','9.0x'],['Target EBITDA','$150'],['Cash','$50'],['Debt','$400'],['Diluted shares','50 mm']]},
 {t:'compute',label:'Implied EV',q:'9 × 150',a:1350,unit:'$',formula:'Multiple × metric',why:''},
 {t:'compute',label:'Implied equity value',q:'1,350 + 50 − 400',a:1000,unit:'$',formula:'EV + cash − debt',why:''},
 {t:'compute',label:'Implied share price',q:'1,000 ÷ 50',a:20,unit:'$ps',formula:'Equity value ÷ diluted shares',why:'That is the entire comps method: multiple × metric → EV → equity → per share.'},
 {t:'pick',q:'Peers trade at 8x, 9x, 9x, 10x and 30x. Which number do you use?',options:['The median, 9x','The mean, 13.2x','The highest, 30x','The lowest, 8x'],why:'One outlier drags the mean from 9 to 13. The median ignores it.'},
 {t:'pick',q:'A company has negative EBITDA. Which multiple still works?',options:['EV / Revenue','EV / EBITDA','P / E','EV / EBIT'],why:'You cannot capitalize a negative number.'},
 {t:'pick',q:'A retailer leases its stores; peers own theirs. The fair comparison is…',options:['EV / EBITDAR','EV / EBITDA','P / E','EV / Revenue'],why:'Rent sits above EBITDA while owners\' costs sit below it. Adding rent back levels the field.'},
 {t:'try',drill:'mult_implied',text:'Apply a random comps multiple to a share price.'}
]},
{m:'val',title:'The methodologies',mins:6,steps:[
 {t:'say',text:'Three methods plus one: comps and precedents are relative, a DCF is intrinsic, an LBO analysis is what a sponsor could pay. Start with the one most people get wrong.'},
 {t:'pick',q:'Which method is intrinsic rather than relative?',options:['DCF','Comparable companies','Precedent transactions','LBO analysis'],why:'A DCF values the cash flows themselves. The others price the company off what the market or buyers paid for similar ones.'},
 {t:'order',q:'Put the comps steps in order.',items:['Pick 5–10 peers: industry, size, growth, margins','Compute each peer\'s equity value, EV and multiples','Look at the range: 25th, median, 75th percentile','Decide where the target belongs in that range','Apply the multiple to the target\'s metric, bridge to per share'],why:'Peers → their multiples → where the target sits → apply → bridge.'},
 {t:'say',text:'Precedents are built from deals, so the multiple includes a control premium. Build one.'},
 {t:'board',title:'A takeover, the precedents way',given:[['Unaffected share price','$40'],['Offer price','$52'],['Diluted shares','100 mm'],['Target debt','$600'],['Target cash','$100'],['Target EBITDA','$475']]},
 {t:'compute',label:'Premium',q:'52 ÷ 40 − 1, as a percent',a:30,unit:'%',formula:'Offer ÷ unaffected − 1',why:'Typical range 20–40%.'},
 {t:'compute',label:'Equity purchase price',q:'52 × 100',a:5200,unit:'$',formula:'Offer × diluted shares',why:''},
 {t:'compute',label:'Transaction EV',q:'5,200 + 600 − 100',a:5700,unit:'$',formula:'Equity price + debt − cash',why:'The buyer assumes the debt and gets the cash.'},
 {t:'compute',label:'Multiple paid',q:'5,700 ÷ 475',a:12,unit:'x',formula:'Transaction EV ÷ EBITDA',why:'This is the number that goes into a precedents comp set.'},
 {t:'pick',q:'Precedents usually come out highest because…',options:['Deal prices include a control premium','The data is stale','Synergies are excluded','They use book values'],why:'Buyers pay above market for control and synergies.'},
 {t:'pick',q:'An LBO analysis is usually the floor because…',options:['A sponsor needs 20%+ returns with no synergies','Debt is expensive','It uses book value','It ignores growth'],why:'Strategic buyers with synergies can pay more than a financial buyer with a hard return hurdle.'},
 {t:'pick',q:'On a football field you…',options:['Triangulate across the bars','Average the bars','Take the highest bar','Take the DCF bar'],why:'Each method answers a slightly different question. You weigh them; you never average them.'},
 {t:'try',drill:'val_premium',text:'Turn a random offer into a premium, a price and a multiple.'}
]},
{m:'dcf',title:'Build a DCF',mins:9,steps:[
 {t:'say',text:'Value is the cash flows, discounted for time and risk. Build each piece: the cash flow, the discount rate, the terminal value, the bridge.'},
 {t:'board',title:'Unlevered free cash flow',given:[['EBIT','$150'],['Tax rate','25%'],['D&A','$50'],['CapEx','$60'],['Increase in NWC','$10']]},
 {t:'compute',label:'Taxes on EBIT',q:'150 × 25%',a:37.5,unit:'$',formula:'EBIT × tax rate',why:'Unlevered: tax the operating profit as if there were no debt.'},
 {t:'compute',label:'NOPAT',q:'150 − 37.5',a:112.5,unit:'$',formula:'EBIT − taxes',why:''},
 {t:'compute',label:'Unlevered FCF',q:'112.5 + 50 − 60 − 10',a:92.5,unit:'$',formula:'NOPAT + D&A − CapEx − ΔNWC',why:'Add back the non-cash D&A; subtract the real cash spent on assets and working capital.'},
 {t:'pick',q:'Why is there no interest in unlevered FCF?',options:['The cost of debt is captured in WACC instead','Interest is non-cash','Interest is already after tax','Lenders are paid last'],why:'UFCF goes to all capital providers; discounting it at WACC prices the debt. Subtracting interest too would double count.'},
 {t:'board',title:'WACC',given:[['Market cap (E)','$2,000'],['Debt (D)','$800'],['Risk-free rate','4%'],['Beta','1.2'],['Equity risk premium','5.5%'],['Pre-tax cost of debt','6%'],['Tax rate','25%']]},
 {t:'compute',label:'Cost of equity',q:'4 + 1.2 × 5.5',a:10.6,unit:'%',formula:'Rf + β × ERP (CAPM)',why:''},
 {t:'compute',label:'After-tax cost of debt',q:'6 × (1 − 25%)',a:4.5,unit:'%',formula:'Kd × (1 − t)',why:'Interest is deductible, so debt is cheaper than it looks.'},
 {t:'compute',label:'Equity weight',q:'2,000 ÷ 2,800, as a percent',a:71.4,unit:'%',formula:'E ÷ (E + D)',why:'Debt weight is the rest: 28.6%.'},
 {t:'compute',label:'WACC',q:'0.714 × 10.6 + 0.286 × 4.5',a:8.86,unit:'%',formula:'E/V × Ke + D/V × Kd × (1 − t)',why:'The blended return everyone who funds the company requires.'},
 {t:'pick',q:'WACC rises by one point. The DCF value…',options:['Falls','Rises','Is unchanged','Rises only if growth rises too'],why:'Every cash flow and the terminal value are divided by a bigger number.'},
 {t:'board',title:'Terminal value and the bridge',given:[['PV of years 1–3 FCF','$272.9'],['Year-3 EBITDA','$300'],['Exit multiple','9x'],['Year-3 discount factor','0.772'],['Net debt','$500'],['Diluted shares','100 mm']]},
 {t:'compute',label:'Terminal value',q:'300 × 9',a:2700,unit:'$',formula:'Final-year EBITDA × exit multiple',why:''},
 {t:'compute',label:'PV of terminal value',q:'2,700 × 0.772',a:2084.4,unit:'$',formula:'TV × final-year discount factor',why:'That is 88% of the value: terminal assumptions drive the answer.'},
 {t:'compute',label:'Enterprise value',q:'272.9 + 2,084.4',a:2357.3,unit:'$',formula:'PV of FCFs + PV of TV',why:''},
 {t:'compute',label:'Equity value',q:'2,357.3 − 500',a:1857.3,unit:'$',formula:'EV − net debt',why:''},
 {t:'compute',label:'Implied share price',q:'1,857.3 ÷ 100',a:18.57,unit:'$ps',formula:'Equity value ÷ diluted shares',why:''},
 {t:'pick',q:'Before trusting an exit multiple you should…',options:['Back out the growth rate it implies and check it is reasonable','Average it with the current multiple','Use the higher of the two terminal values','Ignore Gordon growth'],why:'If a 9x exit implies 6% growth forever, the multiple is too rich. Cross-check both ways.'},
 {t:'try',drill:'dcf_wacc',text:'Build a WACC from random inputs with the formulas visible.'}
]},
{m:'ma',title:'Build a merger model',mins:9,steps:[
 {t:'say',text:'A merger model asks one thing: is the buyer\'s EPS higher after the deal? Build it on a real deal, every number derived.'},
 {t:'board',title:'Vantage Industries acquires Copperline',given:[['Buyer share price','$66'],['Buyer shares','120 mm'],['Buyer net income','$660'],['Buyer EPS','$5.50'],['Target share price','$36'],['Target shares','40 mm'],['Target net income','$100'],['Premium','30%'],['Financing','50% stock, 50% cash'],['Interest earned on cash','3%'],['Tax rate','25%']]},
 {t:'compute',label:'Offer price per share',q:'36 × (1 + 30%)',a:46.8,unit:'$ps',formula:'Target price × (1 + premium)',why:''},
 {t:'compute',label:'Equity purchase price',q:'46.80 × 40',a:1872,unit:'$',formula:'Offer price × target shares',why:'What the buyer pays for all the target\'s shares.'},
 {t:'pick',q:'How much of that price is paid in stock?',options:['50% of 1,872 = 936','All 1,872','25% of 1,872 = 468','The buyer\'s net income, 660'],why:'The financing mix splits the purchase price. This is the number that was missing from the explanation you saw.'},
 {t:'compute',label:'New buyer shares issued',q:'936 ÷ 66',a:14.18,unit:'mm',formula:'Stock portion ÷ buyer share price',why:'The buyer pays with its own shares at $66 each. Those shares dilute the buyer\'s earnings.'},
 {t:'compute',label:'Cash used',q:'50% × 1,872',a:936,unit:'$',formula:'Cash portion of the price',why:''},
 {t:'compute',label:'Foregone interest',q:'936 × 3%',a:28.08,unit:'$',formula:'Cash used × interest rate on cash',why:'That cash stops earning interest.'},
 {t:'compute',label:'After-tax cost of cash',q:'28.08 × (1 − 25%)',a:21.06,unit:'$',formula:'Foregone interest × (1 − t)',why:'Net income is after tax, so every cost gets taxed too.'},
 {t:'compute',label:'Pro forma net income',q:'660 + 100 − 21.06',a:738.94,unit:'$',formula:'Buyer NI + target NI − after-tax cost of financing',why:'Buyer plus target, minus the cost of the currency.'},
 {t:'compute',label:'Pro forma shares',q:'120 + 14.18',a:134.18,unit:'mm',formula:'Buyer shares + new shares',why:'The target\'s 40mm shares are gone: they were bought.'},
 {t:'compute',label:'Pro forma EPS',q:'738.94 ÷ 134.18',a:5.51,unit:'$ps',formula:'Pro forma NI ÷ pro forma shares',why:''},
 {t:'pick',q:'Standalone EPS $5.50, pro forma $5.51. The deal is…',options:['Barely accretive','Dilutive','Exactly breakeven','Cannot tell without synergies'],why:'5.51 ÷ 5.50 − 1 = +0.1%. The cheap cash offsets the dilution from stock.'},
 {t:'pick',q:'The cost of using stock as currency is…',options:['The buyer\'s earnings yield: 1 ÷ 12 = 8.3%','The buyer\'s dividend yield','The interest rate on cash','Zero, since no cash leaves'],why:'Each new share claims 1 ÷ P/E of earnings. At a 12x P/E, stock is an 8.3% currency; cash at 3% × 0.75 = 2.25% is far cheaper.'},
 {t:'pick',q:'All-stock deal: buyer at 20x, target bought at 15x. The deal is…',options:['Accretive','Dilutive','Breakeven','Depends on the premium'],why:'Buyer P/E above the target\'s at the offer means accretive: the buyer\'s paper costs 5% and buys a 6.7% yield.'},
 {t:'try',drill:'ma_full',text:'Run a random deal with the formulas visible and a walk-through one tap away.'}
]},
{m:'lbo',title:'Build a paper LBO',mins:8,steps:[
 {t:'say',text:'A sponsor buys a company with mostly borrowed money, repays the debt from the company\'s cash flow, and sells. Build the whole thing.'},
 {t:'board',title:'Paper LBO',given:[['EBITDA today','$100'],['Entry multiple','8x'],['Leverage','5x EBITDA'],['EBITDA growth','10% per year'],['Free cash flow','$40 per year, all to debt'],['Exit multiple','8x'],['Hold','5 years']]},
 {t:'compute',label:'Entry EV',q:'100 × 8',a:800,unit:'$',formula:'EBITDA × entry multiple',why:''},
 {t:'compute',label:'Debt raised',q:'5 × 100',a:500,unit:'$',formula:'Leverage × EBITDA',why:''},
 {t:'compute',label:'Sponsor equity',q:'800 − 500',a:300,unit:'$',formula:'Entry EV − debt',why:'The sponsor funds 300 of an 800 purchase. That is the whole trick.'},
 {t:'pick',q:'The company generates $40 of free cash flow a year. Where does it go?',options:['Repaying debt','Dividends to the sponsor','Management bonuses','Buying back shares'],why:'A cash sweep: every dollar repaid shifts value from lenders to the sponsor\'s equity.'},
 {t:'compute',label:'Debt at exit',q:'500 − 5 × 40',a:300,unit:'$',formula:'Debt raised − cumulative paydown',why:''},
 {t:'compute',label:'Year-5 EBITDA',q:'100 × 1.1^5',a:161.05,unit:'$',formula:'EBITDA × (1 + g)^5',why:'The ^ key is on the keypad.'},
 {t:'compute',label:'Exit EV',q:'161.05 × 8',a:1288.4,unit:'$',formula:'Year-5 EBITDA × exit multiple',why:''},
 {t:'compute',label:'Exit equity',q:'1,288.4 − 300',a:988.4,unit:'$',formula:'Exit EV − remaining debt',why:''},
 {t:'compute',label:'MOIC',q:'988.4 ÷ 300',a:3.29,unit:'x2',formula:'Exit equity ÷ sponsor equity',why:''},
 {t:'compute',label:'IRR',q:'3.29^(1/5) − 1, as a percent',a:26.9,unit:'%',formula:'MOIC^(1/years) − 1',why:'Rule of thumb: 3x over 5 years is about 25%.'},
 {t:'pick',q:'Where did the return come from here?',options:['Debt paydown and EBITDA growth; same multiple in and out','Multiple expansion','Fees and dividends','Lower taxes'],why:'Three levers: paydown, growth, multiple. Only two were pulled.'},
 {t:'pick',q:'Same 3.3x, but it takes 7 years instead of 5. The IRR…',options:['Falls, to about 19%','Rises','Stays the same','Doubles'],why:'IRR is annualized. Time is the enemy of IRR, which is why sponsors like early exits and dividend recaps.'},
 {t:'pick',q:'The better LBO candidate?',options:['Stable cash flows and low capex','High growth and heavy capex','Already highly levered','Pre-revenue with a great product'],why:'Debt must be serviced every year. Predictability beats growth.'},
 {t:'try',drill:'lbo_paper',text:'Run a random paper LBO with the formulas visible.'}
]}
];

(()=>{
const E=IBD, F=E.fmt;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=(sel,el=document)=>el.querySelector(sel);
const view=q('#view'), topmeta=q('#topmeta'), tabsEl=q('#tabs'), sheet=q('#sheet'), fx=q('#fx');
let lastTap={x:window.innerWidth/2,y:window.innerHeight*0.6}, audio=null;
const KIND={steps:'Build it',choice:'Pick one',order:'Put in order',flash:'Say it out loud',model:'From scratch'};
const modById=Object.fromEntries(E.MODULES.map(m=>[m.id,m]));
const GROUPS=[...new Set(E.MODULES.map(m=>m.group))];
const ABC='ABCDEF';
const KEYS=[['7','8','9','÷','⌫'],['4','5','6','×','('],['1','2','3','−',')'],['±','0','.','+','^']];
const MOCK_SEQ=['super_qa','super_qa','super_quick','super_qa','super_qa','super_quick','super_qa','super_qa','super_quick','super_qa','super_quick','super_qa'];

// ---------- progress store (per device) ----------
const KEY='ibdrills.v1';
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const DEF=()=>({v:1,drills:{},days:{},sessions:0,coins:0,lessons:{},settings:{len:10,keypad:true,final:false,sound:true}});
let ST=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===1){s.settings=Object.assign({len:10,keypad:true,final:false,sound:true},s.settings||{});s.drills=s.drills||{};s.days=s.days||{};s.coins=s.coins||0;s.lessons=s.lessons||{};return s}}catch(e){}return DEF()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function record(id,ok,n){const d=ST.drills[id]||(ST.drills[id]={n:0,ok:0,last:0});d.n+=n;d.ok+=ok;d.last=Date.now();ST.days[dkey()]=(ST.days[dkey()]||0)+n;save()}
const dstat=id=>ST.drills[id]||{n:0,ok:0,last:0};
function modStats(mid){const ds=E.DRILLS.filter(d=>d.module===mid);let n=0,ok=0;ds.forEach(d=>{const s=dstat(d.id);n+=s.n;ok+=s.ok});const a=n?ok/n:0;const conf=Math.min(1,n/(6*ds.length));return {n,ok,acc:a,mastery:Math.round(a*conf*100),count:ds.length}}
function weight(d){const s=dstat(d.id);const a=s.n?s.ok/s.n:0.5;const days=s.last?(Date.now()-s.last)/864e5:99;return 1+3*(1-a)+(s.n<3?1.5:0)+(days>=3?0.7:0)}
function pickDrill(pool,lastId){const cand=pool.length>1?pool.filter(d=>d.id!==lastId):pool;let tot=0;const w=cand.map(d=>{const v=weight(d);tot+=v;return v});let r=Math.random()*tot;for(let i=0;i<cand.length;i++){r-=w[i];if(r<=0)return cand[i]}return cand[cand.length-1]}
function streakDays(){let n=0;const d=new Date();if(!ST.days[dkey(d)]){d.setDate(d.getDate()-1);if(!ST.days[dkey(d)])return 0}for(;;){if(ST.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}else break}return n}
const totalReps=()=>Object.values(ST.drills).reduce((a,d)=>a+d.n,0);
const recent={};

// ---------- coins, sounds, effects ----------
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function tone(seq,type,vol){if(!ST.settings.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const t=audio.currentTime;seq.forEach(([f,d,len])=>{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(vol,t+d+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d+len);o.connect(g);g.connect(audio.destination);o.start(t+d);o.stop(t+d+len+0.05)})}catch(e){}}
const ding=()=>tone([[988,0,0.16],[1319,0.09,0.22]],'triangle',0.22);
const fanfare=()=>tone([[784,0,0.14],[988,0.12,0.14],[1175,0.24,0.14],[1568,0.36,0.4]],'triangle',0.2);
const thud=()=>tone([[150,0,0.18]],'square',0.08);
function coinBurst(x,y,n){if(!fx||reduceMotion())return;for(let i=0;i<n;i++){const c=document.createElement('i');c.className='fcoin';const dx=(Math.random()*2-1)*110,dy=-(60+Math.random()*140);c.style.left=(x-11)+'px';c.style.top=(y-11)+'px';c.style.setProperty('--dx',dx+'px');c.style.setProperty('--dy',dy+'px');c.style.animationDelay=(Math.random()*0.12)+'s';fx.appendChild(c);setTimeout(()=>c.remove(),1200)}}
function floatText(x,y,txt,cls){if(!fx||reduceMotion())return;const d=document.createElement('div');d.className=cls||'fplus';d.textContent=txt;d.style.left=x+'px';d.style.top=(y-30)+'px';fx.appendChild(d);setTimeout(()=>d.remove(),1300)}
function streakPop(n){if(!fx||reduceMotion())return;const d=document.createElement('div');d.className='fstreak';d.textContent=n>=10?'ON FIRE ×'+n:'STREAK ×'+n;fx.appendChild(d);setTimeout(()=>d.remove(),1200)}
function confetti(){if(!fx||reduceMotion())return;const cols=['#FFD23F','#4FB4FF','#7CEB3F','#FF5F55','#9A5BFF','#45E0FF','#fff'];for(let i=0;i<70;i++){const c=document.createElement('i');c.className='conf';c.style.left=(Math.random()*100)+'vw';c.style.background=cols[i%cols.length];c.style.animationDelay=(Math.random()*0.8)+'s';c.style.animationDuration=(1.4+Math.random()*1.2)+'s';fx.appendChild(c);setTimeout(()=>c.remove(),3200)}}
function award(n,opts){opts=opts||{};ST.coins=(ST.coins||0)+n;if(S)S.coins=(S.coins||0)+n;save();const pill=q('#coins');if(pill){pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump');const num=pill.querySelector('span');if(num)num.textContent=F.fnum(ST.coins)}coinBurst(lastTap.x,lastTap.y,Math.min(12,4+Math.round(n/5)));floatText(lastTap.x,lastTap.y,'+'+n);if(!opts.quiet)ding()}
function missFx(){thud();const el=q('.ask')||q('.opts')||q('.seq');if(el&&!reduceMotion()){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}}


// ---------- glossary (tap to explain) ----------
const GL=(()=>{const map=new Map();const terms=[];GLOSSARY.forEach((g,i)=>{(g.alt||[g.t]).forEach(a=>{map.set(a.toLowerCase(),i);terms.push(a)})});terms.sort((a,b)=>b.length-a.length);const re=new RegExp('(^|[^A-Za-z0-9&/β])('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')).join('|')+')(?![A-Za-z0-9])','gi');return {map,re}})();
function linkTerms(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;const p=n.parentElement;if(!p||p.closest('button,summary,input,.kp,.inp,.calc,.grid,.term,.brand,.seg,.sbar,.bar,.eyebrow,.selinfo,.ws .v,h2.qt.nolink'))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{const txt=n.nodeValue;GL.re.lastIndex=0;if(!GL.re.test(txt))return;GL.re.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;
    while((m=GL.re.exec(txt))){const start=m.index+m[1].length;const idx=GL.map.get(m[2].toLowerCase());if(idx==null)continue;if(start>last)frag.appendChild(document.createTextNode(txt.slice(last,start)));const span=document.createElement('span');span.className='term';span.dataset.term=String(idx);span.textContent=m[2];frag.appendChild(span);last=start+m[2].length}
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));n.parentNode.replaceChild(frag,n)});
}
function showSheet(html){sheet.innerHTML=`<div class="sheetin">${html}<div class="acts"><button class="btn" data-act="closesheet">Close</button></div></div>`;sheet.hidden=false;linkTerms(sheet)}
function hideSheet(){sheet.hidden=true;sheet.innerHTML=''}
function showTerm(i){const g=GLOSSARY[i];if(!g)return;const m=g.m&&modById[g.m];showSheet(`<span class="eyebrow">Term</span><h3>${esc(g.t)}</h3><p>${esc(g.d)}</p>${g.f?`<div class="hint mono">${esc(g.f)}</div>`:''}${m?`<button class="link" data-act="notes" data-mod="${m.id}">Read the ${esc(m.name)} notes →</button>`:''}`)}
function showWhy(){const c=S&&S.cur;if(!c)return;const m=modById[c.d.module];showSheet(`<span class="eyebrow">What this tests</span><h3>${esc(c.d.name)}</h3><p>${esc(WHY[c.d.id]||'')}</p>${c.g.kind==='steps'?'<p class="dimtext">Type an expression if you like: 1250*0.3 or (100-40)*0.75. The keypad has × ÷ ^ and parentheses.</p>':''}${LESSONS.find(l=>l.m===m.id)?`<button class="link" data-act="lesson" data-mod="${m.id}">Open the ${esc(m.name)} lesson →</button><br>`:''}<button class="link" data-act="notes" data-mod="${m.id}">Read the ${esc(m.name)} notes →</button>`)}

// ---------- app state ----------
let tab='drill', modView=null, S=null, resetArmed=false, Lz=null; // Lz = active lesson {m,i,rev,picked}
function go(t,m){tab=t;modView=m||null;S=null;Lz=null;resetArmed=false;hideSheet();const h=t==='drill'?(m?'#m-'+m:'#drill'):'#'+t;if(location.hash!==h){try{history.replaceState(null,'',h)}catch(e){}}render();window.scrollTo(0,0)}
function fromHash(){const h=location.hash||'';if(h==='#learn')return go('learn');if(h==='#stats')return go('stats');if(h.startsWith('#m-')&&modById[h.slice(3)])return go('drill',h.slice(3));go('drill')}

// ---------- session ----------
function startSession(o){S={label:o.label,pool:o.pool||[],seq:o.seq||null,len:o.seq?o.seq.length:o.len,i:0,done:[],lastId:null,ok:0,n:0,streak:0,best:0,coins:0,back:o.back||{t:'drill'},timed:!!o.timed,opts:o.opts||{}};ST.sessions++;save();hideSheet();nextQ()}
function nextQ(){
  if(S.len&&S.i>=S.len)return summary();
  const d=S.seq?E.byId[S.seq[S.i]]:pickDrill(S.pool,S.lastId);
  const seed=((Date.now()&0xffffff)^Math.floor(Math.random()*0x3fffffff))>>>0;
  const g=E.generate(d.id,seed,recent[d.id]||[]); if(g.key)recent[d.id]=[...(recent[d.id]||[]),g.key].slice(-5);
  S.lastId=d.id;S.i++;
  S.cur={g,d,step:0,tries:0,phase:'ask',hint:false,val:'',chosen:[],picked:-1,revealed:false,results:[],msg:'',cells:{},sel:null,grade:{},final:!!S.opts.final,t0:Date.now()};
  if(g.kind==='model'){const keys=askedCells(S.cur);S.cur.sel=keys[0]||null}
  render();window.scrollTo(0,0);

function curBuf(c){return c.g.kind==='model'?(c.sel?(c.cells[c.sel]||''):''):(c.val||'')}
function setBuf(c,buf){if(c.g.kind==='model'){if(c.sel)c.cells[c.sel]=buf}else c.val=buf}
function syncInput(){const c=S.cur;const buf=curBuf(c);const inp=q('#ans');if(inp&&inp.value!==buf)inp.value=buf;const calc=q('#calc');if(calc)calc.innerHTML=calcPreview(buf);c.msg='';if(c.g.kind==='model'&&c.sel){const td=q(`[data-cell="${c.sel}"]`);if(td){const {cell}=cellAt(c.g,c.sel);td.textContent=cellText(cell,buf)}}}
function keyPress(k){const c=S.cur;if(!c)return;if(k==='→'){if(c.g.kind==='model'){nextCell(c);render()}else checkStep();return}
  let buf=curBuf(c);if(k==='⌫')buf=buf.slice(0,-1);else if(k==='±')buf=buf.startsWith('-')?buf.slice(1):'-'+buf;else buf+=k;setBuf(c,buf);syncInput()}
function checkStep(){
  const c=S.cur,st=c.g.steps[c.step];const raw=curBuf(c).trim();
  const r=E.checkNum(st,raw);
  if(r.bad){c.msg=raw?'That is not a number yet.':'Enter a number.';render();return}
  c.msg='';
  if(r.ok){const coached=!!(c.coached&&c.coached[c.step]);c.results[c.step]=c.tries===0&&!coached;if(coached){award(5)}else bump(c.tries===0);c.phase='fb';}
  else if(c.tries===0){c.tries=1;c.phase='retry';}
  else {c.results[c.step]=false;bump(false);c.phase='fb';}
  render();
}
function nextStep(){const c=S.cur;c.step++;c.tries=0;c.val='';c.hint=false;c.msg='';if(c.step>=c.g.steps.length){c.phase='done';finishQ(c.results.filter(Boolean).length,c.g.steps.length)}else c.phase='ask';render()}
function skipQ(){const c=S.cur;if(!c)return;if(c.g.kind==='steps'){if(c.phase==='done'){nextQ();return}for(let i=c.step;i<c.g.steps.length;i++)c.results[i]=false;c.step=c.g.steps.length;c.phase='done';bump(false);finishQ(c.results.filter(Boolean).length,c.g.steps.length);render();return}
  if(c.g.kind==='model'){if(c.phase==='graded'){nextQ();return}gradeModel(c,true);return}
  if(c.g.kind==='choice'&&c.picked<0){c.picked=-2;c.results=[false];bump(false);finishQ(0,1);nextQ();return}
  if(c.g.kind==='order'&&c.phase!=='fb'){c.results=[false];bump(false);finishQ(0,1);nextQ();return}
  if(c.g.kind==='flash'){c.results=[false];bump(false);finishQ(0,1);nextQ();return}
  nextQ();
}
document.addEventListener('click',e=>{

  if(e.target===sheet){hideSheet();return}
  const b=e.target.closest('button,td.cell');if(!b)return;
  const act=b.dataset.act;
  if(act==='closesheet'){hideSheet();return}
  if(act==='why'){showWhy();return}
  if(b.dataset.gl!=null){showTerm(+b.dataset.gl);return}
  if(act==='notes'){hideSheet();go('learn');const d=q('#n-'+b.dataset.mod);if(d){d.open=true;d.scrollIntoView()}return}
  if(b.dataset.tab){go(b.dataset.tab);return}
  if(b.dataset.mod&&!act){return go('drill',b.dataset.mod)}
  if(b.dataset.drill){return startDrill(b.dataset.drill)}

  if(b.dataset.kp!=null){ST.settings.keypad=b.dataset.kp==='1';save();render();return}
  if(b.dataset.final!=null){ST.settings.final=b.dataset.final==='1';save();render();return}
  if(act==='lessons'){go('learn');return}
  if(act==='lesson'){openLesson(b.dataset.mod);return}
  if(Lz){
    if(act==='lexit'){Lz=null;go('learn');return}
    if(act==='lnext'){lessonNext();return}
    if(act==='lcheck'){lzCheck();return}
    if(act==='lshow'){const st=lzStep();Lz.ok=false;Lz.phase='fb';lzPushRow(st,false);render();return}
    if(b.dataset.k!=null){lzKey(b.dataset.k);return}
    if(b.dataset.lopt!=null&&Lz.picked<0){Lz.picked=+b.dataset.lopt;if(Lz.picked===Lz.answer)award(10);else missFx();render();return}
    if(b.dataset.ltap!=null&&Lz.picked<0){Lz.picked=+b.dataset.ltap;if(Lz.picked===lzStep().answer)award(10);else missFx();render();return}
    if(b.dataset.ladd!=null){Lz.chosen.push(+b.dataset.ladd);render();return}
    if(b.dataset.lun!=null){Lz.chosen.splice(+b.dataset.lun,1);render();return}
    if(act==='lclear'){Lz.chosen=[];render();return}
    if(act==='lcheckorder'){Lz.ok=Lz.chosen.every((i,pos)=>i===pos);Lz.phase='fb';if(Lz.ok)award(15);else missFx();render();return}
    if(act==='ltry'){ST.lessons[Lz.m]={done:true,slide:0};save();const d=b.dataset.ldrill;Lz=null;startDrill(d,true);return}
    return;
  }
  if(act==='random')return startRandom();
  if(act==='mock')return startMock();
  if(act==='buildmod')return go('drill','build');
  if(act==='case')return startModule('case');
  if(act==='drillmod')return startModule(b.dataset.mod);
  if(act==='home')return go('drill');
  if(act==='reset'){if(!resetArmed){resetArmed=true;render();return}ST=DEF();ST.settings=Object.assign(DEF().settings,{});save();resetArmed=false;render();return}
  if(!S)return;
  if(act==='quit'){const back=S.back;S=null;return go(back.t,back.m)}
  if(act==='again'){const o={label:S.label,pool:S.pool,seq:S.seq,len:S.len,back:S.back,timed:S.timed,opts:S.opts};return startSession(o)}
  const c=S.cur;if(!c)return;
  if(act==='skip')return skipQ();
  if(act==='next')return nextQ();
  if(b.dataset.k!=null){keyPress(b.dataset.k);return}
  if(c.g.kind==='steps'){
    if(act==='check')return checkStep();
    if(act==='hint'){c.hint=!c.hint;render();return}
    if(act==='coach'){c.coached=c.coached||{};c.coached[c.step]=true;render();return}
    if(act==='reveal'){c.results[c.step]=false;bump(false);c.phase='fb';render();return}

    if(b.dataset.cell!=null){const key=b.dataset.cell;if(c.phase==='graded'){const {row,tb,cell,ci}=cellAt(c.g,key);const raw=(c.cells[key]||'').trim();const v=raw?E.evalExpr(raw):NaN;const gr=c.grade[key];showSheet(`<span class="eyebrow">${esc(row.label)} · ${esc(tb.cols[ci])}</span><h3 class="${gr===true?'good':'weak'}">${gr===true?'Right':gr==='rev'?'Revealed':'Not right'}</h3><p>Correct: <b>${F.show(cell.a,cell.unit)}</b>${raw&&gr!=='rev'?`<br>You entered: ${isFinite(v)?F.fnum(v):esc(raw)}`:''}</p>${cell.f?`<div class="hint mono">${esc(cell.f)}</div>`:''}${cell.x?`<p>${esc(cell.x)}</p>`:''}`);return}

    if(act==='showmodel'){gradeModel(c,true);return}

  if(c.g.kind==='choice'&&b.dataset.opt!=null&&c.picked<0){c.picked=+b.dataset.opt;const ok=c.picked===c.g.answer;c.results=[ok];bump(ok);finishQ(ok?1:0,1);render();setTimeout(()=>{const fb=q('.fb');if(fb)try{fb.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}},50);return}
  if(c.g.kind==='order'){
    if(b.dataset.add!=null){c.chosen.push(+b.dataset.add);render();return}
    if(b.dataset.un!=null){c.chosen.splice(+b.dataset.un,1);render();return}
    if(act==='clear'){c.chosen=[];render();return}
    if(act==='checkorder'){const ok=c.chosen.every((i,pos)=>i===pos);c.results=[ok];bump(ok);c.phase='fb';finishQ(ok?1:0,1);render();return}
  }
  if(c.g.kind==='flash'){
    if(act==='reveal'){c.revealed=true;render();return}
    if(act==='got'||act==='missed'){const ok=act==='got';c.results=[ok];bump(ok);finishQ(ok?1:0,1);nextQ();return}
  }
