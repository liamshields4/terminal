  const VAL_CONCEPTS=[
    {q:'Which methodology usually produces the highest value, and why?',options:['Precedent transactions, because deal prices include a control premium','Public comps, because they reflect current market prices','DCF, because the terminal value dominates','LBO analysis, because leverage boosts returns'],explain:'Buyers pay for control and synergies. (A DCF with aggressive assumptions can top it, but precedents are the standard answer.)'},
    {q:'Which usually produces the lowest value?',options:['LBO analysis: the most a sponsor could pay and still hit its target return','DCF: it ignores market prices and uses conservative terminal assumptions','Precedent transactions: the deals are stale and reflect weaker markets','Public comps: trading multiples embed a liquidity discount for minority holders'],explain:'Financial buyers need 20%+ returns and have no synergies, so they cannot pay what a strategic can.'},
    {q:'A private company with no public peers but several recent acquisitions in its sector. Best approach?',options:['Precedent transactions supported by a DCF','Public comps from an adjacent sector only','Book value with an illiquidity discount','A dividend discount model'],explain:'Use what exists: deal multiples for relative value, DCF for intrinsic value, and an illiquidity discount if needed.'},
    {q:'Main weakness of a DCF?',options:['It is very sensitive to assumptions: WACC, growth and terminal value','It cannot be used for companies that carry significant amounts of debt','It ignores any cash flows beyond the explicit projection period','It requires a control premium assumption that is hard to justify'],explain:'Small changes in WACC or terminal growth move the answer a lot, and terminal value is most of it.'},
    {q:'Main weakness of precedent transactions?',options:['Deals are infrequent, reflect past conditions and buyer-specific synergies','They exclude the control premium, so they understate takeover value','They require projections ten years out for every comparable deal','They cannot be used when the target is a privately held company'],explain:'A deal from a hot market says little about today, and every deal has its own story.'},
    {q:'A football field is…',options:['A chart showing the valuation range from each methodology side by side','A sensitivity table of WACC against terminal growth','A ranking of comparable companies by multiple','A summary of the sources and uses of funds'],explain:'Horizontal bars per method (comps, precedents, DCF, LBO, 52-week range). You triangulate, not average.'},
    {q:'A control premium is…',options:['The amount paid above the unaffected share price to acquire control, typically 20–40%','The spread between enterprise value and equity value in a change-of-control deal','The fee paid to advisers and lenders when a company changes hands, usually 2–4%','The discount applied to a private company for lack of marketability, typically 20–30%'],explain:'Shareholders will not tender at market; the buyer pays up for control and the synergies it expects.'},
    {q:'When is a DCF least appropriate?',options:['Early-stage companies with unpredictable or negative cash flows','Regulated utilities','Mature consumer staples','Toll roads and other infrastructure assets'],explain:'With no stable cash flows to project, the model is guesswork. Utilities and infrastructure are the easiest DCFs.'},
    {q:'Sum-of-the-parts valuation is used for…',options:['Conglomerates whose segments deserve different multiples','Companies with a single product line and one clear set of peers','Banks and insurers, whose balance sheets are the business itself','Companies in bankruptcy, valued on the liquidation value of assets'],explain:'Value each segment with its own peers and method, add them up, subtract corporate costs and net debt.'},
    {q:'Which approaches are relative, and which intrinsic?',options:['Comps and precedents are relative; DCF is intrinsic','DCF and precedents are relative; comps is intrinsic','All three are relative to market prices','All three are intrinsic'],explain:'Relative: what the market pays for similar things. Intrinsic: the present value of the cash flows themselves.'},
    {q:'Why might public comps undervalue a target in a sale process?',options:['Trading prices are minority prices with no control premium or synergies','Peers are usually larger and trade at a discount','Comps use historical multiples only','Comps double count net debt'],explain:'A trading multiple prices a single share, not control of the company.'},
    {q:'Where does the 52-week high/low belong on a football field?',options:['As a reference bar, not a valuation method','As the primary bar that anchors the range','It replaces the comps bar','It is never shown to a board'],explain:'Boards compare the offer with recent trading history, so bankers show it alongside the methods.'},
    {q:'A buyer offers a 35% premium, yet the offer sits below the DCF range. The board should conclude…',options:['The DCF assumptions may be too aggressive, or the market has not priced the plan; neither view is automatically right','The offer is unfair, because an intrinsic DCF value always outranks a trading price plus any premium','The DCF must be wrong, because an efficient market has already priced in the management plan','The premium is irrelevant to fairness; only the multiple paid relative to precedent deals matters'],explain:'Fairness opinions weigh every method. A DCF built on management\'s plan is often the most optimistic bar.'}
  ];
  const DCF_CONCEPTS=[
    {q:'A higher WACC means…',options:['Lower present values and a lower EV','A higher terminal value','No change to EV but a lower equity value','A higher implied exit multiple'],explain:'Every cash flow and the terminal value are divided by a bigger number.'},
    {q:'Terminal value typically represents…',options:['Most of the EV, often 60–80%','Under 10% of EV','Roughly the same as the projection-period cash flows','The final projected year\'s cash flow'],explain:'Which is why the exit multiple and growth rate matter more than year-3 revenue.'},
    {q:'Unlevered free cash flow is discounted at…',options:['WACC, giving enterprise value','The cost of equity, giving enterprise value','WACC, giving equity value','The after-tax cost of debt'],explain:'Cash to all investors, discounted at the blended rate all investors require.'},
    {q:'Levered free cash flow is discounted at…',options:['The cost of equity, giving equity value directly','WACC, giving equity value directly','The cost of equity, giving enterprise value','The pre-tax cost of debt'],explain:'Cash to shareholders after debt service, discounted at what shareholders require.'},
    {q:'A sensible terminal growth rate is…',options:['Below WACC and near long-run inflation or GDP, roughly 2–3%','Equal to the company\'s revenue growth in the final projection year','Equal to the risk-free rate','Zero, to be conservative'],explain:'A company cannot outgrow the economy forever. If g ≥ WACC the formula breaks.'},
    {q:'Why multiply the cost of debt by (1 − t) in WACC?',options:['Interest is tax-deductible, so the effective cost of debt is lower','Debt holders are paid after taxes','Equity returns are taxed at the investor level','To convert a nominal rate to a real rate'],explain:'Each dollar of interest saves t dollars of tax.'},
    {q:'The mid-year convention…',options:['Assumes cash arrives midway through each year, raising present values slightly','Discounts cash flows over half the projection period','Applies only to the terminal value','Lowers present values to be conservative'],explain:'Discount exponents become 0.5, 1.5, 2.5… because cash arrives throughout the year.'},
    {q:'Which moves value more: a 1-point change in WACC or a 1-point change in year-1 revenue growth?',options:['WACC, since it affects every year and the terminal value','Revenue growth, since it compounds through all years','They are equal for a five-year model','Neither; only terminal growth matters'],explain:'Growth in one year changes one cash flow; WACC rescales all of them.'},
    {q:'Beta measures…',options:['A stock\'s sensitivity to market moves (systematic risk)','A stock\'s total volatility','The company\'s credit risk','The correlation between a stock and its sector'],explain:'Only non-diversifiable risk is priced. Beta 1.3: about 1.3% move for every 1% market move.'},
    {q:'Why unlever and relever beta?',options:['To strip out peers\' capital structures and apply the target\'s leverage','To remove industry risk and isolate market risk','To convert equity beta into asset beta for the cost of debt','To adjust for differences in tax rates only'],explain:'Leverage amplifies equity risk. Compare business risk first, then add back the target\'s own debt.'},
    {q:'The sanity check between the two terminal value methods:',options:['Compute the growth implied by the exit multiple and the multiple implied by Gordon growth','Average the two terminal values and use the result as the base case for the valuation','Use the Gordon growth value whenever it is lower, since conservatism protects the client','Compare both terminal values with the current market capitalization of the company'],explain:'If a 10x exit implies 6% perpetual growth, the exit multiple is too high.'},
    {q:'In UFCF, which items are subtracted?',options:['Capital expenditures and increases in net working capital','Interest expense and principal repayments','Depreciation and amortization','Dividends and share repurchases'],explain:'Real cash spent on assets and working capital. D&A is added back; interest is excluded (unlevered).'},
    {q:'The equity risk premium is…',options:['The expected market return minus the risk-free rate','The risk-free rate minus inflation','The cost of equity minus the cost of debt','The company\'s dividend yield plus growth'],explain:'The extra return investors demand for stocks over Treasuries, typically 5–6%.'},
    {q:'Adding moderate debt usually makes WACC…',options:['Fall, until distress risk pushes both costs of capital up','Rise, because debt adds risk to equity','Stay the same, by Modigliani–Miller','Fall without limit, since debt is always cheaper'],explain:'The curve is U-shaped: cheap, tax-advantaged debt first, then rising costs as leverage climbs.'},
    {q:'A DCF gives EV. To reach the share price you…',options:['Subtract net debt, preferred and NCI, then divide by diluted shares','Divide EV by diluted shares','Add net debt, then divide by basic shares','Subtract net debt, then divide by basic shares'],explain:'EV → equity value → per share. Same bridge as always, with diluted shares.'},
    {q:'For a high-growth company, which input matters most?',options:['The terminal assumptions, since almost all value sits beyond the projection','Year-1 working capital, since early cash needs dominate for a growing company','The tax rate, since fast-growing companies move into higher brackets quickly','The depreciation schedule, since heavy reinvestment drives D&A higher each year'],explain:'Near-term cash flows are small or negative; the terminal value is nearly everything.'},
    {q:'A company has $200 of net operating losses. In a DCF you…',options:['Add the present value of the tax savings to equity value, or model lower cash taxes in the projection','Ignore them, since they are non-cash accounting balances with no effect on unlevered free cash flow','Add the full $200 to enterprise value, since the losses will be recovered from future profits','Subtract them from net debt, since they are a tax asset that offsets the company\'s obligations'],explain:'NOLs are a tax asset. Either reduce projected cash taxes until they are used up, or value them separately.'}
  ];
  const MA_CONCEPTS=[
    {q:'All-stock deal, acquirer at 20x P/E, target bought at 15x. The deal is…',options:['Accretive','Dilutive','Breakeven','Dilutive unless synergies cover the premium'],explain:'Buyer P/E above the target\'s at the offer means the buyer issues fewer shares per dollar of earnings acquired.'},
    {q:'Typical ranking of acquisition currencies by after-tax cost, cheapest first (normal rates):',options:['Cash, then debt, then stock','Stock, then debt, then cash','Debt, then cash, then stock','Cash, then stock, then debt'],explain:'Cost of stock is the buyer\'s earnings yield (1 ÷ P/E). With a very high buyer P/E, stock can become the cheapest.'},
    {q:'Bankers put more weight on which synergies?',options:['Cost synergies, which management controls','Revenue synergies, which are larger','Tax synergies, which are certain','Financing synergies from a lower WACC'],explain:'Cutting duplicate costs usually happens; cross-selling promises often do not.'},
    {q:'Goodwill equals…',options:['Purchase price minus the fair value of net identifiable assets','Purchase price minus the book value of equity','Premium paid times shares acquired','Purchase price minus tangible assets'],explain:'Write assets up to fair value first (creating a DTL); whatever is left is goodwill.'},
    {q:'A deal is EPS-accretive but the buyer overpaid. Is it a good deal?',options:['Not necessarily: cheap financing can make an overpriced deal accretive','Yes: accretion means shareholders are better off','No: accretive deals destroy value by definition','Yes, as long as the deal is financed with stock'],explain:'Borrowing at 5% to buy anything with a 7% earnings yield is accretive. Value depends on price versus intrinsic value plus synergies.'},
    {q:'Why does an acquirer pay a premium?',options:['Target holders will not tender at market, and the buyer expects control value and synergies','Regulators require a minimum premium so that minority shareholders are fairly compensated','Premiums are tax-deductible for the acquirer, which lowers the effective price it pays','A premium is required to make the deal accretive by lifting the target\'s earnings yield'],explain:'The premium is the buyer\'s estimate of synergies and control value shared with the target\'s holders.'},

    {q:'A merger of equals typically means…',options:['Stock-for-stock with little or no premium and shared governance','An all-cash deal between two similar-sized companies','A hostile takeover of a peer','Two companies combining with equal amounts of debt'],explain:'Neither side is clearly the buyer; ownership follows relative contribution.'},
    {q:'Revenue synergies include…',options:['Cross-selling, pricing power and new geographies','Headcount reductions and combined back offices','Closing duplicate plants and distribution centers','Procurement savings and lower input costs'],explain:'Cost synergies remove duplication; revenue synergies are growth from the combination.'},
    {q:'In an all-cash deal (ignoring interest), which does NOT change?',options:['The buyer\'s share count','Pro forma net income','Goodwill','The cash balance'],explain:'No new shares, so the only EPS effect is the target\'s earnings minus foregone interest.'},
    {q:'Contribution analysis compares…',options:['Each company\'s share of combined revenue, EBITDA and net income with the ownership split','The synergies expected from the deal with the premium paid to the target\'s shareholders','The target\'s P/E with the buyer\'s P/E to decide whether the exchange ratio is accretive','Pre-deal and post-deal leverage to confirm the combined company can service its debt'],explain:'Used in stock deals to check whether the exchange ratio is fair relative to what each side brings.'},
    {q:'The exchange ratio in a stock deal is…',options:['Buyer shares issued per target share: offer price ÷ buyer share price','Target shares outstanding ÷ buyer shares outstanding before the deal','Buyer share price ÷ target share price, before the premium is applied','The premium paid ÷ the buyer\'s P/E, expressed as shares per target share'],explain:'Offer $30 per target share, buyer at $60: exchange ratio 0.5x.'},
    {q:'The acquirer\'s P/E is 10x and the target\'s is 15x. To make an all-stock deal accretive you would need…',options:['After-tax synergies large enough to offset the earnings yield gap','A higher premium, to signal confidence and win shareholder approval','A merger-of-equals structure, so neither side\'s P/E is the benchmark','More shares issued to the target, so its holders own a larger stake'],explain:'Paying 15x with 10x paper is dilutive by construction; only synergies (or cheaper currency) fix it.'}
  ];
  const LBO_CONCEPTS=[
    {q:'Which lowers IRR, all else equal?',options:['Paying a higher entry multiple','Repaying debt faster','A higher exit multiple','Faster EBITDA growth'],explain:'Price is the lever the sponsor controls most directly; everything else helps.'},
    {q:'Why does leverage boost equity returns?',options:['Less equity buys the same company, and the company\'s cash flow repays the debt','Interest expense wipes out taxable income, so the company pays no tax for years','Lenders share in the downside, which limits the sponsor\'s loss to its equity check','Debt raises EBITDA through the interest tax shield, lifting the exit value'],explain:'Buy a $100 house with $20 down; sell for $120 after paying off some mortgage: your $20 became far more than 1.2x.'},
    {q:'An ideal LBO candidate has…',options:['Stable cash flows, low capex, strong management, a reasonable price and hard assets','High growth, heavy capex and a large existing debt load that the sponsor can refinance','A low P/E, a high dividend payout and a share price well below book value','Volatile cash flows that the discipline of debt service will smooth out over time'],explain:'Debt must be serviced every year, so predictability beats growth. Collateral helps lenders say yes.'},
    {q:'The three sources of LBO returns:',options:['Debt paydown, EBITDA growth and multiple expansion','Interest tax shields, fees and dividends','Revenue growth, synergies and cost cuts','Leverage, hold period and purchase premium'],explain:'Deleveraging shifts value from lenders to equity; growth and a higher exit multiple raise the exit EV.'},
    {q:'A dividend recapitalization…',options:['Raises new debt to pay the sponsor a dividend, pulling cash forward and lifting IRR','Repays debt early with a special dividend from the target','Converts sponsor equity into preferred stock','Lowers IRR but raises MOIC'],explain:'Roughly the same MOIC, higher IRR because cash comes back sooner. Lenders must be willing.'},
    {q:'Same MOIC with a longer hold means…',options:['A lower IRR','A higher IRR','The same IRR','A higher MOIC'],explain:'IRR is annualized: 2x in 3 years ≈ 26%; 2x in 5 years ≈ 15%.'},
    {q:'Typical sponsor target return:',options:['Roughly 20–25%+ IRR, with 15–20% as a floor','5–10% IRR, matching bond yields','50%+ IRR on every deal','A 1.5x MOIC regardless of time'],explain:'Below that, limited partners would rather own public equities with less risk.'},
    {q:'An LBO analysis as a valuation method tells you…',options:['A floor: the most a financial sponsor could pay and still hit its target return','A ceiling: the most any buyer, strategic or financial, would rationally pay','The intrinsic value of the business, independent of the buyer\'s financing','The liquidation value of the assets if the company were wound down today'],explain:'No synergies and a hard return hurdle mean financial buyers usually lose to strategics on price.'},
    {q:'What limits how much debt an LBO can carry?',options:['Cash flow to cover interest and amortization, covenants and market leverage norms','The target\'s share count and float, since lenders size debt per share','The sponsor\'s fund size, since debt cannot exceed the equity committed','The target\'s P/E ratio, since lenders cap leverage at a multiple of earnings'],explain:'Lenders size debt off EBITDA and coverage ratios; the sponsor fills the rest with equity.'},
    {q:'Senior debt versus subordinated notes:',options:['Senior is cheaper, secured and repaid first; subordinated is costlier and paid after','Subordinated is cheaper because it is unsecured and therefore carries fewer fees','They rank equally in a default, but senior debt has a longer maturity and amortizes','Senior debt pays PIK interest while subordinated notes pay cash interest quarterly'],explain:'Priority in a default sets the rate. Mezzanine and PIK notes sit lower still.'},
    {q:'The interest tax shield in an LBO…',options:['Lowers taxes and raises cash available for debt paydown','Lowers EBITDA','Only applies if the sponsor is a corporation','Is offset by the loss of depreciation'],explain:'Part of the interest cost is subsidized by the tax code: one reason PE likes debt.'},
    {q:'How could a sponsor raise the IRR of a company it already owns?',options:['Grow EBITDA, pay down debt faster, do a dividend recap or exit earlier at a good multiple','Hold the company longer so that the exit multiple has more time to expand','Inject additional equity to reduce interest costs and improve net income','Refinance the debt into higher-cost tranches to signal confidence to lenders'],explain:'Operational improvement plus financial engineering.'},
    {q:'Why is a high-growth tech startup a poor LBO candidate?',options:['Unpredictable cash flow and heavy reinvestment cannot support debt service','It would be too cheap to generate a meaningful return on the equity invested','Its multiple is too low to expand, so the sponsor could not sell at a gain','Lenders prefer companies with no revenue, so the sponsor would face competition'],explain:'Lenders need steady cash flow; growth companies need to reinvest every dollar.'},
    {q:'Management rollover means…',options:['Managers reinvest part of their proceeds as equity alongside the sponsor','Managers are replaced after the deal closes with the sponsor\'s own team','Management receives debt instead of equity to protect its downside','The sponsor rolls the existing debt into the new capital structure'],explain:'Skin in the game. Sponsors usually also grant an option pool.'},
    {q:'Two deals: 2.0x in 3 years versus 3.0x in 7 years. Which has the higher IRR?',options:['The 2.0x in 3 years (about 26% vs 17%)','The 3.0x in 7 years (about 25% vs 15%)','They are equal','Cannot tell without the entry multiple'],explain:'2^(1/3) − 1 ≈ 26%; 3^(1/7) − 1 ≈ 17%. MOIC ignores time; IRR does not.'},

  ];

// Reference notes, one section per module. Condensed from the technical cheat sheet, reorganized around what the drills test.
const LEARN=[
{m:'is',html:`
<p>Covers a <b>period</b>. Revenue in, expenses out, profit at the bottom. Operating lines first, financing (interest) next, taxes last.</p>
<table class="ref"><tr><td>Revenue</td><td>Recognized when earned, not when paid</td></tr><tr><td>− COGS</td><td>Direct cost of what was sold</td></tr><tr><td class="t">= Gross profit</td><td>Gross margin = GP ÷ revenue</td></tr><tr><td>− Operating expenses</td><td>SG&A, R&D. D&A is usually buried here or in COGS</td></tr><tr><td class="t">= Operating income (EBIT)</td><td>Profit from operations, before financing</td></tr><tr><td>− Interest expense, + interest income</td><td>Non-operating: depends on capital structure</td></tr><tr><td class="t">= Pretax income</td><td></td></tr><tr><td>− Taxes</td><td>Pretax income × tax rate</td></tr><tr><td class="t">= Net income</td><td>Flows to the CFS and to retained earnings</td></tr><tr><td>÷ Diluted shares</td><td>= EPS</td></tr></table>
<p><code>EBITDA = EBIT + D&A</code>. Take D&A from the cash flow statement. Not a GAAP line, but the number lenders and multiples use.</p>
<ul><li>Strip non-recurring items (restructuring, gains on sale, impairments) to get "adjusted" figures.</li><li>Depreciation is an expense, not a cash outflow. The cash left when the asset was bought.</li><li>Interest sits below EBIT, so EV-based metrics (revenue, EBITDA, EBIT) ignore how the company is financed.</li><li>Taxes are computed after interest: that is the tax shield on debt.</li></ul>`},
{m:'bs',html:`
<p>A <b>snapshot</b> at a date. <code>Assets = Liabilities + Shareholders' equity</code>. Assets listed by liquidity, liabilities by maturity.</p>
<table class="ref"><tr><td class="t">Current assets</td><td>Cash & equivalents · short-term investments · accounts receivable · inventory · prepaid expenses</td></tr><tr><td class="t">Long-term assets</td><td>PP&E (net of accumulated depreciation) · goodwill & intangibles · long-term investments</td></tr><tr><td class="t">Current liabilities</td><td>Accounts payable · accrued expenses · deferred revenue · short-term debt / current portion of LT debt</td></tr><tr><td class="t">Long-term liabilities</td><td>Long-term debt · deferred tax liabilities · lease liabilities</td></tr><tr><td class="t">Equity</td><td>Common stock & APIC · retained earnings · treasury stock (negative) · noncontrolling interest</td></tr></table>
<ul><li><code>Retained earnings = cumulative net income − cumulative dividends</code>. Equity is the residual and can be negative.</li><li><code>Operating working capital = (current assets ex cash) − (current liabilities ex debt)</code>. Growth in it consumes cash.</li><li><code>Net debt = debt − cash</code>.</li><li>Goodwill appears only through acquisitions: price paid above fair value of net identifiable assets.</li></ul>`},
{m:'cfs',html:`
<p>Reconciles net income to the actual change in cash over a period. Three sections, then the total lands on the balance sheet.</p>
<table class="ref"><tr><td class="t">Operating</td><td>Net income<br>+ non-cash expenses (D&A, SBC, impairments, write-downs)<br>± changes in working capital</td></tr><tr><td class="t">Investing</td><td>− CapEx · − acquisitions · + asset sales · ± investments</td></tr><tr><td class="t">Financing</td><td>+ debt raised · − debt repaid · + equity issued · − buybacks · − dividends</td></tr><tr><td class="t">= Net change in cash</td><td>Beginning cash + change = ending cash on the BS</td></tr></table>
<p><b>Sign rule:</b> an operating asset going up uses cash (subtract); an operating liability going up frees cash (add). Interest paid is operating under US GAAP; principal repaid is financing.</p>
<p><code>FCF = CFO − CapEx</code><br><code>UFCF = EBIT × (1 − t) + D&A − CapEx − ΔNWC</code> (to all investors; discount at WACC → EV)<br><code>LFCF = NI + D&A − CapEx − ΔNWC − mandatory debt repayment</code> (to equity; discount at cost of equity → equity value)</p>`},
{m:'links',html:`
<ol class="links"><li>Net income → top of the CFS and into retained earnings on the BS.</li><li>Non-cash expenses (D&A, SBC, write-downs) → added back in CFO.</li><li>Changes in operating working capital → adjusted in CFO.</li><li>CapEx (CFS) → PP&E on the BS; depreciation (IS) then reduces PP&E.</li><li>Equity raised or bought back (CFF) → shareholders' equity.</li><li>Debt raised or repaid (CFF) → debt on the BS.</li><li>Net change in cash (CFS) → cash on the BS.</li></ol>
<p><b>Method for any "walk me through" question.</b> IS first: pretax change, then after-tax via (1 − t). CFS second: start from the net income change, add back anything non-cash, adjust working capital, then investing and financing. BS last: cash from the CFS, the other line that moved, then retained earnings by the net income change. Confirm <code>Δassets = Δliabilities + Δequity</code>.</p>
<p><b>The classic.</b> Depreciation up $10, 40% tax. IS: pretax −10, net income −6. CFS: NI −6, add back +10, cash +4. BS: PP&E −10, cash +4 → assets −6; retained earnings −6. Balanced.</p>
<table class="ref"><tr><td>Raise debt</td><td>Cash +X, debt +X. No IS effect yet</td></tr><tr><td>Buy back stock</td><td>Cash −X, equity −X (treasury stock)</td></tr><tr><td>Pay dividend</td><td>Cash −X, retained earnings −X</td></tr><tr><td>CapEx</td><td>Cash −X, PP&E +X</td></tr><tr><td>AR or inventory up</td><td>Cash −X (CFO adjustment)</td></tr><tr><td>AP or deferred revenue up</td><td>Cash +X</td></tr><tr><td>Impairment, non-deductible</td><td>NI −X, cash 0, asset −X, RE −X</td></tr><tr><td>SBC</td><td>NI −X(1−t), cash +Xt, APIC +X, RE −X(1−t)</td></tr><tr><td>Sell asset for P, book value B</td><td>Gain G = P − B; CFO −G; CFI +P; cash +P − G·t</td></tr></table>`},
{m:'ev',html:`
<p><code>Equity value = share price × diluted shares</code>. What the shareholders own.</p>
<p><code>EV = equity value − cash + debt + preferred + noncontrolling interest</code> (+ debt-like items: finance leases, unfunded pensions). What the whole operating business is worth to everyone who funds it.</p>
<p><b>Diluted shares</b> = basic + in-the-money options via the treasury stock method (<code>options − options × strike ÷ price</code>) + RSUs + convertibles if in the money (<code>face ÷ conversion price</code>, then exclude that debt from the bridge).</p>
<table class="ref"><tr><td class="t">Use EV with</td><td>Revenue, EBITDA, EBIT, EBITDAR, unlevered FCF, NOPAT: anything before interest</td></tr><tr><td class="t">Use equity value with</td><td>Net income, EPS, levered FCF, book value, dividends, FFO: anything after interest</td></tr></table>
<p><b>What moves what.</b> Issuing stock, raising debt, paying dividends and buybacks shuffle cash, debt and equity: EV is unchanged. Turning cash into operating assets (capex, an acquisition) raises EV. Generating cash lowers EV, holding the price constant. Equity value moves only when shares or price move.</p>`},
{m:'mult',html:`
<table class="ref"><tr><th>Multiple</th><th>Use when</th><th>Watch out</th></tr>
<tr><td>EV / Revenue</td><td>Unprofitable or early-stage; very different margins</td><td>Ignores profitability</td></tr>
<tr><td>EV / EBITDA</td><td>Default for most industries; capital-structure and tax neutral; cash-flow proxy</td><td>Flatters capex-heavy businesses</td></tr>
<tr><td>EV / EBIT</td><td>When D&A approximates reinvestment needs; capital-intensive comparisons</td><td>Depends on depreciation policy</td></tr>
<tr><td>P / E</td><td>Mature companies with similar leverage and taxes; banks</td><td>Distorted by leverage, taxes, one-offs</td></tr>
<tr><td>P / Book</td><td>Banks, insurers (balance sheet is the business)</td><td>Meaningless for asset-light companies</td></tr>
<tr><td>EV / EBITDAR</td><td>Retailers, airlines, hotels: lease vs own</td><td>Rent must be added back consistently</td></tr>
<tr><td>P / FFO</td><td>REITs (adds back real-estate depreciation)</td><td>Equity multiple: after interest</td></tr>
<tr><td>EV / EBITDAX</td><td>Oil & gas E&P (exploration accounting differs)</td><td>Industry-specific</td></tr></table>
<ul><li>A higher multiple is justified by higher growth, higher margins or returns, lower risk, stronger position.</li><li>Use the <b>median</b> of the comp set. Show LTM (trailing) and NTM (forward).</li><li>Strip non-recurring items and match the numerator to the metric: EV for pre-interest, equity for post-interest.</li><li>P/E of 20x = earnings yield of 5%. EV/EBITDA 8x with net debt of 2x EBITDA = equity worth 6x EBITDA.</li></ul>`},
{m:'val',html:`
<table class="ref"><tr><td class="t">Comparable companies</td><td>Pick peers (industry, size, growth, margins, geography) → compute their equity value, EV and multiples → range (25th, median, 75th) → place the target → apply to the target's metric → bridge to equity and per share. Output: a <b>trading</b> (minority) value.</td></tr>
<tr><td class="t">Precedent transactions</td><td>Recent deals for similar targets → transaction EV and multiples paid, premium to unaffected price → range → apply. Output: a <b>control</b> value (premiums typically 20–40%). Reflects past conditions and deal-specific synergies.</td></tr>
<tr><td class="t">DCF</td><td>Project UFCF, discount at WACC, add terminal value, bridge to equity. <b>Intrinsic</b>; sensitive to assumptions.</td></tr>
<tr><td class="t">LBO analysis</td><td>Solve for the price a sponsor can pay and still earn ~20%+ IRR. A <b>floor</b> for financial buyers.</td></tr></table>
<p><b>Typical ordering</b> (low → high): LBO ≈ public comps &lt; DCF ≈ precedents. Not a law: a DCF with aggressive assumptions can top everything. Present all of them on a <b>football field</b> alongside the 52-week range and triangulate.</p>
<p><b>When each is weak.</b> Comps: no true twins, no control premium, irrational markets. Precedents: stale, scarce, synergy-specific. DCF: garbage in, garbage out; terminal value dominates. Use sum-of-the-parts for conglomerates; add an illiquidity discount for private companies.</p>`},
{m:'dcf',html:`
<ol class="links"><li>Project unlevered free cash flow for 5–10 years: <code>UFCF = EBIT(1 − t) + D&A − CapEx − ΔNWC</code></li><li>Discount rate: <code>WACC = E/V × Ke + D/V × Kd × (1 − t) (+ P/V × Kp)</code>, market-value weights</li><li><code>Ke = Rf + β × ERP</code> (CAPM). Rf = 10-year Treasury. ERP ≈ 5–6%.</li><li>Beta from peers: <code>βU = βL ÷ [1 + (1 − t) × D/E]</code>, take the median, <code>βL = βU × [1 + (1 − t) × D/E]</code> at the target's structure.</li><li>Terminal value: <code>exit multiple × final-year EBITDA</code> or Gordon growth <code>FCF × (1 + g) ÷ (WACC − g)</code>, g ≈ 2–3%.</li><li>Discount: <code>PV = CF ÷ (1 + WACC)^t</code> (mid-year convention: t − 0.5). <code>EV = Σ PV(FCF) + PV(TV)</code>.</li><li>Bridge: <code>equity = EV − net debt − preferred − NCI</code>; <code>price = equity ÷ diluted shares</code>.</li></ol>
<p><b>Sanity checks.</b> Terminal value share of EV (usually 60–80%). Implied growth from the exit-multiple TV; implied multiple from the Gordon TV. A sensitivity table on WACC × exit multiple (or g).</p>
<p><b>Intuition.</b> Higher WACC or lower g → lower value. WACC moves value more than any single year's growth. Debt lowers WACC up to a point, then distress risk raises everything. Levered FCF at cost of equity gives equity value directly.</p>`},
{m:'ma',html:`
<p><b>Accretion / dilution</b> compares pro forma EPS with the buyer's standalone EPS.</p>
<ol class="links"><li>Purchase price = offer per share (premium to market) × target diluted shares.</li><li>Financing mix: cash, new debt, new buyer shares (<code>stock $ ÷ buyer price</code>).</li><li><code>Pro forma NI = buyer NI + target NI + synergies × (1 − t) − cash used × rate × (1 − t) − new debt × rate × (1 − t)</code></li><li><code>Pro forma shares = buyer shares + new shares</code>. Pro forma EPS = NI ÷ shares. Higher than standalone: accretive.</li></ol>
<table class="ref"><tr><th>Currency</th><th>After-tax cost</th></tr><tr><td>Cash</td><td>Foregone interest rate × (1 − t)</td></tr><tr><td>Debt</td><td>Interest rate × (1 − t)</td></tr><tr><td>Stock</td><td>Buyer earnings yield = 1 ÷ buyer P/E</td></tr></table>
<p>Compare the blended cost with the target's earnings yield at the offer price (<code>target NI ÷ purchase price</code>). Yield bought &gt; cost paid ⇒ accretive. All-stock shortcut: buyer P/E &gt; target P/E (at the offer) ⇒ accretive. Breakeven all-stock price = target NI × buyer P/E.</p>
<ul><li>Cost synergies (headcount, facilities, procurement) are credible; revenue synergies less so.</li><li>Purchase accounting: write assets up to fair value, <code>DTL = write-up × t</code>, <code>goodwill = price − fair value of net identifiable assets</code>. Target equity is eliminated. Goodwill is tested for impairment, not amortized.</li><li>Accretion is not value creation: cheap debt makes almost anything accretive. Price vs intrinsic value plus synergies is what matters.</li><li>Why deals happen: growth, synergies, new markets or capabilities, undervalued targets, consolidation, defense.</li></ul>`},
{m:'lbo',html:`
<p>A sponsor buys a company with a large share of debt (often 4–6x EBITDA; equity 40–60% of the price today), improves it, repays debt from cash flow, and sells in 3–7 years.</p>
<p><b>Returns come from</b> debt paydown (value shifts from lenders to equity), EBITDA growth, and multiple expansion. <b>Three ways to raise IRR:</b> pay less or exit higher; use more debt (if cash flow supports it); make the company perform (growth, margins, faster paydown). A dividend recap or earlier exit also lifts IRR.</p>
<p><b>Good candidates:</b> stable, predictable cash flow; undervalued; strong management; cost-cutting room; low capex and working-capital needs; hard assets for collateral; a clear exit.</p>
<ol class="links"><li>Purchase price: entry multiple × EBITDA.</li><li>Sources & uses: uses = equity purchase + debt refinanced + fees (+ cash to BS); sources = debt tranches + sponsor equity (the plug).</li><li>Project the statements and free cash flow: <code>NI + D&A − CapEx − ΔNWC</code> after interest.</li><li>Sweep free cash flow to repay debt.</li><li>Exit: exit multiple × final-year EBITDA − remaining debt = exit equity.</li><li><code>MOIC = exit equity ÷ entry equity</code>; <code>IRR = MOIC^(1/years) − 1</code>.</li></ol>
<table class="ref"><tr><th>MOIC</th><th>3 years</th><th>5 years</th><th>7 years</th></tr><tr><td>2.0x</td><td>26%</td><td>15%</td><td>10%</td></tr><tr><td>2.5x</td><td>36%</td><td>20%</td><td>14%</td></tr><tr><td>3.0x</td><td>44%</td><td>25%</td><td>17%</td></tr></table>
<p>Debt tranches, safest to riskiest: revolver, term loans (senior secured, floating), senior notes, subordinated / mezzanine (sometimes PIK), then equity. Lenders size debt off EBITDA and coverage; covenants police it. Exits: strategic sale, secondary buyout, IPO, dividend recap. Target IRR ~20–25%; an LBO analysis therefore sets a valuation floor.</p>`},
{m:'case',html:`
<p>The capstone runs one randomly generated company through everything: income statement → cash flows → diluted shares and the EV bridge → trading multiples → cost of equity, WACC and a one-line DCF → a sponsor's entry price, leverage, exit and IRR.</p>
<p>The point is the thread: the same EBITDA sets the market multiple, feeds the DCF through UFCF, and sizes the LBO debt. Change one number at the top and everything below moves. Do it until you can narrate the whole chain without looking.</p>`}
];

// Tap-to-explain glossary. t: display term; alt: other spellings matched in text; d: plain explanation; f: formula; m: module for "read the notes".
const GLOSSARY=[
{t:'Revenue',alt:['Revenue','Sales'],d:'Money earned from selling products or services during the period, recognized when earned rather than when cash is collected.',m:'is'},
{t:'COGS',alt:['COGS','Cost of goods sold'],d:'Cost of goods sold: the direct costs of what was sold (materials, direct labor, often depreciation of production assets).',f:'Gross profit = Revenue − COGS',m:'is'},
{t:'Gross profit',alt:['Gross profit','gross margin'],d:'Revenue minus COGS. Gross margin is gross profit as a percent of revenue: how much each dollar of sales leaves to cover overhead.',f:'Gross margin = Gross profit ÷ Revenue',m:'is'},
{t:'Operating expenses',alt:['Operating expenses','OpEx','opex','SG&A','SG&amp;A','R&D'],d:'Costs of running the business that are not tied directly to each unit sold: selling, general and administrative, research and development. D&A is usually hidden inside them or inside COGS.',m:'is'},
{t:'D&A',alt:['D&A','D&amp;A','Depreciation','depreciation','amortization','Amortization'],d:'Depreciation and amortization: the non-cash charge that spreads the cost of long-lived assets (PP&E, acquired intangibles) over their useful lives. The cash left when the asset was bought.',f:'EBITDA = EBIT + D&A',m:'cfs'},
{t:'EBITDA',alt:['EBITDA'],d:'Earnings before interest, taxes, depreciation and amortization. A proxy for operating cash flow that ignores capital structure, taxes and asset age. Not a GAAP line.',f:'EBITDA = Operating income + D&A',m:'is'},
{t:'EBIT',alt:['EBIT','Operating income','operating income'],d:'Earnings before interest and taxes, also called operating income: profit from operations before financing costs.',f:'EBIT = Gross profit − operating expenses (incl. D&A)',m:'is'},
{t:'EBITDAR',alt:['EBITDAR'],d:'EBITDA plus rent or lease expense. Used for retailers, airlines and hotels so that companies that lease and companies that own assets can be compared.',m:'mult'},
{t:'EBITDAX',alt:['EBITDAX'],d:'EBITDA plus exploration expense. Used for oil and gas producers, whose exploration accounting choices otherwise distort EBITDA.',m:'mult'},
{t:'Interest expense',alt:['Interest expense','interest expense','Interest income','interest income','Net interest'],d:'The cost of debt (expense) or the return on cash (income). Non-operating: it depends on how the company is financed, which is why EV-based metrics stop above it.',m:'is'},
{t:'Pretax income',alt:['Pretax income','pretax income','EBT','Pretax'],d:'Earnings before taxes: operating income minus net interest. Taxes are computed on this number, so interest reduces taxes.',m:'is'},
{t:'Taxes',alt:['Taxes','tax rate','Tax rate'],d:'Income taxes are computed on pretax income (after interest). The statutory or effective rate drives the (1 − t) that appears in UFCF, WACC and every after-tax cost.',m:'is'},
{t:'Net income',alt:['Net income','net income','NI'],d:'The bottom line: what is left for shareholders after every expense, interest and taxes. It starts the cash flow statement and accumulates in retained earnings.',m:'is'},
{t:'EPS',alt:['EPS','Earnings per share'],d:'Earnings per share: net income divided by diluted shares outstanding. Pro forma EPS vs standalone EPS is the accretion / dilution test.',f:'EPS = Net income ÷ diluted shares',m:'is'},
{t:'Margin',alt:['margin','Margins','margins'],d:'A profit line as a percent of revenue (gross, EBITDA, operating, net). Margins let you compare companies of different sizes; higher margins usually earn higher multiples.',m:'is'},
{t:'Non-recurring items',alt:['Non-recurring','one-time','One-time','non-recurring'],d:'Gains, charges or write-downs that are not part of normal operations (restructuring, asset sales, impairments). Stripped out to get "adjusted" EBITDA and clean multiples.',m:'is'},
{t:'Balance sheet',alt:['Balance sheet','balance sheet','BS'],d:'A snapshot at a date of what the company owns (assets) and how it was funded (liabilities and equity). Assets = Liabilities + Equity, always.',m:'bs'},
{t:'Current assets',alt:['Current assets','current assets','Current asset'],d:'Assets expected to turn into cash within a year: cash, short-term investments, receivables, inventory, prepaid expenses.',m:'bs'},
{t:'Cash',alt:['Cash & equivalents','Cash and equivalents'],d:'Cash plus instruments that are as good as cash. A non-operating asset: subtracted in the EV bridge because a buyer effectively gets it back.',m:'ev'},
{t:'Accounts receivable',alt:['Accounts receivable','accounts receivable','receivables','Receivables','AR'],d:'Sales made on credit that customers have not paid yet. An operating asset: when it rises, revenue was booked but cash has not arrived, so cash from operations is reduced.',m:'bs'},
{t:'Inventory',alt:['Inventory','inventory'],d:'Goods held for sale (raw materials, work in progress, finished goods). An operating asset: buying it uses cash before any sale is recorded; a write-down is a non-cash expense.',m:'bs'},
{t:'Prepaid expenses',alt:['Prepaid expenses','prepaid expenses','Prepaid'],d:'Cash paid ahead of the expense (insurance, rent). An asset that unwinds into expense over the coverage period.',m:'bs'},
{t:'PP&E',alt:['PP&E','PP&amp;E','Property, plant and equipment'],d:'Property, plant and equipment, shown net of accumulated depreciation. CapEx increases it; depreciation reduces it.',m:'bs'},
{t:'Goodwill',alt:['Goodwill','goodwill'],d:'The premium paid in an acquisition over the fair value of the target\'s net identifiable assets. Tested for impairment, never amortized. Internally built brands never appear here.',f:'Goodwill = Purchase price − fair value of net identifiable assets',m:'ma'},
{t:'Intangible assets',alt:['Intangible assets','intangibles','Intangibles'],d:'Non-physical assets with value, such as patents, customer lists and brands acquired in a deal. Amortized over their lives.',m:'bs'},
{t:'Current liabilities',alt:['Current liabilities','current liabilities','Current liability'],d:'Obligations due within a year: accounts payable, accrued expenses, deferred revenue, short-term debt.',m:'bs'},
{t:'Accounts payable',alt:['Accounts payable','accounts payable','payables','Payables','AP'],d:'Amounts owed to suppliers for goods and services already received. An operating liability: when it rises, the company is holding cash longer, so cash from operations improves.',m:'bs'},
{t:'Accrued expenses',alt:['Accrued expenses','accrued expenses','Accrued liabilities','accrued liabilities'],d:'Expenses incurred but not yet paid (wages, utilities, interest). Recognized on the income statement now; the cash goes out later.',m:'bs'},
{t:'Deferred revenue',alt:['Deferred revenue','deferred revenue','Unearned revenue'],d:'Cash collected before the product or service is delivered. A liability (an obligation to deliver) until the revenue is recognized.',m:'bs'},
{t:'Debt',alt:['Long-term debt','Short-term debt','long-term debt','short-term debt','Term loan','term loan'],d:'Borrowed money that must be repaid with interest. Principal lives on the balance sheet and in financing cash flows; only the interest hits the income statement.',m:'bs'},
{t:'Deferred tax liability',alt:['Deferred tax liability','deferred tax liability','DTL','DTLs','Deferred tax asset','DTA','NOL','NOLs','net operating loss'],d:'Timing differences between book and tax accounting. A DTL means more cash tax later (tax depreciation ran faster, or an asset was written up in a deal). A DTA means future tax savings (net operating losses, expenses booked now but deductible later).',m:'ma'},
{t:'Shareholders\' equity',alt:['Shareholders\' equity','shareholders\' equity','Total equity','Equity','equity'],d:'The owners\' residual claim: assets minus liabilities. Paid-in capital plus retained earnings minus treasury stock. Book equity can be negative; market equity value cannot.',m:'bs'},
{t:'Common stock & APIC',alt:['Common stock & APIC','Common stock &amp; APIC','APIC','Paid-in capital','Common stock'],d:'Capital contributed by shareholders when shares were issued (par value plus additional paid-in capital). Rises when stock or stock-based compensation is issued.',m:'bs'},
{t:'Retained earnings',alt:['Retained earnings','retained earnings','RE'],d:'Cumulative net income minus cumulative dividends. Where the income statement lands on the balance sheet.',f:'ΔRetained earnings = Net income − dividends',m:'bs'},
{t:'Treasury stock',alt:['Treasury stock','treasury stock'],d:'Shares the company has bought back, shown as a negative line within equity. Buybacks reduce cash and equity by the same amount.',m:'bs'},
{t:'Noncontrolling interest',alt:['Noncontrolling interest','noncontrolling interest','Minority interest','minority interest','NCI'],d:'The share of a consolidated subsidiary owned by outside investors. Shown in equity under US GAAP; added in the EV bridge because consolidated EBITDA includes 100% of the subsidiary.',m:'ev'},
{t:'Preferred stock',alt:['Preferred stock','preferred stock','Preferred','preferred'],d:'A claim that ranks ahead of common equity and pays a fixed dividend. Treated as debt-like in the EV bridge.',m:'ev'},
{t:'Working capital',alt:['Working capital','working capital','NWC','net working capital','Net working capital','ΔNWC'],d:'Operating working capital: non-cash current assets minus non-debt current liabilities (receivables, inventory, prepaids minus payables, accruals). Growth usually ties up more of it, which consumes cash.',f:'ΔNWC increase → subtract in FCF',m:'bs'},
{t:'Net debt',alt:['Net debt','net debt'],d:'Debt minus cash. The bridge from equity value to EV uses it because cash could repay debt tomorrow.',f:'Net debt = Debt − cash',m:'ev'},
{t:'Cash flow statement',alt:['Cash flow statement','cash flow statement','CFS'],d:'Reconciles net income to the actual change in cash: operating, investing and financing sections. The total equals the change in the balance-sheet cash line.',m:'cfs'},
{t:'Cash from operations',alt:['Cash from operations','cash from operations','CFO','Operating cash flow','operating cash flow'],d:'Net income, plus non-cash expenses (D&A, SBC, write-downs), plus or minus changes in operating working capital. The cash the business itself generated.',m:'cfs'},
{t:'Cash from investing',alt:['Cash from investing','cash from investing','CFI','Investing activities'],d:'Cash spent on or received from long-term assets: capital expenditures, acquisitions, asset sales, investments. Usually negative for a growing company.',m:'cfs'},
{t:'Cash from financing',alt:['Cash from financing','cash from financing','CFF','Financing activities'],d:'Cash raised from or returned to capital providers: debt raised or repaid, stock issued, buybacks, dividends.',m:'cfs'},
{t:'CapEx',alt:['CapEx','Capital expenditures','capital expenditures','capex','Capex'],d:'Cash spent on long-lived assets (PP&E). Capitalized on the balance sheet and depreciated over time, so it never hits the income statement directly.',m:'cfs'},
{t:'Free cash flow',alt:['Free cash flow','free cash flow','FCF'],d:'Cash the business generates after reinvesting in itself. Simplest definition: cash from operations minus capital expenditures.',f:'FCF = CFO − CapEx',m:'cfs'},
{t:'Unlevered free cash flow',alt:['Unlevered free cash flow','unlevered free cash flow','UFCF','Unlevered FCF'],d:'Cash flow available to all capital providers, before any interest or debt payments. Discounted at WACC, it gives enterprise value.',f:'UFCF = EBIT × (1 − t) + D&A − CapEx − ΔNWC',m:'dcf'},
{t:'Levered free cash flow',alt:['Levered free cash flow','levered free cash flow','LFCF','Levered FCF'],d:'Cash flow left for shareholders after interest and mandatory debt repayment. Discounted at the cost of equity, it gives equity value directly.',m:'cfs'},
{t:'NOPAT',alt:['NOPAT'],d:'Net operating profit after tax: EBIT × (1 − tax rate). The starting point for unlevered free cash flow: what the business would earn with no debt.',f:'NOPAT = EBIT × (1 − t)',m:'dcf'},
{t:'Stock-based compensation',alt:['Stock-based compensation','stock-based compensation','SBC','Stock-based comp'],d:'Pay in shares or options. An operating expense that reduces net income but is added back on the CFS as non-cash. It still dilutes shareholders.',m:'is'},
{t:'Impairment',alt:['Impairment','impairment','write-down','Write-down','writes down','written down'],d:'Reducing an asset\'s book value when it is worth less than carried. A non-cash expense: net income falls, it is added back on the CFS, and the asset and retained earnings fall.',m:'links'},
{t:'Equity value',alt:['Equity value','equity value','Market cap','market cap','Market capitalization'],d:'What the shareholders own: share price × diluted shares. Pair it with metrics after interest (net income, EPS, levered FCF).',f:'Equity value = Price × diluted shares',m:'ev'},
{t:'Enterprise value',alt:['Enterprise value','enterprise value','EV'],d:'The value of the operating business to everyone who funds it. Pair it with metrics before interest (revenue, EBITDA, EBIT, UFCF).',f:'EV = Equity value − cash + debt + preferred + NCI',m:'ev'},
{t:'Diluted shares',alt:['Diluted shares','diluted shares','diluted share count','Diluted share count'],d:'Basic shares plus the shares that options (treasury stock method), RSUs and in-the-money convertibles would add. Use them for equity value and EPS.',m:'ev'},
{t:'Treasury stock method',alt:['Treasury stock method','treasury stock method','TSM'],d:'For in-the-money options: assume exercise, then assume the cash proceeds repurchase shares at the current price. Net new shares = options − options × strike ÷ price.',f:'Net new shares = Options × (1 − strike ÷ price)',m:'ev'},
{t:'Options',alt:['Options','options','Stock options','strike price','Strike price','strike'],d:'Rights to buy shares at a fixed strike price. In the money when the strike is below the share price; only those dilute, via the treasury stock method.',m:'ev'},
{t:'RSUs',alt:['RSUs','RSU','restricted stock'],d:'Restricted stock units: shares granted that vest over time. No strike, so they always dilute in full.',m:'ev'},
{t:'Convertible',alt:['Convertible','convertible','convertible bond','convertible debt','Convertible bond','conversion price'],d:'Debt that can convert into shares at a conversion price. If in the money, count the conversion shares and exclude the debt (if-converted method); otherwise treat it as debt.',m:'ev'},
{t:'Multiple',alt:['Multiple','multiple','multiples','Multiples','trading multiples'],d:'Value divided by a metric (EV/EBITDA, P/E). A compressed DCF: higher growth, higher margins or lower risk justify a higher multiple. Match the numerator to the metric.',m:'mult'},
{t:'EV/EBITDA',alt:['EV/EBITDA','EV / EBITDA'],d:'The workhorse multiple: enterprise value over EBITDA. Capital-structure and tax neutral, close to cash flow. Flatters capex-heavy businesses.',m:'mult'},
{t:'EV/Revenue',alt:['EV/Revenue','EV / Revenue','EV/Sales'],d:'Enterprise value over revenue. Used when earnings are negative or margins differ wildly; ignores profitability.',m:'mult'},
{t:'EV/EBIT',alt:['EV/EBIT','EV / EBIT'],d:'Enterprise value over operating income. Penalizes capital-intensive companies through D&A, which proxies for reinvestment needs.',m:'mult'},
{t:'P/E',alt:['P/E','P / E','price-to-earnings','P/E ratio'],d:'Price over earnings per share, or equity value over net income. An equity multiple; distorted by leverage, taxes and one-offs. Its inverse is the earnings yield.',f:'Earnings yield = 1 ÷ P/E',m:'mult'},
{t:'P/B',alt:['P / Book value','P/B','Price-to-book','price-to-book','P / BV'],d:'Price over book value of equity. Used for banks and insurers, whose balance sheet is the business.',m:'mult'},
{t:'P/FFO',alt:['P / FFO','P/FFO','FFO','Funds from operations'],d:'Price over funds from operations: net income plus real-estate depreciation. The REIT multiple, because property depreciation is not economic.',m:'mult'},
{t:'Earnings yield',alt:['Earnings yield','earnings yield'],d:'Net income divided by price: the inverse of P/E. In M&A it is the cost of using stock as currency and the return bought when acquiring a target.',f:'Earnings yield = 1 ÷ P/E',m:'ma'},
{t:'Median',alt:['Median','median'],d:'The middle value of a sorted comp set (average of the two middle values if even). Preferred over the mean because one outlier cannot drag it.',m:'mult'},
{t:'LTM',alt:['LTM','Last twelve months','NTM','next twelve months','Next twelve months'],d:'LTM: the last twelve months of reported results. NTM: the next twelve months of projected results. Forward multiples are forward-looking, like valuation itself; bankers show both.',m:'mult'},
{t:'Comparable companies',alt:['Comparable companies','comparable companies','comps','Comps','public comps','Public comps','trading comps','peer group','Peer group','peers'],d:'Valuing a company by the multiples of similar public companies: pick peers, compute their multiples, place the target in the range, apply. Gives a trading (minority) value.',m:'val'},
{t:'Precedent transactions',alt:['Precedent transactions','precedent transactions','precedents','Precedents','transaction comps'],d:'Valuing a company by the multiples paid in recent acquisitions of similar companies. Includes a control premium, so it usually gives the highest value.',m:'val'},
{t:'Control premium',alt:['Control premium','control premium','premium','Premium'],d:'The amount paid above the unaffected share price to acquire control, typically 20–40%. Shareholders will not tender at market; the buyer pays for control and synergies.',m:'val'},
{t:'Football field',alt:['Football field','football field'],d:'A chart with one bar per valuation method showing its range, plus reference bars (52-week range, analyst targets). You triangulate across bars, never average them.',m:'val'},
{t:'Sum-of-the-parts',alt:['Sum-of-the-parts','sum-of-the-parts','SOTP'],d:'Valuing each business segment separately with its own method and multiples, then adding them up and subtracting corporate costs and net debt. Used for conglomerates.',m:'val'},
{t:'DCF',alt:['DCF','Discounted cash flow','discounted cash flow'],d:'Intrinsic valuation: project unlevered free cash flow, discount at WACC, add a terminal value, bridge from EV to equity and per share. Sensitive to assumptions; the terminal value dominates.',m:'dcf'},
{t:'WACC',alt:['WACC','Weighted average cost of capital','discount rate','Discount rate'],d:'The blended return all capital providers require, weighted at market values. The rate for discounting unlevered free cash flow.',f:'WACC = E/V × Ke + D/V × Kd × (1 − t)',m:'dcf'},
{t:'Cost of equity',alt:['Cost of equity','cost of equity','Ke'],d:'The return shareholders require, from CAPM: risk-free rate plus beta times the equity risk premium.',f:'Ke = Rf + β × ERP',m:'dcf'},
{t:'CAPM',alt:['CAPM','Capital asset pricing model'],d:'The model behind the cost of equity: investors are paid the risk-free rate plus a premium for systematic (non-diversifiable) risk, measured by beta.',f:'Ke = Rf + β × (Rm − Rf)',m:'dcf'},
{t:'Beta',alt:['Beta','beta','β','Levered beta','levered beta','Unlevered beta','unlevered beta','βU','βL'],d:'A stock\'s sensitivity to market moves. Levered beta includes the company\'s debt; unlevered (asset) beta is business risk only. Unlever peers\' betas, take the median, relever at the target\'s structure.',f:'βU = βL ÷ [1 + (1 − t) × D/E]',m:'dcf'},
{t:'Risk-free rate',alt:['Risk-free rate','risk-free rate','Rf','Treasury yield'],d:'The return on a default-free asset, usually the 10-year Treasury yield. The base of the cost of equity.',m:'dcf'},
{t:'Equity risk premium',alt:['Equity risk premium','equity risk premium','ERP','market risk premium'],d:'The extra return investors demand for holding stocks over Treasuries, typically 5–6%.',m:'dcf'},
{t:'Cost of debt',alt:['Cost of debt','cost of debt','Kd','after-tax cost of debt','After-tax cost of debt'],d:'The yield the company pays on its debt. Multiplied by (1 − t) in WACC because interest is tax-deductible.',f:'After-tax Kd = Kd × (1 − t)',m:'dcf'},
{t:'Tax shield',alt:['Tax shield','tax shield'],d:'The tax saving from a deductible expense: expense × tax rate. Interest, depreciation and write-downs all create one.',m:'links'},
{t:'Terminal value',alt:['Terminal value','terminal value','TV'],d:'The value of all cash flows beyond the projection period. Exit multiple: final-year EBITDA × a multiple. Gordon growth: final FCF × (1 + g) ÷ (WACC − g). Usually 60–80% of a DCF.',m:'dcf'},
{t:'Gordon growth',alt:['Gordon growth','Gordon Growth','perpetuity growth','Perpetuity growth','perpetuity','terminal growth','Terminal growth'],d:'Capitalizing a cash flow that grows forever at g: FCF × (1 + g) ÷ (r − g). Requires g below the discount rate, typically 2–3%.',f:'TV = FCF × (1 + g) ÷ (WACC − g)',m:'dcf'},
{t:'Exit multiple',alt:['Exit multiple','exit multiple','Entry multiple','entry multiple'],d:'In a DCF: the multiple applied to final-year EBITDA for the terminal value. In an LBO: the EV/EBITDA multiple paid at entry or received at exit.',m:'dcf'},
{t:'Discount factor',alt:['Discount factor','discount factor','discount factors','present value','Present value','PV'],d:'1 ÷ (1 + r)^t: what a dollar received in year t is worth today. Present value = cash flow × discount factor.',f:'PV = CF ÷ (1 + r)^t',m:'dcf'},
{t:'Mid-year convention',alt:['Mid-year convention','mid-year convention','mid-year'],d:'Assuming cash flows arrive midway through each year, so discount exponents are 0.5, 1.5, 2.5… Slightly raises present values.',m:'dcf'},
{t:'Sensitivity table',alt:['Sensitivity table','sensitivity table','sensitivity','Sensitivities','sensitivities'],d:'A grid showing how the valuation changes as two inputs move (WACC against exit multiple or terminal growth). Shows a range instead of a false point estimate.',m:'dcf'},
{t:'Accretion / dilution',alt:['Accretion / dilution','accretion / dilution','accretion/dilution','Accretive','accretive','Dilutive','dilutive','Accretion','accretion','dilution'],d:'Whether pro forma EPS after a deal is higher (accretive) or lower (dilutive) than the buyer\'s standalone EPS. Accretion is not the same as value creation.',f:'Accretion % = Pro forma EPS ÷ standalone EPS − 1',m:'ma'},
{t:'Pro forma',alt:['Pro forma','pro forma'],d:'"As if the deal had happened": the combined company\'s net income, shares and EPS after synergies, financing costs and new shares.',m:'ma'},
{t:'Synergies',alt:['Synergies','synergies','synergy','Synergy'],d:'Extra profit from combining two companies. Cost synergies (removing duplication) are credible; revenue synergies (cross-selling) are not. Count them after tax.',m:'ma'},
{t:'Purchase price allocation',alt:['Purchase price allocation','purchase price allocation','purchase accounting','Purchase accounting','write-up','Write-up','write-ups'],d:'In a deal, the target\'s assets are written up to fair value (creating deferred tax liabilities), old goodwill and equity are eliminated, and new goodwill is the plug.',m:'ma'},
{t:'Exchange ratio',alt:['Exchange ratio','exchange ratio'],d:'Buyer shares issued per target share: offer price ÷ buyer share price. Fixed ratios shift price risk to the seller; floating ratios shift it to the buyer.',m:'ma'},
{t:'Foregone interest',alt:['Foregone interest','foregone interest'],d:'Interest the buyer no longer earns on the cash it spends in a deal. Its after-tax amount reduces pro forma net income.',f:'Cost of cash = cash used × rate × (1 − t)',m:'ma'},
{t:'LBO',alt:['LBO','Leveraged buyout','leveraged buyout'],d:'A private equity firm buying a company with a large share of debt, repaying it from the company\'s cash flow, and selling in 3–7 years. Returns come from debt paydown, EBITDA growth and multiple expansion.',m:'lbo'},
{t:'Sponsor',alt:['Sponsor','sponsor','private equity','Private equity','PE firm','PE'],d:'The private equity firm making the buyout. It invests the equity check and targets roughly 20–25% IRR.',m:'lbo'},
{t:'Leverage',alt:['Leverage','leverage','levered','Levered'],d:'Debt relative to EBITDA or equity. In an LBO, debt of 4–6x EBITDA is common; more leverage means a smaller equity check and higher returns, with more risk.',m:'lbo'},
{t:'MOIC',alt:['MOIC','multiple of money','Multiple of money','cash-on-cash'],d:'Multiple of invested capital: exit equity ÷ equity invested. Ignores time; a 3x in 10 years is only about 12% IRR.',f:'MOIC = Exit equity ÷ entry equity',m:'lbo'},
{t:'IRR',alt:['IRR','internal rate of return','Internal rate of return'],d:'The annualized return on the sponsor\'s equity. For one cash in and one cash out: MOIC^(1/years) − 1. Rules of thumb over 5 years: 2x ≈ 15%, 2.5x ≈ 20%, 3x ≈ 25%.',f:'IRR = MOIC^(1/n) − 1',m:'lbo'},
{t:'Sources & uses',alt:['Sources & uses','Sources &amp; uses','sources and uses','Sources and uses'],d:'The deal\'s funding table. Uses: equity purchase price, debt refinanced, fees, cash to balance sheet. Sources: debt tranches, existing cash, rollover, sponsor equity (the plug).',m:'lbo'},
{t:'Cash sweep',alt:['Cash sweep','cash sweep','debt paydown','Debt paydown','paydown','deleveraging','Deleveraging'],d:'Using all free cash flow to repay debt each year. Every dollar repaid shifts value from lenders to the sponsor\'s equity.',m:'lbo'},
{t:'Senior debt',alt:['Senior debt','senior debt','Senior','secured'],d:'The safest, cheapest debt: secured, repaid first, often floating-rate term loans with amortization and covenants.',m:'lbo'},
{t:'Subordinated debt',alt:['Subordinated debt','subordinated debt','Subordinated notes','Subordinated','Mezzanine','mezzanine','mezz'],d:'Debt that ranks below senior: unsecured, higher interest, sometimes PIK. Mezzanine is the layer just above equity.',m:'lbo'},
{t:'PIK',alt:['PIK','payment-in-kind'],d:'Payment-in-kind interest: accrues to the principal instead of being paid in cash. Preserves cash flow for senior debt at the cost of a growing balance.',m:'lbo'},
{t:'Revolver',alt:['Revolver','revolver','revolving credit'],d:'A revolving credit line the company can draw and repay as needed. Provides liquidity; usually undrawn at close.',m:'lbo'},
{t:'Covenants',alt:['Covenants','covenants','covenant'],d:'Lender-imposed limits, such as maximum leverage or minimum interest coverage. Breaching one can trigger default.',m:'lbo'},
