<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IB Drills</title>
<meta name="description" content="Repeatable, randomized drills for investment banking technicals: three statements, EV, multiples, valuation, DCF, M&A, LBO.">
<meta name="theme-color" content="#1A1650">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IB Drills">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Layout: one column, phone-first, sticky top bar, fixed bottom tabs. Theme: arena-style game UI (sunburst blue, gold bevel buttons, outlined display type, white reward cards). */
:root{
  --bg:#1A1650; --bg2:#2A1F7A; --ray:rgba(120,170,255,.14);
  --navy:#0E1550; --navy2:#141C5E; --panel:#1F2C86; --panel2:#2A3AA6; --panel-edge:#0B123F;
  --card:#FFFDF6; --card-edge:#D9D0BD; --card-shadow:#BDB39B; --ink-dark:#1F2452; --ink-mid:#4A5280; --ink-faint:#8A91B8;
  --ink:#FFFFFF; --dim:#C9D3FF; --faint:#8F9BD9;
  --gold:#FFD23F; --gold-hi:#FFE985; --gold-lo:#E39A08; --gold-edge:#7A4A06; --gold-shadow:#A86E00;
  --blue:#4FB4FF; --blue-lo:#2A74E6; --blue-edge:#123C7E; --blue-shadow:#0E2F66;
  --purple:#9A5BFF; --purple-lo:#6A32D8; --cyan:#45E0FF;
  --green:#7CEB3F; --green-lo:#36B51A; --green-edge:#1E6A0B;
  --red:#FF5F55; --red-lo:#D5302A; --red-edge:#7A1410;
  --up:#5BE061; --down:#FF6B61;
  --display:"Lilita One","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --sans:Nunito,"Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:Nunito,"Avenir Next",system-ui,sans-serif;
  --ol:#1A1230;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;color:var(--ink);font:700 15px/1.45 var(--sans);-webkit-text-size-adjust:100%;
  background:
    radial-gradient(ellipse 140% 60% at 50% -10%, rgba(140,120,255,.45), rgba(140,120,255,0) 60%),
    repeating-conic-gradient(from -8deg at 50% 18%, var(--ray) 0 7deg, rgba(0,0,0,0) 7deg 22deg),
    linear-gradient(180deg,var(--bg2) 0,var(--bg) 45vh,#120F38 100%)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom,0px));position:relative}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:800}
.good{color:var(--up)}.weak{color:var(--down)}.hot{color:var(--gold)}
.ol{text-shadow:2px 0 0 var(--ol),-2px 0 0 var(--ol),0 2px 0 var(--ol),0 -2px 0 var(--ol),1.5px 1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px -1.5px 0 var(--ol),0 4px 0 var(--ol)}
h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;letter-spacing:.01em;text-wrap:balance;margin:14px 0 6px;color:#fff;
  text-shadow:2px 0 0 var(--ol),-2px 0 0 var(--ol),0 2px 0 var(--ol),0 -2px 0 var(--ol),1.5px 1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px -1.5px 0 var(--ol),0 4px 0 var(--ol)}
h3.eyebrow,.eyebrow{display:block;font:400 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px;text-shadow:0 2px 0 var(--ol)}
.lead{color:var(--dim);margin-bottom:12px}
.note{color:var(--dim);font-size:13.5px;margin:4px 0 10px}
.foot{color:var(--faint);font-size:12.5px;margin-top:26px;text-align:center}
code{font-family:var(--mono);font-size:13px;color:var(--gold-hi);background:rgba(0,0,0,.25);padding:1px 6px;border-radius:6px;font-weight:800}

/* top bar */
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;margin:0 -14px 8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 9px;
  background:linear-gradient(180deg,#1A2270,#131A5A);border-bottom:3px solid var(--panel-edge);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.02em;color:var(--gold);line-height:1;text-shadow:2px 0 0 var(--ol),-2px 0 0 var(--ol),0 2px 0 var(--ol),0 -2px 0 var(--ol),1.5px 1.5px 0 var(--ol),-1.5px 1.5px 0 var(--ol),1.5px -1.5px 0 var(--ol),-1.5px -1.5px 0 var(--ol),0 4px 0 var(--ol)}
.brand b{color:#fff;font-weight:400;margin-right:6px}
#topmeta{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}
.coin{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#0E1550,#0A1040);border:2px solid #050A2A;border-radius:999px;padding:2px 10px 2px 4px;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 2px 0 var(--ol);min-width:66px;justify-content:flex-end}
.coin i,.fcoin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4B0,#FFD23F 45%,#E39A08 100%);border:2px solid #8A5A00;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.coin.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.pill{background:linear-gradient(180deg,#0E1550,#0A1040);border:2px solid #050A2A;border-radius:999px;padding:3px 10px;font-family:var(--display);font-size:14px;color:#fff;text-shadow:0 2px 0 var(--ol)}
.pill.hot{color:var(--gold)}

/* bottom tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#1A2270,#0F1548);border-top:3px solid var(--panel-edge)}
#tabs[hidden]{display:none}
#tabs button{flex:1;max-width:210px;min-height:46px;border:2px solid #0A1040;border-radius:12px;background:linear-gradient(180deg,#2A3AA6,#1C2A7A);color:var(--dim);font:400 17px var(--display);letter-spacing:.03em;box-shadow:0 4px 0 #0A1040;text-shadow:0 2px 0 var(--ol)}
#tabs button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));border-color:var(--gold-edge);color:#fff;box-shadow:0 4px 0 var(--gold-shadow)}

/* buttons */
.btn{min-height:50px;padding:0 18px;border-radius:12px;border:2px solid var(--blue-edge);background:linear-gradient(180deg,var(--blue),var(--blue-lo));color:#fff;font:400 18px var(--display);letter-spacing:.02em;line-height:1.1;
  box-shadow:0 5px 0 var(--blue-shadow),inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-shadow),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));border-color:var(--gold-edge);box-shadow:0 5px 0 var(--gold-shadow),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 #7A4A06}
.btn.primary:active{box-shadow:0 2px 0 var(--gold-shadow),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.ghost{background:linear-gradient(180deg,#2A3AA6,#1C2A7A);border-color:#0A1040;box-shadow:0 5px 0 #0A1040,inset 0 2px 0 rgba(255,255,255,.15);color:var(--dim)}
.btn.ghost:active{box-shadow:0 2px 0 #0A1040}
.btn.danger{background:linear-gradient(180deg,var(--red),var(--red-lo));border-color:var(--red-edge);box-shadow:0 5px 0 var(--red-edge)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1 1 auto}
.acts .btn.primary{flex:2 1 auto}
.acts.col{flex-direction:column}
.acts.col .btn{width:100%}
.link{background:none;border:none;color:var(--cyan);font-weight:800;font-size:14px;padding:6px 0}
.link.back{margin-top:4px}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.hero2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;padding:14px 16px;border-radius:14px;border:3px solid var(--panel-edge);background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 6px 0 var(--panel-edge),inset 0 2px 0 rgba(255,255,255,.18)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--panel-edge)}
.big b{font-family:var(--display);font-weight:400;font-size:22px;color:#fff;letter-spacing:.02em;text-shadow:0 2px 0 var(--ol)}
.big small{color:var(--dim);font-size:13px;line-height:1.35;font-weight:700}
.big.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));border-color:var(--gold-edge);box-shadow:0 6px 0 var(--gold-shadow),inset 0 2px 0 rgba(255,255,255,.5);padding:18px 16px}
.big.primary b{font-size:30px;text-shadow:2px 0 0 #7A4A06,-2px 0 0 #7A4A06,0 2px 0 #7A4A06,0 -2px 0 #7A4A06,1.5px 1.5px 0 #7A4A06,-1.5px 1.5px 0 #7A4A06,1.5px -1.5px 0 #7A4A06,-1.5px -1.5px 0 #7A4A06,0 4px 0 #7A4A06}
.big.primary small{color:#5A3A00;font-weight:800}
.big.primary:active{box-shadow:0 3px 0 var(--gold-shadow)}
@media (max-width:420px){.hero2 .big b{font-size:18px}.hero2 .big small{font-size:12px}}
.rows{display:flex;flex-direction:column;gap:8px}
.mrow,.drow,.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;border-radius:12px;border:2px solid var(--panel-edge);background:linear-gradient(180deg,var(--panel2),var(--panel));color:#fff;box-shadow:0 4px 0 var(--panel-edge)}
.mrow:active,.drow:active{transform:translateY(2px);box-shadow:0 2px 0 var(--panel-edge)}
.mt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mt b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.01em;text-shadow:0 2px 0 var(--ol)}
.mt small{color:var(--dim);font-size:12.5px;line-height:1.35;font-weight:700}
.mm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 76px;font-size:13px;color:var(--gold)}
.bar{display:block;width:76px;height:10px;border-radius:6px;background:#0A1040;border:2px solid #050A2A;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(180deg,var(--cyan),#2CA6F0)}
.bar.good i{background:linear-gradient(180deg,var(--green),var(--green-lo))}
.mastery{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);margin:6px 0 4px}
.mastery .bar{width:120px}

/* session chrome */
.shead{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.shead .x{width:38px;height:38px;border-radius:50%;border:2px solid #0A1040;background:linear-gradient(180deg,#2A3AA6,#1C2A7A);color:#fff;font-family:var(--display);font-size:16px;flex:none;box-shadow:0 3px 0 #0A1040}
.shead .skip{margin-left:auto;font-size:13px;color:var(--dim);padding:6px 4px}
.sbar{flex:1;height:14px;border-radius:8px;background:#0A1040;border:2px solid #050A2A;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.4)}
.sbar i{display:block;height:100%;background:linear-gradient(180deg,var(--cyan),#2CA6F0);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.qhead{display:flex;align-items:center;gap:8px}
.qhead .eyebrow{margin:10px 0 0;flex:1;min-width:0}
.why{width:30px;height:30px;border-radius:50%;border:2px solid #0A1040;background:linear-gradient(180deg,#4FB4FF,#2A74E6);color:#fff;font:400 16px var(--display);margin-top:10px;flex:none;box-shadow:0 3px 0 #0E2F66;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.qt{margin-top:6px}

/* worksheet (white reward-card style) */
.ws{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;background:var(--card);color:var(--ink-dark);border:3px solid var(--card-edge);border-radius:14px;overflow:hidden;box-shadow:0 6px 0 var(--card-shadow)}
.ws td{padding:8px 11px;border-bottom:2px solid #EEE8D9;vertical-align:top;font-weight:700}
.ws tr:last-child td{border-bottom:none}
.ws td.v{text-align:right;font-family:var(--mono);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px;color:var(--ink-dark)}
.ws td.vt{white-space:normal;font-size:13px}
.ws tr.g td{color:var(--ink-mid)}
.ws tr.g td.v{color:var(--ink-dark)}
.ws tr.long td{padding:9px 11px}
.ws tr.long small{display:block;font-size:12.5px;color:var(--ink-mid);margin-bottom:2px;font-weight:700}
.ws tr.long div{font-size:14px;color:var(--ink-dark);line-height:1.4;font-weight:700}
.ws tr.done td{color:var(--ink-dark)}
.ws tr.done.ok td.v{color:#1E8A12}
.ws tr.done.ok td.v::after{content:" ✓";color:#36B51A}
.ws tr.done.miss td.v{color:#C8231C}
.ws tr.cur td{background:#FFF3C4;color:#7A4A06;font-weight:900;border-left:4px solid var(--gold-lo)}
.ws tr.todo td{color:var(--ink-faint);opacity:.75}

/* docked answer panel */
.ask{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;margin-top:14px;background:linear-gradient(180deg,#2A3AA6,#1C2A7A);border:3px solid var(--panel-edge);border-radius:16px;padding:12px 12px 12px;box-shadow:0 -8px 30px rgba(0,0,0,.45),0 6px 0 var(--panel-edge),inset 0 2px 0 rgba(255,255,255,.15)}
.ask.fbp{padding:10px 12px}
.ask .fb{margin-top:0}
.ql{display:block;font-family:var(--display);font-weight:400;font-size:19px;margin-bottom:8px;text-wrap:balance;color:#fff;text-shadow:0 2px 0 var(--ol)}
.retry{display:block;font-family:var(--sans);font-size:13px;color:#FFB4AE;margin-top:4px;font-weight:800}
.inp{display:flex;align-items:center;gap:8px}
.inp input{flex:1;min-width:0;width:100%;font:800 24px var(--mono);font-variant-numeric:tabular-nums;padding:9px 12px;border-radius:12px;border:3px solid var(--gold-edge);background:var(--card);color:var(--ink-dark);text-align:right;-webkit-appearance:none;appearance:none;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.inp input::placeholder{color:#B9B2A2}
.inp input:disabled{opacity:.5}
.inp .sign{width:50px;height:50px;border-radius:12px;border:2px solid var(--blue-edge);background:linear-gradient(180deg,var(--blue),var(--blue-lo));color:#fff;font:400 24px var(--display);box-shadow:0 4px 0 var(--blue-shadow)}
.inp .sign:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue-shadow)}
.inp .sign.on{background:linear-gradient(180deg,var(--purple),var(--purple-lo));border-color:#3A1A80;box-shadow:0 4px 0 #3A1A80}
.inp .unit{font:800 11px var(--sans);color:var(--dim);min-width:44px;text-align:left;line-height:1.2}
.calc{min-height:22px;font:800 15px var(--mono);color:var(--gold);text-align:right;padding:4px 2px 0;text-shadow:0 1px 0 var(--ol)}
.calc .err{color:#FFB4AE;font-family:var(--sans)}
.dimtext{color:var(--faint)}
.hint{margin-top:10px;font-size:13px;color:#FFF3C4;border-left:4px solid var(--gold);padding:7px 10px;background:rgba(0,0,0,.25);border-radius:0 8px 8px 0;font-weight:800}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.kp .k{height:44px;border-radius:10px;border:2px solid #0A1040;background:linear-gradient(180deg,#F8F6FF,#D9DCF2);color:var(--ink-dark);font:800 20px var(--mono);line-height:1;box-shadow:0 4px 0 #0A1040}
.kp .k.op{background:linear-gradient(180deg,var(--blue),var(--blue-lo));color:#fff;border-color:var(--blue-edge);box-shadow:0 4px 0 var(--blue-shadow);font-family:var(--display);font-weight:400;font-size:21px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.kp .k:active{transform:translateY(3px);box-shadow:0 1px 0 #0A1040}
.selinfo{font-size:14px;margin-bottom:8px;min-height:20px;color:#fff}
.selinfo b{font-family:var(--display);font-weight:400;font-size:16px}

/* feedback */
.fb{margin-top:14px;background:var(--card);color:var(--ink-dark);border:3px solid #4FC957;border-radius:14px;padding:12px 14px;box-shadow:0 6px 0 var(--card-shadow)}
.fb.miss{border-color:#F05A50}
.fb.mixed{border-color:var(--gold-lo)}
.fb .h{font-family:var(--display);font-weight:400;font-size:19px;margin-bottom:4px;color:#1E8A12}
.fb.miss .h{color:#C8231C}
.fb.mixed .h{color:#8A5A00}
.fb .f{font-size:13px;color:#8A5A00;margin-bottom:6px;font-weight:800;background:#FFF3C4;padding:5px 8px;border-radius:8px}
.fb .x{font-size:14px;color:var(--ink-dark);font-weight:700;max-height:42vh;overflow:auto;-webkit-overflow-scrolling:touch}
.fb .x b{color:#0E1550;font-weight:900}
.fb .x .term,.secb .term{border-bottom-color:#9A5BFF}

/* choice */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;border:3px solid var(--card-edge);background:var(--card);color:var(--ink-dark);border-radius:14px;font-size:15px;line-height:1.4;font-weight:700;box-shadow:0 5px 0 var(--card-shadow)}
.opt:active{transform:translateY(2px);box-shadow:0 3px 0 var(--card-shadow)}
.opt .k{font:400 15px var(--display);color:#fff;background:linear-gradient(180deg,var(--blue),var(--blue-lo));border:2px solid var(--blue-edge);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;flex:none;margin-top:1px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.opt.ok{border-color:#36B51A;background:#EEFBE4}.opt.ok .k{background:linear-gradient(180deg,var(--green),var(--green-lo));border-color:var(--green-edge)}
.opt.miss{border-color:#F05A50;background:#FFEDEB}.opt.miss .k{background:linear-gradient(180deg,var(--red),var(--red-lo));border-color:var(--red-edge)}
.opt.dimmed{opacity:.55}
.opt:disabled{cursor:default;transform:none}

/* order */
.seq{display:flex;flex-direction:column;gap:7px;margin-top:10px;min-height:52px}
.seq .empty{color:var(--dim);font-size:13.5px;padding:14px;border:3px dashed rgba(255,255,255,.25);border-radius:14px;text-align:center}
.si{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:3px solid var(--card-edge);background:var(--card);color:var(--ink-dark);border-radius:12px;font-size:14.5px;font-weight:700;box-shadow:0 4px 0 var(--card-shadow)}
.si .k{font:400 14px var(--display);color:#fff;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));border:2px solid var(--gold-edge);border-radius:8px;width:26px;height:26px;display:grid;place-items:center;flex:none;text-shadow:0 1px 0 #7A4A06}
.si.ok{border-color:#36B51A}.si.ok .k{background:linear-gradient(180deg,var(--green),var(--green-lo));border-color:var(--green-edge)}
.si.miss{border-color:#F05A50}.si.miss .k{background:linear-gradient(180deg,var(--red),var(--red-lo));border-color:var(--red-edge)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:10px 13px;border-radius:999px;border:2px solid var(--blue-edge);background:linear-gradient(180deg,var(--blue),var(--blue-lo));color:#fff;font-size:14px;text-align:left;line-height:1.3;font-weight:800;box-shadow:0 4px 0 var(--blue-shadow);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.chip:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue-shadow)}
.co{margin:6px 0 8px 18px;font-size:14px;color:var(--ink-dark)}
.co li{margin:2px 0}

/* flash card */
.card{margin-top:12px;background:var(--card);color:var(--ink-dark);border:3px solid var(--card-edge);border-radius:16px;padding:16px 16px;box-shadow:0 6px 0 var(--card-shadow)}
.card .eyebrow{margin:0 0 6px;color:#8A5A00;text-shadow:none}
.card .qt{margin:0 0 10px;color:var(--ink-dark);text-shadow:none;font-size:22px}

<body>
<div class="wrap"><header id="top"><div class="brand"><b>IB</b>Drills</div><div id="topmeta"></div></header>
<main id="view"></main></div>
<nav id="tabs" aria-label="Sections"><button data-tab="drill">Drill</button><button data-tab="learn">Learn</button><button data-tab="stats">Progress</button></nav>
<div id="sheet" hidden></div>
<div id="fx" aria-hidden="true"></div>
<script>
/*__ENGINE_START__*/
// IB Drills — generator engine. Pure functions, no DOM. Everything in $mm unless noted.
const IBD = (() => {
  // ---------- seeded rng ----------
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function makeRng(seed){
    const f=mulberry32(seed>>>0);
    return {
      seed, f,
      int:(a,b)=>a+Math.floor(f()*(b-a+1)),
      pick:(arr)=>arr[Math.floor(f()*arr.length)],
      chance:(p)=>f()<p,
      shuffle:(arr)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
      step:(a,b,s)=>{const n=Math.max(0,Math.floor((b-a)/s));return a+s*Math.floor(f()*(n+1))}
    };
  }
  // ---------- numbers ----------
  const R=(v,dp=0)=>{const m=Math.pow(10,dp);return Math.round((v+Number.EPSILON)*m)/m};
  const fnum=(v,dp)=>{
    if(v==null||!isFinite(v))return '–';
    const neg=v<0, a=Math.abs(v);
    let s;
    if(dp==null){const r=R(a,2);s=r.toLocaleString('en-US',{maximumFractionDigits:2})}
    else s=a.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp});
    return (neg?'−':'')+s;
  };
  const UNITS={
    '$':  {dp:1, show:v=>(v<0?'−$':'$')+fnum(Math.abs(v)), hint:'$mm'},
    '$ps':{dp:2, show:v=>(v<0?'−$':'$')+fnum(Math.abs(v),2), hint:'$ per share'},
    '%':  {dp:1, show:v=>fnum(v,1)+'%', hint:'%'},
    'x':  {dp:1, show:v=>fnum(v,1)+'x', hint:'x (multiple)'},
    'x2': {dp:2, show:v=>fnum(v,2)+'x', hint:'x (multiple)'},
    'mm': {dp:1, show:v=>fnum(v)+' mm', hint:'mm shares'},
    'n':  {dp:2, show:v=>fnum(v), hint:''},
    'yr': {dp:1, show:v=>fnum(v,1)+' yrs', hint:'years'}
  };
  const show=(v,unit)=>(UNITS[unit]||UNITS.n).show(v);
  const $=(v)=>show(v,'$'), ps=(v)=>show(v,'$ps'), pct=(v,dp=1)=>fnum(v,dp)+'%', x=(v,dp=1)=>fnum(v,dp)+'x', mm=(v)=>show(v,'mm');
  // Expression evaluator: digits, + - * / ^, parentheses, unary minus. Accepts × ÷ − and strips $ , % x.
  function evalExpr(src){
    if(src==null)return NaN; let s=String(src).trim(); if(!s)return NaN;
    s=s.replace(/[$,\s%]/g,'').replace(/−/g,'-').replace(/x$/i,'').replace(/[×x]/gi,'*').replace(/÷/g,'/');
    if(!s)return NaN;
    const toks=[]; let i=0;
    while(i<s.length){const c=s[i];
      if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const n=parseFloat(s.slice(i,j));if(!isFinite(n))return NaN;toks.push({t:'n',v:n});i=j;continue}
      if('+-*/^()'.includes(c)){toks.push({t:c});i++;continue}
      return NaN;}
    let p=0; const peek=()=>toks[p], next=()=>toks[p++];
    function expr(){let v=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=next().t;const r=term();v=op==='+'?v+r:v-r}return v}
    function term(){let v=factor();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=next().t;const r=factor();v=op==='*'?v*r:v/r}return v}
    function factor(){const b=unary();if(peek()&&peek().t==='^'){next();const e=factor();return Math.pow(b,e)}return b}
    function unary(){const k=peek();if(!k)return NaN;if(k.t==='-'){next();return -unary()}if(k.t==='+'){next();return unary()}return atom()}
    function atom(){const k=next();if(!k)return NaN;if(k.t==='n')return k.v;if(k.t==='('){const v=expr();const c=next();if(!c||c.t!==')')return NaN;return v}return NaN}
    const v=expr(); if(p!==toks.length)return NaN; return isFinite(v)?v:NaN;
  }
  const parseNum=evalExpr;
  function tolFor(step){
    if(step.tol!=null)return step.tol;
    const dp=(UNITS[step.unit]||UNITS.n).dp;
    return Math.max(Math.abs(step.a)*0.006, 0.51*Math.pow(10,-dp));
  }
  function checkNum(step,input){
    const v=evalExpr(input); if(!isFinite(v))return {ok:false,bad:true};
    return {ok:Math.abs(v-step.a)<=tolFor(step), v};
  }
  // ---------- registry ----------
  const MODULES=[
    {id:'is',   group:'Three statements', name:'Income statement',   short:'IS',      blurb:'Revenue to EPS, line by line.'},
    {id:'bs',   group:'Three statements', name:'Balance sheet',      short:'BS',      blurb:'Assets = liabilities + equity, and what sits where.'},
    {id:'cfs',  group:'Three statements', name:'Cash flow statement',short:'CFS',     blurb:'Net income to net change in cash. Signs matter.'},
    {id:'links',group:'Three statements', name:'How they link',      short:'Links',   blurb:'"Walk me through $X of…" — the transaction drills.'},
    {id:'ev',   group:'Valuation',        name:'Equity value & EV',  short:'EqV / EV',blurb:'The bridge, diluted shares, what moves what.'},
    {id:'mult', group:'Valuation',        name:'Multiples',          short:'Multiples',blurb:'Compute them, pick the right one, apply them.'},
    {id:'val',  group:'Valuation',        name:'Methodologies',      short:'Methods', blurb:'Comps, precedents, DCF, LBO: steps and when to use each.'},
    {id:'dcf',  group:'Valuation',        name:'DCF',                short:'DCF',     blurb:'UFCF, WACC, CAPM, beta, terminal value, discounting.'},
    {id:'ma',   group:'Deals',            name:'M&A',                short:'M&A',     blurb:'Accretion / dilution, cost of financing, goodwill.'},
    {id:'lbo',  group:'Deals',            name:'LBO',                short:'LBO',     blurb:'Sources & uses, debt paydown, MOIC, IRR, the paper LBO.'},
    {id:'case', group:'Capstone',         name:'Full case',          short:'Case',    blurb:'One company, every concept, start to finish.'},
    {id:'build',group:'From scratch',     name:'Build from scratch', short:'Build',   blurb:'Spreadsheet-style: fill the whole model yourself, then check it.'},
    {id:'super',group:'Super day',        name:'Mock super day',     short:'Super day',blurb:'Interview questions with model answers, plus mental math.'}
  ];
  const DRILLS=[];
  const drill=(d)=>{DRILLS.push(d);return d};
  const S=(label,a,unit,extra)=>Object.assign({label,a,unit:unit||'$'},extra||{});
  const opts=(rng,bank,avoid)=>{ // choice: pick an item from a bank, shuffle options, return normalized
    let pool=bank; if(avoid&&avoid.length&&bank.length>avoid.length) pool=bank.filter(b=>!avoid.includes(b.q));
    const item=rng.pick(pool);
    const correct=item.options[0];
    const options=rng.shuffle(item.options);
    return {q:item.q, context:item.context||null, options, answer:options.indexOf(correct), explain:item.explain, key:item.q};
  };

  // ---------- a random company (used across modules) ----------
  function mkCo(rng){
    const r5=(v)=>Math.round(v/5)*5;
    const rev=rng.step(200,5000,50);
    const cogsPct=rng.step(35,65,5), daPct=rng.int(2,7);
    let opexPct=rng.step(10,20,5); if(cogsPct+opexPct+daPct>90)opexPct=90-cogsPct-daPct;
    const cogs=r5(rev*cogsPct/100), opex=r5(rev*opexPct/100), da=Math.max(5,r5(rev*daPct/100));
    const gp=rev-cogs, ebitda=gp-opex, ebit=ebitda-da;
    const debt=rng.step(0,Math.max(50,R(3.5*ebitda,-2)),50);
    const rd=rng.pick([4,5,6,8]);
    const intExp=R(debt*rd/100);
    const cash=rng.step(10,Math.max(10,R(rev*0.3,-1)),10);

  const SUPERQ=[
    {c:'Accounting',q:'Walk me through the three financial statements.',a:'The income statement shows profitability over a period: revenue, minus COGS and operating expenses, gives operating income; minus interest and taxes gives net income. The balance sheet is a snapshot: assets equal liabilities plus shareholders\' equity. The cash flow statement reconciles net income to the change in cash: operating (net income, non-cash add-backs, working capital), investing (capex, acquisitions), financing (debt, equity, dividends).',p:'How do they connect?'},
    {c:'Accounting',q:'How do the three statements link together?',a:'Net income flows to the top of the cash flow statement and into retained earnings. Non-cash expenses like D&A are added back in operating cash flow and reduce PP&E. Working-capital changes adjust operating cash flow and show up as balance-sheet movements. Capex reduces investing cash flow and increases PP&E. Debt and equity raised or repaid flow through financing and change the balance sheet. The net change in cash becomes the new cash balance.',p:'What if I only gave you two statements?'},
    {c:'Accounting',q:'Walk me through $10 of depreciation with a 40% tax rate.',a:'Income statement: operating income falls 10, pretax income falls 10, taxes fall 4, net income falls 6. Cash flow statement: start with net income down 6, add back the 10 of non-cash depreciation, cash is up 4. Balance sheet: PP&E down 10, cash up 4, so assets down 6; retained earnings down 6 on the other side. It balances.',p:'What if depreciation were not tax-deductible?'},
    {c:'Accounting',q:'A company buys $100 of inventory with cash. Walk through the statements now and when it sells the inventory for $150 cash.',a:'At purchase: no income statement effect. Cash flow: inventory up 100 is subtracted in operating cash flow, cash down 100. Balance sheet: inventory up 100, cash down 100. At sale with a 40% tax rate: revenue 150, COGS 100, pretax income 50, taxes 20, net income 30. Cash flow: net income 30, inventory down 100 is added back, cash up 130. Balance sheet: cash up 130, inventory down 100, assets up 30; retained earnings up 30.',p:'What if the sale were on credit?'},
    {c:'Accounting',q:'A company raises $100 of debt at 10% interest, 40% tax rate. Walk through issuance and the end of year one.',a:'At issuance: no income statement effect; financing cash flow up 100; cash up 100 and debt up 100. After one year: interest expense 10 reduces pretax income by 10 and net income by 6. Cash flow: net income down 6 flows through operating cash flow, cash down 6. Balance sheet: cash down 6, retained earnings down 6, debt unchanged unless principal was repaid.',p:'Now repay $20 of principal.'},
    {c:'Accounting',q:'What is the difference between accounts receivable and deferred revenue?',a:'Receivables are an asset: the company has delivered and recognized revenue but has not collected cash. Deferred revenue is a liability: the company has collected cash but has not yet delivered, so it owes the product or service. Rising receivables consume cash; rising deferred revenue generates cash.',p:'Which business model generates deferred revenue?'},
    {c:'Accounting',q:'How can a profitable company go bankrupt?',a:'Profit is accrual; bankruptcy is about cash. A company can report net income while receivables and inventory soak up cash, while heavy capex drains it, or while a debt maturity it cannot refinance comes due. Liquidity, not profitability, triggers default. That is why the cash flow statement and the debt schedule matter as much as the income statement.',p:'Give an example of a working-capital squeeze.'},
    {c:'Accounting',q:'What is working capital and why does it matter in valuation?',a:'Operating working capital is non-cash current assets minus non-debt current liabilities: receivables plus inventory minus payables and accruals. Growth usually requires more of it, which consumes cash, so an increase in working capital is subtracted in free cash flow. Businesses with negative working capital, like subscription or retail models, get paid before they pay suppliers and generate cash as they grow.',p:'What does negative working capital tell you?'},
    {c:'Accounting',q:'Explain deferred tax assets and liabilities.',a:'They arise from timing differences between book and tax accounting. A deferred tax liability means the company will pay more cash tax later, typically because tax depreciation is accelerated relative to book depreciation. A deferred tax asset means future cash tax savings, for example from net operating losses or expenses booked now but deductible later. They matter in M&A because asset write-ups create DTLs, and NOLs can be a source of value.',p:'How do NOLs show up in a DCF?'},
    {c:'Accounting',q:'What is goodwill, and what happens when it is impaired?',a:'Goodwill is the premium paid in an acquisition over the fair value of the target\'s net identifiable assets. It sits as a long-term asset and is tested annually for impairment rather than amortized. An impairment is a non-cash charge: net income falls, it is added back on the cash flow statement, and goodwill and retained earnings fall. Usually it is not tax-deductible, so there is no tax shield.',p:'Why do companies impair goodwill?'},
    {c:'Accounting',q:'Where does stock-based compensation appear and how do you treat it in free cash flow?',a:'It is an operating expense that reduces net income, and it is added back in operating cash flow because no cash leaves. Many analysts still subtract it from free cash flow, or count the dilution in the share count, because it is a real cost to shareholders. Be consistent: either treat it as a cost or reflect it in dilution, not neither.',p:'Why might adding it back overstate free cash flow?'},
    {c:'Accounting',q:'If you could only look at one statement, which would you choose? Two?',a:'One: the cash flow statement, because cash is what pays creditors and shareholders, it is the hardest to manipulate, and it shows capex and working capital. Two: the income statement plus the beginning and ending balance sheets, because with net income and the change in every balance you can rebuild the cash flow statement.',p:'Why not the income statement alone?'},
    {c:'Accounting',q:'What is the difference between capitalizing and expensing a cost?',a:'Expensing hits the income statement immediately. Capitalizing records the cost as an asset and spreads it over time through depreciation or amortization. Capitalizing raises current EBITDA and net income and moves the cash outflow from operating to investing; total cash is identical. Aggressive capitalization is a classic earnings-quality warning.',p:'How would you spot it in the filings?'},
    {c:'Accounting',q:'How does a $100 inventory write-down differ from a $100 goodwill impairment?',a:'Both are non-cash charges that reduce net income and are added back on the cash flow statement. The inventory write-down usually runs through COGS and is tax-deductible, so net income falls by 100 times one minus the tax rate and cash rises by the tax saving. Goodwill impairment is below operating income, typically not deductible, so net income falls by the full 100 and cash is unchanged.',p:'Which one affects EBITDA?'},
    {c:'Accounting',q:'Why does negative shareholders\' equity not necessarily mean a company is in trouble?',a:'Book equity is historical: paid-in capital plus retained earnings minus buybacks. A highly profitable company that returns more than it earns through buybacks and dividends can drive book equity negative while its market value is enormous. Trouble shows up in cash flow and leverage, not in the book equity line.',p:'Name a company like that.'},
    {c:'EV',q:'What is the difference between enterprise value and equity value?',a:'Equity value is the market value of the shares: price times diluted shares. Enterprise value is the value of the operating business to all capital providers: equity value plus debt, preferred stock and noncontrolling interest, minus cash. Use EV with metrics before interest such as revenue and EBITDA; use equity value with metrics after interest such as net income.',p:'Why subtract cash?'},
    {c:'EV',q:'Why do you add debt and preferred stock but subtract cash in the EV bridge?',a:'A buyer of the whole business assumes the debt and preferred claims, so they are part of the price; it also receives the cash, which it could use to repay debt, so cash reduces the effective price. Operating liabilities like payables are not added because they are already captured in working capital and in EBITDA.',p:'Should you add operating leases?'},
    {c:'EV',q:'How do you calculate diluted shares?',a:'Basic shares plus the dilutive effect of options, warrants, RSUs and convertibles. For options use the treasury stock method: count only in-the-money options, assume exercise, and assume the proceeds repurchase shares at the current price, so the net new shares are options times one minus strike over price. RSUs add in full. Convertibles add face value divided by conversion price if in the money, and then come out of debt.',p:'Why only in-the-money options?'},
    {c:'EV',q:'Can enterprise value be negative? Can equity value?',a:'Enterprise value can be negative when cash exceeds market cap plus debt, which happens with tiny or distressed companies the market thinks will burn the cash. Market equity value cannot be negative because a share price cannot go below zero, though book equity can.',p:'What does a negative EV imply about the business?'},
    {c:'EV',q:'Does issuing stock change enterprise value? Raising debt? Paying a dividend?',a:'In theory none of them do. Issuing stock raises equity value and cash equally. Raising debt raises debt and cash equally. A dividend lowers equity value and cash equally. EV only changes when the operating business changes, for example when cash is spent on an operating asset or when expected cash flows change.',p:'What about a buyback?'},
    {c:'EV',q:'Which is normally larger, enterprise value or equity value?',a:'Enterprise value, because most companies carry net debt. When a company has more cash than debt, equity value exceeds enterprise value, which is common in cash-rich technology companies.',p:'How does that affect which multiple you quote?'},
    {c:'EV',q:'A company has large operating leases. Do they belong in enterprise value?',a:'It depends on the accounting and on consistency. Under IFRS 16 all leases are capitalized and lease liabilities are debt-like, so include them and use EBITDA that excludes lease expense. Under US GAAP operating lease costs stay in EBITDA, so you usually exclude the lease liability, or you add it and use EBITDAR. Whatever you do, the numerator and the metric must match.',p:'Why does EV/EBITDAR exist?'},
    {c:'EV',q:'Why do you use diluted rather than basic shares for equity value?',a:'Because options, RSUs and convertibles are real claims that will become shares; valuing only basic shares would overstate each share\'s value. Diluted shares give the per-share value that an acquirer would actually pay for the whole equity.',p:'How does the share price affect the diluted count?'},
    {c:'Valuation',q:'What are the main valuation methodologies and how do they usually rank?',a:'Comparable companies, precedent transactions and DCF, with LBO analysis as a fourth for financial buyers. Precedents are usually highest because they include a control premium; LBO is usually the floor because sponsors need 20%+ returns without synergies; comps and DCF sit in between, with DCF most sensitive to assumptions. Rankings are tendencies, not rules.',p:'When would a DCF be highest?'},
    {c:'Valuation',q:'How do you select comparable companies?',a:'Same industry and business model first, then similar size, growth, margins, geography and capital structure. Aim for five to ten peers that investors would see as substitutes. Fewer good comps beat many loose ones. Then compute equity value and EV for each and look at the 25th percentile, median and 75th percentile multiples.',p:'What if there are no good comps?'},
    {c:'Valuation',q:'Which multiples do you use, and when?',a:'EV/EBITDA is the default: capital-structure and tax neutral and close to cash flow. EV/Revenue for unprofitable or early-stage companies. EV/EBIT when capital intensity matters. P/E for mature companies with similar leverage and for banks, alongside price-to-book. Industry-specific ones such as EV/EBITDAR for retailers and airlines, P/FFO for REITs, EV/EBITDAX for oil and gas producers.',p:'Why does EV/EBITDA flatter capital-intensive companies?'},
    {c:'Valuation',q:'Why would you use EV/EBITDA rather than P/E?',a:'P/E is after interest and taxes, so it is distorted by leverage, tax rates and one-time items. EV/EBITDA compares the whole business before financing, which makes companies with different capital structures comparable, and EBITDA is a reasonable proxy for operating cash flow. P/E still matters for equity investors and for banks.',p:'When is P/E the better multiple?'},
    {c:'Valuation',q:'What is a control premium and why is it paid?',a:'The amount above the unaffected trading price that a buyer pays to acquire the whole company, typically 20 to 40 percent. Shareholders will not tender at market, and the buyer expects to extract value through control: synergies, strategy changes, financial engineering. Precedent transactions capture it; trading comps do not.',p:'How does that affect the ranking of methods?'},
    {c:'Valuation',q:'How would you value a bank, a REIT and a software company?',a:'A bank: price-to-book and P/E, plus a dividend discount model, because interest is its core business and EV is meaningless. A REIT: price-to-FFO or AFFO and net asset value, because real-estate depreciation is not economic. A software company: EV/Revenue if unprofitable, EV/EBITDA once profitable, with growth and gross margin driving the multiple, plus a DCF when cash flows are predictable.',p:'Why not EV/EBITDA for a bank?'},
    {c:'Valuation',q:'LTM versus NTM multiples: which do you prefer?',a:'NTM is forward-looking, consistent with valuation as the present value of future cash flows, and it washes out one-time items, but it relies on estimates. LTM is actual and audited. Bankers show both; for high-growth companies forward multiples matter more, for stable companies the difference is small.',p:'How do you handle a company with no analyst estimates?'},
    {c:'Valuation',q:'Two companies have the same growth and margins. Why might they trade at different multiples?',a:'Risk and quality: customer concentration, cyclicality, competitive position, governance, accounting quality, capital intensity, liquidity of the stock, geography and currency, and the capital structure if using an equity multiple. A multiple compresses all of a DCF\'s assumptions into one number, so anything that changes risk or reinvestment needs changes it.',p:'Which of those would you investigate first?'},
    {c:'Valuation',q:'How do you value a private company?',a:'Same methods with adjustments: comps and precedents from public peers and deals, a DCF with a WACC built from peer betas, and often an illiquidity discount of roughly 10 to 30 percent because the shares cannot be sold easily. Be careful with reported financials: private companies often run personal expenses through the business or under-report, so normalize EBITDA.',p:'How do you estimate beta for a private company?'},
    {c:'Valuation',q:'What is a football field and how is it used?',a:'A chart with one horizontal bar per valuation method showing its low-to-high range: trading comps, precedents, DCF under different assumptions, LBO, and reference bars like the 52-week range and analyst targets. The board uses it to see where an offer sits across methods. You triangulate across the bars; you never average them.',p:'What would make you weight one bar more?'},
    {c:'DCF',q:'Walk me through a DCF.',a:'Project unlevered free cash flow for five to ten years: EBIT times one minus the tax rate, plus D&A, minus capex, minus increases in working capital. Compute WACC: cost of equity from CAPM, after-tax cost of debt, weighted at market values. Compute terminal value with an exit multiple or the Gordon growth formula. Discount the cash flows and terminal value to the present to get enterprise value. Subtract net debt, preferred and noncontrolling interest for equity value, divide by diluted shares for the implied price, then sensitize.',p:'Why unlevered rather than levered cash flow?'},
    {c:'DCF',q:'How do you calculate unlevered free cash flow, and why not subtract interest?',a:'EBIT times one minus the tax rate, plus D&A, minus capital expenditures, minus the increase in net working capital. Interest is excluded because UFCF measures the cash available to all capital providers before financing; the cost of debt and its tax shield are captured in WACC instead. Subtracting interest and discounting at WACC would double count it.',p:'How would you get equity value directly?'},
    {c:'DCF',q:'How do you calculate WACC and the cost of equity?',a:'WACC is the market-value weighted average: equity weight times cost of equity plus debt weight times pre-tax cost of debt times one minus the tax rate, plus preferred if any. Cost of equity comes from CAPM: risk-free rate, typically the ten-year Treasury, plus beta times the equity risk premium, roughly five to six percent, sometimes with a size premium. Cost of debt is the yield on the company\'s bonds or an estimate from its credit rating.',p:'Why market weights rather than book weights?'},
    {c:'DCF',q:'What is beta, and how do you estimate it for a private company?',a:'Beta measures a stock\'s sensitivity to market moves, the systematic risk that CAPM prices. For a private company take public peers\' levered betas, unlever each one using its debt-to-equity and tax rate to isolate business risk, take the median, and relever it at the target\'s capital structure. The formulas: unlevered beta equals levered beta divided by one plus one minus the tax rate times debt over equity, and the reverse to relever.',p:'Why does leverage raise beta?'},
    {c:'DCF',q:'Exit multiple versus perpetuity growth: how do you choose and check them?',a:'The exit multiple applies a current trading multiple to the final year\'s EBITDA; it is market-based and common in banking. Perpetuity growth capitalizes the final cash flow at a growth rate near long-run inflation or GDP. Use both and cross-check: back out the growth rate implied by the exit multiple and the multiple implied by the growth rate. If an exit multiple implies six percent perpetual growth, it is too rich.',p:'What growth rate would worry you?'},
    {c:'DCF',q:'What share of a DCF is usually terminal value, and what does that tell you?',a:'Often 60 to 80 percent, more for high-growth companies. It tells you the answer depends mostly on the terminal assumptions and the discount rate rather than on the near-term projection, which is why you present sensitivity tables on WACC against exit multiple or terminal growth rather than a single number.',p:'What would you do if terminal value were 95 percent of EV?'},
    {c:'DCF',q:'Why use the mid-year convention?',a:'Cash flows arrive throughout the year, not on the last day, so discounting each year\'s cash flow by a half-year less is more accurate. It raises the present value slightly. With an exit multiple the terminal value is still discounted from the end of the final year, because the multiple applies at that date.',p:'Does it apply to the Gordon growth terminal value?'},
    {c:'DCF',q:'What moves a DCF more: a one-point change in WACC or a one-point change in terminal growth?',a:'For most companies a one-point change in WACC, because it rescales every cash flow and the terminal value; terminal growth only affects the terminal value, though for a low-WACC, high-growth company the two can be comparable since the spread between WACC and g drives the perpetuity. Either way, both dwarf a one-point change in a single year\'s revenue growth.',p:'What happens as g approaches WACC?'},
    {c:'DCF',q:'How do you get from enterprise value to an implied share price?',a:'Subtract net debt, that is debt minus cash, plus preferred stock and noncontrolling interest, and any other debt-like items, to get equity value. Divide by diluted shares, computed with the treasury stock method at the implied price, which technically makes it circular; in practice you iterate or use the current share count.',p:'Why might the dilution be circular?'},
    {c:'DCF',q:'What are the biggest weaknesses of a DCF, and when would you avoid one?',a:'It is only as good as the assumptions, it is dominated by the terminal value, and small changes in WACC or growth swing it widely. Avoid or discount it for early-stage companies with negative or unpredictable cash flows, for banks where interest is operating, and for cyclical businesses where the projection year matters enormously.',p:'How do you value a bank instead?'},
    {c:'M&A',q:'Walk me through a merger model.',a:'Set the purchase price and premium, the financing mix of cash, debt and stock, and the synergies. Combine the income statements line by line. Subtract after-tax foregone interest on cash used and after-tax interest on new debt, add after-tax synergies, and add new shares issued if stock is used. Pro forma net income divided by pro forma shares gives pro forma EPS; compare it with the buyer\'s standalone EPS to judge accretion or dilution, then sensitize on price, mix and synergies.',p:'Which inputs drive accretion the most?'},
    {c:'M&A',q:'How do you quickly tell whether a deal is accretive?',a:'Compare the target\'s earnings yield at the purchase price, net income divided by price, with the after-tax cost of the currency: foregone interest times one minus the tax rate for cash, the interest rate times one minus the tax rate for debt, and the buyer\'s earnings yield, one over its P/E, for stock. If the yield bought exceeds the cost paid, it is accretive. For all-stock deals: buyer P/E above the target\'s P/E at the offer means accretive.',p:'Why is stock usually the most expensive currency?'},
    {c:'M&A',q:'Why do companies make acquisitions?',a:'Growth faster than organic, cost and revenue synergies, new products, customers or geographies, buying technology or talent, consolidating a fragmented market for pricing power, defending against a competitor, or financial reasons like cheap debt and EPS accretion. The deal creates value only if the price is below the standalone value plus the synergies the buyer can actually realize.',p:'Why do most acquisitions fail to create value?'},
    {c:'M&A',q:'What are synergies, and which kind is more credible?',a:'Cost synergies remove duplicated expenses: headcount, facilities, procurement, systems. Revenue synergies come from cross-selling, pricing or distribution. Bankers and investors trust cost synergies far more because management controls them; revenue synergies depend on customers. Value them after tax and after one-time integration costs, phased in over two or three years.',p:'How much of the synergy value should go to the seller?'},
    {c:'M&A',q:'What happens to the target\'s balance sheet in purchase accounting?',a:'The target\'s assets are written up to fair value, which creates deferred tax liabilities on the write-ups. The target\'s old goodwill and equity are eliminated. New goodwill is the plug: purchase price minus the fair value of net identifiable assets. The buyer\'s side shows the consideration: cash paid, new debt or new shares, and transaction fees reduce cash or equity.',p:'Why does a write-up create a deferred tax liability?'},
    {c:'M&A',q:'Cash versus stock versus debt: what are the trade-offs?',a:'Cash is cheapest if the buyer has it, but it uses liquidity and foregoes interest. Debt is cheap after tax but adds leverage and covenants. Stock preserves cash and shares risk with the target\'s holders, but it dilutes ownership and costs the buyer\'s earnings yield; it is attractive when the buyer\'s stock is richly valued. Sellers often prefer cash for certainty, or stock for tax deferral and upside.',p:'When would a buyer with cash still use stock?'},
    {c:'M&A',q:'Can an accretive deal destroy value, or a dilutive deal create it?',a:'Yes to both. Accretion only compares EPS, so borrowing cheaply to buy an overpriced target is accretive while destroying value. A dilutive deal, say a high-multiple buyer purchasing a fast-growing company, can create value if the target\'s cash flows and synergies are worth more than the price. The right test is price against intrinsic value plus synergies.',p:'So why do boards care about accretion?'},
    {c:'M&A',q:'What is an exchange ratio, and what is the difference between fixed and floating?',a:'The number of buyer shares issued per target share: offer price divided by buyer share price. With a fixed ratio the number of shares is locked and the deal value moves with the buyer\'s stock, so the target bears price risk. With a floating ratio the value per share is fixed and the share count adjusts, so the buyer bears the risk. Collars combine the two.',p:'Who prefers a fixed ratio?'},
    {c:'M&A',q:'What is the difference between a strategic and a financial buyer?',a:'A strategic buyer is an operating company that can realize synergies and often pays with stock; it can usually pay more. A financial buyer is a sponsor that relies on leverage, operational improvement and an exit in three to seven years; it needs a 20%+ return and has no synergies, so it is more price disciplined. In an auction the strategic usually wins on price, the sponsor on speed and certainty.',p:'When does a sponsor outbid a strategic?'},
    {c:'LBO',q:'Walk me through an LBO.',a:'A sponsor buys a company using a large amount of debt and a smaller equity check. Set the purchase price and leverage, build sources and uses, project the statements and free cash flow, sweep cash flow to repay debt each year, and exit after three to seven years at an exit multiple on EBITDA. Exit equity is exit EV minus remaining debt; divided by the equity invested that gives MOIC, and annualized it gives IRR. Returns come from debt paydown, EBITDA growth and multiple expansion.',p:'Why does leverage increase returns?'},
    {c:'LBO',q:'Why do private equity firms use leverage?',a:'It amplifies equity returns: the sponsor funds only part of the price, and the company\'s own cash flow repays the debt, shifting value to equity. Interest is tax-deductible. Debt also disciplines management. The cost is risk: fixed interest and amortization can sink the company in a downturn, which is why stable cash flows matter.',p:'What limits the amount of debt?'},
    {c:'LBO',q:'What makes a good LBO candidate?',a:'Stable, predictable cash flows to service debt, a strong market position, low capital and working-capital needs, hard assets for collateral, opportunities to cut costs or improve margins, a capable management team willing to roll equity, a reasonable purchase price, and a clear exit route. High-growth, capital-hungry or cyclical businesses are poor candidates.',p:'Why is low capex important?'},
    {c:'LBO',q:'What drives LBO returns?',a:'Three things: debt paydown, which transfers value from lenders to equity; EBITDA growth from revenue growth and margin improvement; and multiple expansion, selling at a higher multiple than you paid. Price paid at entry is the lever the sponsor controls most. Fees, taxes and timing also matter at the margin.',p:'Which driver is least reliable?'},
    {c:'LBO',q:'How can a sponsor increase IRR?',a:'Pay a lower entry multiple, use more leverage if cash flow supports it, grow EBITDA through revenue and margins, pay down debt faster, sell at a higher multiple, return cash earlier through a dividend recapitalization, or exit sooner. Everything comes back to buying well, improving the business and managing the capital structure.',p:'What does a dividend recap do to MOIC?'},
    {c:'LBO',q:'What is the difference between MOIC and IRR?',a:'MOIC is the cash-on-cash multiple: exit equity divided by invested equity, ignoring time. IRR is the annualized return that accounts for timing. Rules of thumb over five years: 2x is about 15%, 2.5x about 20%, 3x about 25%; 2x over three years is about 26%. Sponsors want both: a strong multiple and a strong annualized return.',p:'Which deal is better: 2x in 3 years or 3x in 7?'},
    {c:'LBO',q:'What are sources and uses?',a:'Uses are what the deal needs to pay for: the equity purchase price, refinancing of existing debt, transaction and financing fees, and sometimes cash to the balance sheet. Sources are how it is funded: each debt tranche, any existing cash used, management rollover, and the sponsor\'s equity, which is the plug. The two totals must match.',p:'What percentage equity is typical today?'},
    {c:'LBO',q:'What are the typical debt tranches in an LBO and how do they differ?',a:'From safest and cheapest to riskiest and most expensive: a revolver for liquidity, senior secured term loans with floating rates and amortization, senior notes, subordinated or mezzanine debt sometimes with PIK interest, and finally sponsor equity. Seniority in a default drives the interest rate, and lenders size the total off EBITDA multiples and coverage ratios.',p:'What is PIK interest?'},
    {c:'LBO',q:'How does an LBO analysis set a valuation floor?',a:'Solve for the purchase price at which a sponsor still earns its target return, say 20 to 25 percent IRR, given achievable leverage, projected cash flows and a reasonable exit multiple. A sponsor cannot pay more than that, and strategics with synergies can usually pay more, so the LBO value is the floor of the football field.',p:'What assumptions move that floor the most?'},
    {c:'LBO',q:'What is a dividend recapitalization, and what is management rollover?',a:'A dividend recap raises new debt on the portfolio company to pay the sponsor a dividend before exit; it returns cash early and lifts IRR, at the cost of higher leverage. Management rollover is managers reinvesting part of their sale proceeds as equity alongside the sponsor, aligning incentives, often with an additional option pool.',p:'How do lenders feel about recaps?'},
    {c:'LBO',q:'Quick paper LBO: EBITDA 100, bought at 8x with 5x debt, EBITDA grows to 150 in five years, exit at 8x, debt paid down to 300. Returns?',a:'Entry EV 800, debt 500, equity 300. Exit EV 150 times 8 is 1,200; minus 300 of debt leaves 900 of equity. 900 over 300 is 3.0x, which over five years is about 25% IRR.',p:'What if the exit multiple were 7x?'}
  ];

      else if(k==='ev'){const p=rng.step(10,100,10),s=rng.step(20,200,20),cash=rng.step(50,500,50),debt=rng.step(0,1000,100),pref=rng.chance(0.4)?rng.step(50,200,50):0;const ev=p*s-cash+debt+pref;g={title:'EV in your head',given:[['Share price',ps(p)],['Diluted shares',mm(s)],['Cash',$(cash)],['Debt',$(debt)],...(pref?[['Preferred stock',$(pref)]]:[])],steps:[S('Enterprise value',ev,'$',{formula:'Price × shares − cash + debt + preferred',explain:`${$(p*s)} − ${$(cash)} + ${$(debt)}${pref?' + '+$(pref):''} = <b>${$(ev)}</b>.`})]};}

    {q:'EBITDA is not a GAAP line. The standard way to compute it from the filings:',options:['Operating income plus D&A taken from the cash flow statement','Gross profit minus SG&A, leaving D&A inside COGS','Revenue minus COGS minus SG&A, with no add-backs','Operating income plus interest expense'],explain:'EBIT + D&A. The CFS shows the full D&A charge; the IS usually hides it inside other lines.'},

    {q:'Goodwill is created when…',options:['An acquirer pays more than the fair value of the target\'s net identifiable assets','A company\'s brand or customer loyalty increases in value','Retained earnings exceed paid-in capital','An asset is written up to fair value in a revaluation'],explain:'Only acquisitions create goodwill. Internally built brands never appear on the balance sheet.'},
    {q:'Accumulated depreciation is…',options:['A contra-asset that reduces gross PP&E to net PP&E','A long-term liability for future asset replacement','Cumulative depreciation expense held inside retained earnings','A reserve account within shareholders\' equity'],explain:'Each year\'s depreciation expense accumulates in this contra account; net PP&E = gross PP&E − accumulated depreciation.'},
    {q:'Deferred revenue is a liability because…',options:['The company has taken cash for a product or service it still owes','It represents revenue the company may have to refund','It is a loan from customers that accrues interest','Unearned revenue reduces retained earnings until recognized'],explain:'Cash came first. Until delivery there is an obligation. On delivery, deferred revenue falls and revenue is recognized.'},

    {q:'A company buys $100 of inventory on credit. Immediately after…',options:['Inventory +100, accounts payable +100; cash and net income unchanged','Inventory +100, cash −100; net income unchanged','Inventory +100, COGS +100; net income −100','Accounts payable +100, retained earnings −100'],explain:'Nothing hits the income statement until the goods are sold, and nothing hits cash until the supplier is paid.'},
    {q:'A deferred tax liability most commonly arises when…',options:['Tax depreciation runs faster than book depreciation, so cash taxes are deferred to later years','The company has overpaid taxes in prior years and expects a refund when it files','Net operating losses from prior years are carried forward against future taxable income','Revenue is deferred for book purposes but taxed immediately when the cash is received'],explain:'Accelerated tax depreciation lowers cash taxes now; book taxes are higher; the difference is owed later. The last option describes a deferred tax asset.'},
    {q:'Book equity differs from market equity value because…',options:['Book equity is historical capital plus retained earnings; market value prices future cash flows','Book equity includes debt and preferred stock, while market value counts only common shares','Market value is reported net of treasury stock and accumulated other comprehensive income','They are equal on the reporting date and diverge only as the share price moves afterward'],explain:'Price-to-book above 1 means the market expects returns above the cost of equity; nothing about the past guarantees that.'}

  const CFS_CONCEPTS=[
    {q:'The cash flow statement (indirect method) starts with…',options:['Net income','EBITDA','Revenue collected in cash','The opening cash balance'],explain:'Link #1: net income from the IS is the first line of CFO; everything below reconciles accrual earnings to cash.'},
    {q:'Why is D&A added back in cash from operations?',options:['It reduced net income but involved no cash this period','It is a financing cost that belongs in a different section','It is tax-deductible, so it creates a cash inflow','It offsets the capital expenditures shown in investing'],explain:'The cash left when the asset was bought (investing). Depreciation only spreads that cost over time on the IS.'},
    {q:'An increase in accounts receivable…',options:['Reduces cash from operations: revenue was recorded but not collected','Increases cash from operations: customers owe more','Appears in investing as a loan to customers','Has no cash effect until the receivable is written off'],explain:'Net income counted the sale; the cash is still with the customer. Subtract the increase.'},
    {q:'The simplest definition of free cash flow:',options:['Cash from operations minus capital expenditures','Net income plus D&A','EBITDA minus taxes','Cash from operations minus dividends'],explain:'What is left after running and reinvesting in the business, before creditors and shareholders are paid.'},
    {q:'Net income is positive but cash from operations is negative. Most likely…',options:['Receivables or inventory grew far faster than sales','Depreciation expense was unusually high for the year','The company paid an unusually large dividend to holders','Capital expenditures ran far ahead of depreciation'],explain:'Profitable on paper, bleeding cash into working capital. Dividends and capex are not in CFO; D&A is added back.'},
    {q:'Under US GAAP, interest paid is classified as…',options:['Operating','Financing','Investing','Either operating or financing, at the company\'s election'],explain:'Because interest is already inside net income. (IFRS allows a choice; principal repayment is always financing.)'},
    {q:'Which of these is NOT a cash flow?',options:['Depreciation expense','A share repurchase','Repayment of a term loan','Purchase of a competitor'],explain:'Depreciation is an accounting allocation. The other three move real cash in financing or investing.'},
    {q:'The sum of operating, investing and financing cash flows equals…',options:['The change in the cash balance on the balance sheet','Free cash flow','Net income after non-cash adjustments','The change in retained earnings'],explain:'Link #7. Beginning cash + net change = ending cash on the BS.'},
    {q:'A machine with book value $50 is sold for $70 cash. On the cash flow statement…',options:['CFO subtracts the $20 gain; CFI shows +$70 of proceeds','CFO shows +$70 of proceeds','CFI shows +$20, the gain','CFO adds back $50 and CFI shows +$20'],explain:'The gain is inside net income but is not operating cash, so it is removed from CFO; the full proceeds are an investing inflow.'},
    {q:'Which item increases cash from operations?',options:['An increase in accounts payable','An increase in inventory','An increase in prepaid expenses','A decrease in deferred revenue'],explain:'Paying suppliers later keeps cash in the company. The other three all consume cash.'},
    {q:'Unlevered free cash flow differs from levered FCF because it…',options:['Excludes interest, so it is available to all capital providers','Excludes taxes, since those depend on leverage','Excludes capital expenditures','Includes dividends paid to shareholders'],explain:'UFCF = EBIT(1 − t) + D&A − CapEx − ΔNWC. Levered FCF is after interest and mandatory repayment: what is left for equity.'},
    {q:'A company stretches supplier payments from 30 to 60 days. During the transition year…',options:['Cash from operations rises as accounts payable build','Net income rises because costs are deferred','Cash from financing rises because suppliers are lenders','Nothing changes: expenses are recognized when incurred'],explain:'A one-time working-capital release: payables rise, cash stays in the company. It does not repeat unless terms stretch again.'},
    {q:'Which pattern most suggests poor earnings quality?',options:['Rising net income with falling cash from operations over several years','Rising capex alongside rising D&A','Rising cash from financing with a rising cash balance','Falling net income with rising cash from operations'],explain:'Earnings that never turn into cash usually mean aggressive revenue recognition or ballooning working capital.'}

  const LINK_CONCEPTS=[
    {q:'Net income from the income statement goes to…',options:['The top of the cash flow statement and into retained earnings','The top of the cash flow statement and into cash','Retained earnings and into accounts receivable','Cash from financing and into APIC'],explain:'Two destinations: it starts the CFS and accumulates in retained earnings on the BS.'},
    {q:'D&A links the statements by…',options:['Reducing net income, being added back in CFO, and reducing net PP&E','Reducing net income, appearing in investing, and reducing cash','Reducing EBITDA, being added back in financing, and reducing debt','Increasing PP&E on the balance sheet as assets are maintained'],explain:'Links #2 and #4: non-cash on the IS, add-back on the CFS, lower net PP&E on the BS.'},
    {q:'CapEx on the cash flow statement…',options:['Raises PP&E; depreciation then brings it down over time','Is expensed on the income statement in the year it is spent','Raises PP&E and retained earnings together','Reduces net income and PP&E in the same year'],explain:'Capex is capitalized, not expensed. The IS only sees it through depreciation over the asset\'s life.'},
    {q:'The net change in cash on the CFS…',options:['Equals the change in the cash line on the balance sheet','Equals net income plus D&A','Equals free cash flow for the period','Equals the change in retained earnings'],explain:'The CFS exists to explain how the balance-sheet cash line moved.'},
    {q:'Debt raised in financing activities…',options:['Raises cash and debt now; interest hits the income statement later','Raises cash and equity now; principal hits the income statement later','Raises debt and reduces retained earnings by the interest','Appears in investing because the proceeds are invested'],explain:'Link #6. The IS is untouched at issuance; the coupon shows up in later periods.'},
    {q:'Why does the CFS adjust for changes in operating working capital?',options:['The income statement books revenue and expenses when earned, not when cash moves','Working-capital items are financing flows that net income ignores','Taxes are computed on cash income rather than accrual income','To reconcile EBITDA with operating income'],explain:'Link #3. Accrual earnings vs cash: receivables, inventory and payables bridge the gap.'},
    {q:'If you could only have one statement to judge a company\'s health:',options:['The cash flow statement: cash is hardest to manipulate and you can infer much of the rest','The income statement: profit is what investors ultimately buy','The balance sheet: it shows everything the company owns and owes','The statement of equity: it ties the other three together'],explain:'Standard answer. Cash pays creditors and shareholders, and the CFS reveals working-capital and capex reality.'},
    {q:'With the income statement and two balance sheets you can…',options:['Rebuild the cash flow statement from net income and the balance changes','Rebuild only the financing section','Rebuild nothing: the CFS needs its own ledger','Rebuild the income statement for the following year'],explain:'Every cash flow is a change in a balance-sheet line. Net income plus the deltas gives you the CFS.'},
    {q:'Depreciation rises by $10 with a 40% tax rate. Cash changes by…',options:['+$4','−$6','−$10','+$10'],explain:'NI falls 6, the 10 add-back more than offsets it: cash rises by the tax shield, 10 × 40%.'},
    {q:'A $100 share buyback touches…',options:['The CFS (financing −100) and the BS (cash −100, equity −100); the IS is untouched','All three statements, since the lower share count raises EPS and therefore net income','The IS (a $100 expense) and the BS (cash −100); the CFS shows it inside operations','Only the BS (cash −100, treasury stock −100); the CFS shows nothing, since there is no expense'],explain:'No expense, so no IS effect. Fewer shares raise EPS later, but net income itself is unchanged.'},
    {q:'A company prepays $120 of rent on Dec 31 for the following year. Over that next year…',options:['It expenses $10 a month; CFO adds back the shrinking prepaid asset; cash is unchanged','It expenses $120 immediately on the IS; nothing on the CFS','There is no IS effect; CFO subtracts $120 as the prepaid is used','Revenue falls by $120 as rent is netted against sales'],explain:'The cash left on Dec 31 (prepaid asset up). During the year the expense is recognized and the asset unwinds: a non-cash expense, so it is added back.'}

  const EV_CONCEPTS=[
    {q:'Enterprise value represents…',options:['The value of the operating business to all capital providers','The market value of the equity plus cash on hand','The book value of assets minus liabilities','The price a buyer pays for the shares alone'],explain:'The price of the whole operating business, debt-free and cash-free, shared by lenders, preferred holders and shareholders.'},
    {q:'Why subtract cash when moving from equity value to EV?',options:['Cash is a non-operating asset a buyer effectively gets back','Cash has already been counted inside net income','Cash is owed to creditors before shareholders','Cash earns interest, which is a non-operating expense'],explain:'Buy a company for 100 that holds 20 of cash and you really paid 80 for the business.'},
    {q:'Why add preferred stock and noncontrolling interest to EV?',options:['They are claims on the business whose share of earnings sits inside consolidated EBITDA','They are classified as debt under GAAP, so they belong with the other borrowings','They reduce the cash that would otherwise be available to common shareholders at exit','They carry a higher cost of capital than common equity, which raises the WACC'],explain:'Consolidated EBITDA includes 100% of subsidiaries and is before preferred dividends, so the matching value must include those claims.'},
    {q:'Under the treasury stock method, which options count?',options:['In-the-money options, with assumed proceeds used to repurchase shares at the current price','All vested options regardless of strike, with the proceeds added to cash in the EV bridge','All outstanding options at any strike, since every option could eventually be exercised','In-the-money options only, with no repurchase assumed, so each option adds a full share'],explain:'Diluted shares = basic + options − options × strike ÷ price, for options with strike below the current price.'},
    {q:'Can enterprise value be negative?',options:['Yes, when cash exceeds market cap plus debt','No, because market cap cannot be negative','Only when book equity is negative','Only for companies with no debt'],explain:'Rare, usually tiny or distressed companies: the market values the operations at less than the net cash.'},
    {q:'For valuation, equity value equals share price times…',options:['Diluted shares outstanding via the treasury stock method','Basic shares outstanding on the cover of the 10-K','Authorized shares','Shares outstanding plus all options at any strike'],explain:'Every claim that will become a share belongs in equity value.'},
    {q:'$200 cash, $500 debt, $1,000 market cap. The company repays $100 of debt with cash. EV…',options:['Is unchanged at $1,300','Falls to $1,200','Rises to $1,400','Falls to $1,100'],explain:'Cash 100, debt 400: net debt is still 300. Financing moves do not change the value of the business.'},
    {q:'Which items are treated as debt-like in the EV bridge?',options:['Finance leases, preferred stock, unfunded pensions, noncontrolling interest','Accounts payable, accrued wages and deferred revenue','Operating accruals, warranty reserves and customer deposits','Goodwill, deferred tax liabilities and treasury stock'],explain:'Payables, accruals and deferred revenue are operating liabilities captured in working capital, not financing claims.'},
    {q:'$50 share price, 100mm diluted shares, $300 cash, $800 debt. EV?',options:['$5,500','$5,000','$4,500','$6,100'],explain:'5,000 − 300 + 800 = 5,500.'},
    {q:'Two companies have identical operations and EV, but A carries more debt. A has…',options:['A lower equity value','A higher equity value','The same equity value','A higher EV/EBITDA multiple'],explain:'Equity = EV − net debt. Same pie, bigger slice for lenders.'},
    {q:'A company\'s convertible notes are in the money. In the EV bridge you should…',options:['Add the conversion shares to the diluted count and exclude the notes from debt','Count the notes as debt and also add the conversion shares','Ignore both until conversion actually happens','Exclude the notes from debt but leave the share count unchanged'],explain:'If-converted method. Never double count: a convertible is either shares or debt.'},
    {q:'Why is equity value, not EV, the right numerator for net income?',options:['Net income is after interest, so it belongs only to shareholders','Net income is before interest, so it belongs to all investors','EV already includes net income through retained earnings','Net income is a cash metric and EV is accrual-based'],explain:'Apples to apples: metrics after interest pair with equity value; metrics before interest pair with EV.'}
  ];
  const MULT_CONCEPTS=[
    {q:'Why is EV/EBITDA generally preferred to P/E for comparing companies?',options:['It is unaffected by capital structure and tax rates, and close to operating cash flow','It is always lower than P/E, so the resulting valuations look more conservative to clients','EBITDA is an audited GAAP figure while net income is subject to management judgment','It captures capital expenditures and working capital, which P/E ignores completely'],explain:'Two companies with the same business but different debt have different net income and P/E, yet the same EV/EBITDA.'},
    {q:'A P/E of 20x implies an earnings yield of…',options:['5%','20%','2%','0.5%'],explain:'1 ÷ 20. Earnings yield is also the cost of using stock as acquisition currency.'},
    {q:'Same industry: A trades at 12x EBITDA, B at 8x. The most likely reason A trades higher:',options:['Higher expected growth, better margins or lower risk','A carries more debt, which raises EV','A has fewer shares outstanding','B\'s EBITDA is larger, so its multiple is lower'],explain:'A multiple is shorthand for a DCF: more growth or less risk means a higher multiple.'},
    {q:'Which pairing mismatches the numerator and the metric?',options:['EV / Net income','EV / EBITDA','Equity value / Net income','EV / Revenue'],explain:'Net income is after interest (shareholders only); EV includes the lenders\' claim.'},
    {q:'NTM multiples use…',options:['Projected next-twelve-month metrics','Last-twelve-month reported metrics','The average of the last three fiscal years','The next fiscal year only, not a rolling twelve months'],explain:'Forward-looking, like valuation itself. LTM is historical and verifiable; bankers show both.'},
    {q:'A company has negative EBITDA. Which multiple still works?',options:['EV / Revenue','EV / EBITDA on a forward basis only','P / E','EV / EBIT'],explain:'You cannot capitalize a negative number. Fall back to revenue, or to forward EBITDA once it turns positive.'},
    {q:'Why use the median rather than the mean of a comp set?',options:['One outlier can drag the mean; the median is robust to it','The median is always closer to the target\'s multiple','Means cannot be computed when a multiple is negative','Bank models default to the median'],explain:'One peer at 30x pulls a mean of 10x to 14x; the median barely moves.'},
    {q:'For a capital-intensive company, EV/EBIT compared with EV/EBITDA…',options:['Better reflects reinvestment needs, since D&A proxies maintenance capex','Is always lower, since EBIT is smaller than EBITDA','Ignores capital structure differences','Is distorted by interest expense'],explain:'EBITDA flatters businesses that must keep buying assets. EBIT, after D&A, is harsher and arguably fairer for them.'},
    {q:'A retailer leases all its stores while peers own theirs. On EV/EBITDA the retailer looks…',options:['More expensive, because rent reduces EBITDA while peers\' ownership costs sit below it; use EV/EBITDAR','Cheaper, because it carries less debt on its balance sheet and therefore a lower enterprise value','Identical, since lease payments and ownership costs are both operating costs for every company','Cheaper, because its EBITDA excludes store depreciation while the owners must deduct theirs'],explain:'Adding back rent (the R) puts lessees and owners on the same footing.'},
    {q:'If the share price rises 10% and nothing else changes, EV/EBITDA…',options:['Rises, because equity value and therefore EV rise','Is unchanged, because EV excludes equity price moves','Falls, because the earnings yield falls','Rises by exactly 10%'],explain:'EV = equity value − cash + debt, so EV rises by less than 10% unless the company has no net debt.'},
    {q:'EV/EBITDA of 8x with net debt of 2x EBITDA implies equity value of about…',options:['6x EBITDA','8x EBITDA','10x EBITDA','4x EBITDA'],explain:'Equity = EV − net debt = 8x − 2x = 6x EBITDA.'},
    {q:'Which multiple is most affected by a company\'s depreciation policy?',options:['EV / EBIT','EV / EBITDA','EV / Revenue','EV / EBITDAR'],explain:'EBIT is after D&A; the others are not.'},
    {q:'A company reports $50 of one-time restructuring charges inside operating expenses. For a trading comp you should…',options:['Add them back to EBITDA so the multiple reflects recurring earnings','Leave them in, since GAAP operating income includes them and so do the peers','Subtract them from enterprise value as a one-time cash cost the buyer avoids','Add them to net debt as a liability that an acquirer would inherit at closing'],explain:'Adjusted EBITDA strips non-recurring items. Watch for companies whose "one-time" charges recur every year.'}
